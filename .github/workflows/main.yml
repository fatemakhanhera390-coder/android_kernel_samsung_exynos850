name: A13X Suzume KernelSU Kernel

on:
  workflow_dispatch:
    inputs:
      neutron_tag:
        description: 'Neutron Clang release tag (30062026 = Clang 23; 30072026 = Clang 24)'
        required: true
        type: string
        default: '30062026'
      ksu_ref:
        description: 'backslashxx/KernelSU branch, tag, or commit'
        required: true
        type: string
        default: 'master'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: a13x-suzume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build A13X Kernel + AnyKernel3 ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KERNEL_REPO: Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850
      KERNEL_BRANCH: lineage-24.0
      DEFCONFIG: exynos850-a13nsxx_defconfig
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      LLVM: '1'
      LLVM_IAS: '1'
      NEUTRON_TAG: ${{ inputs.neutron_tag || '30062026' }}
      KSU_REF: ${{ inputs.ksu_ref || 'master' }}

    steps:
      - name: Checkout A13 kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize diagnostics directory
        if: always()
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/diagnostics"

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git jq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libelf-dev libncurses-dev libssl-dev python3 python-is-python3 \
            rsync dwarves zstd lz4 zip unzip file

      - name: Download Neutron Clang release
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$NEUTRON_TAG" =~ ^[0-9]{8}$ ]] || {
            echo "Invalid Neutron tag: $NEUTRON_TAG (expected DDMMYYYY)" >&2
            exit 1
          }
          API_URL="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/tags/${NEUTRON_TAG}"
          curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' "$API_URL" \
            -o "$RUNNER_TEMP/neutron-release.json"
          ASSET_URL="$(jq -r '[.assets[] | select(.name | endswith(".tar.zst"))][0].browser_download_url // empty' "$RUNNER_TEMP/neutron-release.json")"
          if [[ -z "$ASSET_URL" || "$ASSET_URL" == null ]]; then
            echo "No .tar.zst Neutron Clang asset found for tag $NEUTRON_TAG" >&2
            jq -r '.assets[].name' "$RUNNER_TEMP/neutron-release.json" || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/neutron-clang"
          curl -fL --retry 3 "$ASSET_URL" -o "$RUNNER_TEMP/neutron-clang.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/neutron-clang.tar.zst" -C "$RUNNER_TEMP/neutron-clang"
          test -x "$RUNNER_TEMP/neutron-clang/bin/clang"
          echo "$RUNNER_TEMP/neutron-clang/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/neutron-clang/bin/clang" --version
          "$RUNNER_TEMP/neutron-clang/bin/ld.lld" --version

      - name: Integrate backslashxx KernelSU (no SUSFS)
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh \
            -o "$RUNNER_TEMP/ksu-setup.sh"
          cd "$GITHUB_WORKSPACE/kernel"
          bash "$RUNNER_TEMP/ksu-setup.sh" "$KSU_REF"
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          echo "KernelSU source ref requested: $KSU_REF"
          git -C KernelSU rev-parse HEAD

      - name: Fix Clang sizeof-pointer warnings in OVT touchscreen test driver
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          FILE="drivers/input/touchscreen/ovt/td4150_spi/ovt_tcm_sec_fn_test.c"
          test -f "$FILE" || { echo "Expected touchscreen source not found: $FILE" >&2; exit 1; }
          python3 - "$FILE" <<'PYFIX'
          from pathlib import Path
          import re, sys

          path = Path(sys.argv[1])
          source = path.read_text()
          pattern = re.compile(
              r'snprintf\(\s*tcm_hcd->print_buf\s*,\s*'
              r'sizeof\(\s*tcm_hcd->print_buf\s*\)\s*,\s*"NG"\s*\)\s*;'
          )
          fixed, count = pattern.subn(
              'memcpy(tcm_hcd->print_buf, "NG", sizeof("NG"));', source
          )
          if count < 1:
              raise SystemExit(
                  'No expected sizeof(pointer) NG call found; source may have changed. '
                  'Inspect this file and the attached diagnostics before editing the patch.'
              )
          path.write_text(fixed)
          print(f'Fixed {count} snprintf(sizeof(pointer)) call(s) in {path}.')
          PYFIX
          git diff --check
          git diff -- "$FILE" > "$GITHUB_WORKSPACE/diagnostics/source-fixes.patch"
          cp "$FILE" "$GITHUB_WORKSPACE/diagnostics/ovt_tcm_sec_fn_test.c.patched"

      - name: Configure kernel
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          test -f Makefile
          test -f "arch/arm64/configs/$DEFCONFIG"
          SOURCE_VERSION="$(make -s kernelversion)"
          echo "Kernel source version: $SOURCE_VERSION"
          [[ "$SOURCE_VERSION" == "4.19.325" ]] || {
            echo "Unexpected kernel version: $SOURCE_VERSION (expected 4.19.325)" >&2
            exit 1
          }

          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" "$DEFCONFIG"

          scripts/config --file .config --enable KSU
          scripts/config --file .config --enable KALLSYMS
          scripts/config --file .config --enable KALLSYMS_ALL
          scripts/config --file .config --enable KPROBES
          scripts/config --file .config --set-str LOCALVERSION '-Suzume'
          scripts/config --file .config --disable LOCALVERSION_AUTO

          # Explicitly disable every SUSFS option present in this source/config.
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          config = Path('.config').read_text()
          symbols = sorted(set(re.findall(r'^(?:# )?(CONFIG_[A-Z0-9_]*SUSFS[A-Z0-9_]*)', config, re.M)))
          for symbol in symbols:
              subprocess.run(['scripts/config', '--file', '.config', '--disable', symbol.removeprefix('CONFIG_')], check=True)
          print(f'Disabled {len(symbols)} SUSFS config option(s). No SUSFS repository or patches are added by this workflow.')
          PY

          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" olddefconfig

          grep -Fxq 'CONFIG_KSU=y' .config || {
            echo 'KernelSU did not survive olddefconfig; aborting.' >&2
            exit 1
          }
          grep -Fxq 'CONFIG_KALLSYMS=y' .config
          grep -Fxq 'CONFIG_KALLSYMS_ALL=y' .config
          if grep -Eq '^CONFIG_[A-Z0-9_]*SUSFS[A-Z0-9_]*=y' .config; then
            echo 'A SUSFS option remains enabled; aborting.' >&2
            exit 1
          fi
          echo 'Final kernel release:'
          make -s ARCH="$ARCH" kernelrelease
          echo 'KernelSU and Suzume config verified; SUSFS config is disabled.'

      - name: Compile kernel Image and DTBs
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          {
            echo "Build started (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Command: make V=1 -j$(nproc --all) ARCH=$ARCH LLVM=$LLVM LLVM_IAS=$LLVM_IAS CROSS_COMPILE=$CROSS_COMPILE Image dtbs"
          } | tee "$GITHUB_WORKSPACE/diagnostics/kernel-build.log"
          make V=1 -j"$(nproc --all)" ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" Image dtbs 2>&1 | tee -a "$GITHUB_WORKSPACE/diagnostics/kernel-build.log"
          test -s arch/arm64/boot/Image
          file arch/arm64/boot/Image
          strings arch/arm64/boot/Image | grep -m1 'Linux version' || true

      - name: Package TWRP-flashable AnyKernel3 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          AK3="$RUNNER_TEMP/AnyKernel3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3"
          cp "$GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image" "$AK3/Image"
          cat > "$AK3/anykernel.sh" <<'AK3SCRIPT'
          ### AnyKernel3 Ramdisk Mod Script
          ## Suzume KernelSU for Samsung Galaxy A13X (SM-A135F / SM-A135M)
          properties() { '
          kernel.string=Suzume KernelSU for Samsung Galaxy A13X by MAX ARAF
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a13
          device.name2=a13x
          device.name3=a13nsxx
          device.name4=SM-A135F
          device.name5=SM-A135M
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3SCRIPT
          chmod 0755 "$AK3/anykernel.sh"
          rm -rf "$AK3/.git" "$AK3/.github"
          rm -f "$AK3/README.md" "$AK3/README" "$AK3/.gitignore"
          find "$AK3" -name placeholder -type f -delete

          cd "$AK3"
          zip -qr "$GITHUB_WORKSPACE/A13X-Suzume-KernelSU-AnyKernel3.zip" . \
            -x '*/.git/*' '*/README*' '*placeholder'
          unzip -t "$GITHUB_WORKSPACE/A13X-Suzume-KernelSU-AnyKernel3.zip"

          KRELEASE="$(cd "$GITHUB_WORKSPACE/kernel" && make -s ARCH=arm64 kernelrelease)"
          KSU_COMMIT="$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD)"
          KERNEL_COMMIT="$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD)"
          {
            echo "Kernel release: $KRELEASE"
            echo "Kernel source: https://github.com/$KERNEL_REPO/tree/$KERNEL_BRANCH"
            echo "Kernel source commit: $KERNEL_COMMIT"
            echo "KernelSU ref: $KSU_REF"
            echo "KernelSU commit: $KSU_COMMIT"
            echo "Neutron Clang tag: $NEUTRON_TAG"
            echo "Architecture: arm64"
            echo "Defconfig: $DEFCONFIG"
            echo "AnyKernel3 target: boot (A-only)"
            echo "SUSFS: disabled / not integrated by this workflow"
            echo "Note: A135F/A135M device boot testing has not been performed by CI."
          } > "$GITHUB_WORKSPACE/build-info.txt"
          sha256sum "$GITHUB_WORKSPACE/A13X-Suzume-KernelSU-AnyKernel3.zip" > "$GITHUB_WORKSPACE/sha256sum.txt"

      - name: Upload flashable kernel ZIP and build info
        uses: actions/upload-artifact@v4
        with:
          name: A13X-Suzume-KernelSU-AnyKernel3
          path: |
            A13X-Suzume-KernelSU-AnyKernel3.zip
            build-info.txt
            sha256sum.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnostics (runs even after a failed build)
        if: always()
        shell: bash
        run: |
          set +e
          DIAG="$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$DIAG"
          {
            echo "A13X Suzume Kernel build diagnostics"
            echo "UTC time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GitHub repository: $GITHUB_REPOSITORY"
            echo "Workflow run ID: $GITHUB_RUN_ID"
            echo "Workflow run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Runner OS: ${RUNNER_OS:-unknown}"
            echo "Runner arch: ${RUNNER_ARCH:-unknown}"
            echo "Kernel repo: $KERNEL_REPO"
            echo "Kernel branch: $KERNEL_BRANCH"
            echo "Defconfig: $DEFCONFIG"
            echo "Neutron release tag: $NEUTRON_TAG"
            echo "KernelSU requested ref: $KSU_REF"
            echo
            echo '--- Toolchain ---'
            command -v clang
            clang --version
            command -v ld.lld
            ld.lld --version
            echo
            echo '--- Kernel source ---'
            if [[ -d "$GITHUB_WORKSPACE/kernel/.git" ]]; then
              git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD
              git -C "$GITHUB_WORKSPACE/kernel" log -1 --format='%H%n%ad%n%s' --date=iso-strict
              git -C "$GITHUB_WORKSPACE/kernel" status --short
              git -C "$GITHUB_WORKSPACE/kernel" diff --check
              git -C "$GITHUB_WORKSPACE/kernel" diff -- drivers/input/touchscreen/ovt/td4150_spi/ovt_tcm_sec_fn_test.c
              if [[ -d "$GITHUB_WORKSPACE/kernel/KernelSU/.git" ]]; then
                echo '--- KernelSU commit ---'
                git -C "$GITHUB_WORKSPACE/kernel/KernelSU" rev-parse HEAD
              fi
              if [[ -f "$GITHUB_WORKSPACE/kernel/Makefile" ]]; then
                echo "Kernel version: $(make -s -C "$GITHUB_WORKSPACE/kernel" kernelversion 2>&1)"
                echo "Kernel release (if configured): $(make -s -C "$GITHUB_WORKSPACE/kernel" ARCH=arm64 kernelrelease 2>&1)"
              fi
            else
              echo 'Kernel source checkout is unavailable.'
            fi
          } > "$DIAG/build-environment.txt" 2>&1

          if [[ -f "$GITHUB_WORKSPACE/kernel/.config" ]]; then
            cp "$GITHUB_WORKSPACE/kernel/.config" "$DIAG/kernel.config"
            grep -E '^(CONFIG_(KSU|KPROBES|KALLSYMS|KALLSYMS_ALL|LOCALVERSION|LOCALVERSION_AUTO)|# CONFIG_.*SUSFS.* is not set|CONFIG_.*SUSFS.*=)' \
              "$GITHUB_WORKSPACE/kernel/.config" > "$DIAG/config-summary.txt" || true
          else
            echo 'Kernel .config was not generated.' > "$DIAG/config-summary.txt"
          fi

          if [[ -f "$DIAG/kernel-build.log" ]]; then
            grep -nE -i '(^|[[:space:]])(fatal )?error:|error generated|errors? generated|make\[[0-9]+\]: \*\*\*|Error [0-9]+|Broken pipe|warning:' \
              "$DIAG/kernel-build.log" > "$DIAG/errors-summary.txt" || true
            tail -n 250 "$DIAG/kernel-build.log" > "$DIAG/kernel-build-last-250-lines.txt" || true
          else
            echo 'Compilation log was not created; the failure may have happened before the compile step.' > "$DIAG/errors-summary.txt"
          fi

          {
            echo 'Diagnostics artifact contents:'
            find "$DIAG" -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
            echo
            echo 'The full compiler log, error summary, final 250 lines, kernel config, source diff, and toolchain/source versions are included when available.'
          } > "$DIAG/README.txt"
          echo 'Diagnostics collected. The A13X-Suzume-Build-Diagnostics artifact is uploaded even if earlier steps failed.'

      - name: Upload build diagnostics (always, including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A13X-Suzume-Build-Diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
