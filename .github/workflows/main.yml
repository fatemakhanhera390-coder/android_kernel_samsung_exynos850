name: Build Darknight Kernel M21 (OneUI 6.1 + Official KSU + SuSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - Grass-Unified2

env:
  KERNEL_REPO: "https://github.com/ghazzor/grass_kernel.git"
  KERNEL_BRANCH: "Grass-Unified2"
  KSU_REPO: "https://github.com/tiann/KernelSU.git"
  KSU_BRANCH: "main"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "kernel-4.14"
  DEVICE_CODENAME: "m21"
  KERNEL_NAME: "Darknight"
  ZIP_NAME: "Darknight-Kernel-M21-KSU-SUSFS-OneUI.zip"
  ARCH: "arm64"
  SUBARCH: "arm64"

jobs:
  build-darknight-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl device-tree-compiler \
            dos2unix file flex g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            patchelf pngcrush python-is-python3 python3 python3-pip \
            rsync schedtool squashfs-tools unzip wget xsltproc xz-utils \
            zip zlib1g-dev zstd

      - name: Setup Neutron Clang (Clang 24/Trunk via AntMan + glibc Patch)
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          "$HOME/toolchains/neutron-clang/bin/clang" --version

      - name: Clone GrassKernel Base Source (universal9611 / M21)
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          git submodule update --init --recursive || true

      - name: Clone Official Tiann KernelSU & SuSFS 4.14
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          rm -rf KernelSU drivers/kernelsu drivers/android/kernelsu
          git clone "$KSU_REPO" -b "$KSU_BRANCH" KernelSU
          git clone --depth=1 "$SUSFS_REPO" -b "$SUSFS_BRANCH" susfs4ksu

      - name: Apply SuSFS 4.14 Files & Patches
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          # 1. Copy core SuSFS filesystem & header files into kernel tree
          if [ -d "susfs4ksu/kernel_patches/fs" ]; then
            cp -rvf susfs4ksu/kernel_patches/fs/* fs/
          fi
          if [ -d "susfs4ksu/kernel_patches/include/linux" ]; then
            cp -rvf susfs4ksu/kernel_patches/include/linux/* include/linux/
          fi

          # 2. Apply SuSFS kernel patch (with fallback so non-fatal hunk offsets don't abort CI)
          for p in susfs4ksu/kernel_patches/*susfs*kernel*.patch; do
            if [ -f "$p" ]; then
              echo "Applying $p..."
              patch -p1 --forward --fuzz=3 < "$p" || true
            fi
          done

          # 3. Apply SuSFS KernelSU patch if applicable
          if [ -d "susfs4ksu/kernel_patches/KernelSU" ]; then
            cd "$GITHUB_WORKSPACE/kernel/KernelSU"
            for kp in ../susfs4ksu/kernel_patches/KernelSU/*.patch; do
              if [ -f "$kp" ]; then
                patch -p1 --forward --fuzz=3 < "$kp" || true
              fi
            done
            cd "$GITHUB_WORKSPACE/kernel"
          fi

      - name: Replicate KernelSU Tree & Universal UAPI Headers (Fix Run 17)
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          # Physically copy KernelSU/kernel (no symlinks so O=out never breaks)
          mkdir -p drivers/android/kernelsu drivers/kernelsu
          cp -rf KernelSU/kernel/. drivers/android/kernelsu/
          cp -rf KernelSU/kernel/. drivers/kernelsu/

          # Locate the upstream uapi directory inside KernelSU
          UAPI_SRC=""
          if [ -d "KernelSU/kernel/uapi" ]; then
            UAPI_SRC="KernelSU/kernel/uapi"
          elif [ -d "KernelSU/uapi" ]; then
            UAPI_SRC="KernelSU/uapi"
          elif [ -d "drivers/android/kernelsu/include/uapi" ]; then
            UAPI_SRC="drivers/android/kernelsu/include/uapi"
          fi

          echo "Located UAPI source directory: $UAPI_SRC"

          # Universally replicate uapi/*.h into all required target & sub-module directories
          TARGET_UAPI_DIRS=(
            "drivers/android/kernelsu/uapi"
            "drivers/android/kernelsu/policy/uapi"
            "drivers/android/kernelsu/core/uapi"
            "drivers/android/kernelsu/feature/uapi"
            "drivers/android/kernelsu/hook/uapi"
            "drivers/android/kernelsu/infra/uapi"
            "drivers/android/kernelsu/selinux/uapi"
            "drivers/android/kernelsu/include/uapi"
            "drivers/kernelsu/uapi"
            "drivers/kernelsu/policy/uapi"
            "drivers/kernelsu/core/uapi"
            "drivers/kernelsu/feature/uapi"
            "drivers/kernelsu/hook/uapi"
            "drivers/kernelsu/infra/uapi"
            "drivers/kernelsu/selinux/uapi"
            "drivers/kernelsu/include/uapi"
            "KernelSU/kernel/uapi"
            "KernelSU/kernel/policy/uapi"
            "KernelSU/kernel/core/uapi"
            "include/uapi"
            "include/linux/uapi"
          )

          for dir in "${TARGET_UAPI_DIRS[@]}"; do
            mkdir -p "$dir"
            if [ -n "$UAPI_SRC" ] && [ -d "$UAPI_SRC" ]; then
              cp -vf "$UAPI_SRC"/*.h "$dir"/
            fi
          done

          # Also ensure any standalone headers in KernelSU/kernel (like arch.h, klog.h, allowlist.h, feature.h)
          # are accessible across sub-folders if included via relative quotes
          for kdir in "drivers/android/kernelsu" "drivers/kernelsu"; do
            for sub in core policy feature hook infra selinux; do
              if [ -d "$kdir/$sub" ]; then
                for peer in core policy feature hook infra selinux uapi include; do
                  if [ -d "$kdir/$peer" ] && [ "$sub" != "$peer" ]; then
                    mkdir -p "$kdir/$sub/$peer"
                    cp -rf "$kdir/$peer"/*.h "$kdir/$sub/$peer"/ 2>/dev/null || true
                  fi
                done
              fi
            done
          done

          # Verify feature.h and app_profile.h presence in all critical locations
          ls -la drivers/android/kernelsu/uapi/
          ls -la drivers/android/kernelsu/policy/uapi/
          ls -la drivers/android/kernelsu/core/uapi/
          ls -la drivers/kernelsu/policy/uapi/
          ls -la include/uapi/feature.h

      - name: Patch Kbuild Include Paths & Linux 4.14 Compatibility
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          # 1. Inject explicit -I$(src) and -I$(srctree)/$(src) flags into Kbuild and Makefile
          for kbuild_file in \
            drivers/android/kernelsu/Kbuild \
            drivers/android/kernelsu/Makefile \
            drivers/kernelsu/Kbuild \
            drivers/kernelsu/Makefile \
            KernelSU/kernel/Kbuild \
            KernelSU/kernel/Makefile; do
            if [ -f "$kbuild_file" ]; then
              cat << 'EOF' >> "$kbuild_file"

          # --- Darknight O=out & UAPI Header Include Fix for Linux 4.14 ---
          ccflags-y += -I$(src) -I$(src)/include -I$(src)/uapi -I$(src)/policy -I$(src)/core -I$(src)/feature -I$(src)/hook -I$(src)/infra -I$(src)/selinux
          ccflags-y += -I$(srctree)/$(src) -I$(srctree)/$(src)/include -I$(srctree)/$(src)/uapi -I$(srctree)/$(src)/policy -I$(srctree)/$(src)/core -I$(srctree)/$(src)/feature -I$(srctree)/$(src)/hook -I$(srctree)/$(src)/infra -I$(srctree)/$(src)/selinux
          ccflags-y += -I$(srctree)/drivers/android/kernelsu -I$(srctree)/drivers/android/kernelsu/include -I$(srctree)/drivers/android/kernelsu/uapi -I$(srctree)/drivers/android/kernelsu/policy -I$(srctree)/drivers/android/kernelsu/core
          ccflags-y += -I$(srctree)/drivers/kernelsu -I$(srctree)/drivers/kernelsu/include -I$(srctree)/drivers/kernelsu/uapi -I$(srctree)/drivers/kernelsu/policy -I$(srctree)/drivers/kernelsu/core
          ccflags-y += -I$(srctree)/security/selinux -I$(srctree)/security/selinux/include -I$(objtree)/security/selinux
          ccflags-y += -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-int-conversion -Wno-gcc-compat -Wno-missing-prototypes -Wno-declaration-after-statement -Wno-error
          EOF
            fi
          done

          # 2. Prevent duplicate symbol linker errors: build ONLY drivers/android/kernelsu
          if ! grep -q "kernelsu" drivers/android/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/android/Makefile
          fi
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig || true
          if ! grep -q "drivers/android/kernelsu/Kconfig" drivers/android/Kconfig 2>/dev/null && ! grep -q "kernelsu/Kconfig" drivers/Kconfig 2>/dev/null; then
            sed -i '/endmenu/i source "drivers/android/kernelsu/Kconfig"' drivers/android/Kconfig
          fi

          # 3. Strip 'depends on KPROBES' from all KernelSU Kconfig files so Kconfig never disables CONFIG_KSU
          find drivers/android/kernelsu drivers/kernelsu KernelSU -name "Kconfig" -exec sed -i '/depends on KPROBES/d' {} +

          # 4. Guard Linux 5.x struct file_operations & seccomp symbols in KernelSU 3.x infra/ for Linux 4.14
          for fw in drivers/android/kernelsu/infra/file_wrapper.c drivers/kernelsu/infra/file_wrapper.c; do
            if [ -f "$fw" ]; then
              sed -i 's/orig->f_op->iopoll/NULL/g' "$fw"
              sed -i 's/fp->f_op->iopoll/NULL/g' "$fw"
              sed -i 's/p->ops\.iopoll/\/\/ p->ops.iopoll/g' "$fw"
              sed -i 's/p->ops\.remap_file_range/\/\/ p->ops.remap_file_range/g' "$fw"
              sed -i 's/fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;//g' "$fw"
            fi
          done

          for sc in drivers/android/kernelsu/infra/seccomp_cache.c drivers/kernelsu/infra/seccomp_cache.c; do
            if [ -f "$sc" ] && ! grep -q "SECCOMP_ARCH_NATIVE_NR" include/linux/seccomp.h; then
              sed -i '1i #ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 64\n#endif' "$sc"
            fi
          done

      - name: Inject Non-GKI Manual Hooks & Forward Prototypes
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          # Create universal ksu_hook.h header for non-GKI manual hooks
          cat << 'EOF' > include/linux/ksu_hook.h
          #ifndef __KSU_HOOK_H
          #define __KSU_HOOK_H
          #include <linux/fs.h>
          #include <linux/types.h>

          extern bool ksu_execveat_hook __read_mostly;
          extern bool ksu_vfs_read_hook __read_mostly;
          extern bool ksu_input_hook __read_mostly;

          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          extern int ksu_handle_execve_sucompat(int *fd, const char __user **filename_user, void *argv, void *envp, int *flags);
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          extern int ksu_handle_devpts(struct inode *inode);
          #endif
          EOF

          cp -vf include/linux/ksu_hook.h drivers/android/kernelsu/include/ 2>/dev/null || true
          cp -vf include/linux/ksu_hook.h drivers/android/kernelsu/ 2>/dev/null || true
          cp -vf include/linux/ksu_hook.h drivers/kernelsu/ 2>/dev/null || true

          # Ensure extern prototype before vfs_read() in fs/read_write.c
          if ! grep -q "ksu_handle_vfs_read" fs/read_write.c; then
            sed -i '/ssize_t vfs_read(/i #ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif' fs/read_write.c
          else
            sed -i '1i #include <linux/ksu_hook.h>' fs/read_write.c
          fi

          for f in fs/exec.c fs/open.c fs/stat.c drivers/input/input.c fs/devpts/inode.c; do
            if [ -f "$f" ] && ! grep -q "ksu_hook.h" "$f"; then
              sed -i '1i #include <linux/ksu_hook.h>' "$f"
            fi
          done

          # Ensure required 4.14 backport helpers exist (path_umount / get_cred_rcu / strncpy_from_user_nofault)
          if ! grep -q "int path_umount" fs/namespace.c; then
            cat << 'EOF' >> fs/namespace.c
          int path_umount(struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              int ret;
              ret = can_umount(path, flags);
              if (!ret)
                  ret = do_umount(mnt, flags);
              dput(path->dentry);
              mntput_no_expire(mnt);
              return ret;
          }
          EOF
            echo "extern int path_umount(struct path *path, int flags);" >> include/linux/fs.h
          fi

          if ! grep -q "strncpy_from_user_nofault" include/linux/uaccess.h; then
            cat << 'EOF' >> include/linux/uaccess.h
          static inline long strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)
          {
              return strncpy_from_unsafe_user(dst, unsafe_addr, count);
          }
          EOF
          fi

      - name: Patch Makefile (Disable LTO, Fix Clang 24 C23 Warnings, Set Darknight Branding)
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          # 1. Disable prepare-compiler-check in top-level Makefile
          sed -i 's/prepare-compiler-check//g' Makefile

          # 2. Add Clang 24 C23 warning suppressions & global KSU UAPI include fallbacks to Makefile
          cat << 'EOF' >> Makefile

          # --- Darknight Clang 24 (C23) & KSU Header Flags ---
          KBUILD_CFLAGS += -Wno-default-const-init-field-unsafe
          KBUILD_CFLAGS += -Wno-default-const-init-var-unsafe
          KBUILD_CFLAGS += -Wno-implicit-function-declaration
          KBUILD_CFLAGS += -Wno-int-conversion
          KBUILD_CFLAGS += -Wno-strict-prototypes
          KBUILD_CFLAGS += -Wno-gcc-compat
          KBUILD_CFLAGS += -Wno-error
          KBUILD_CFLAGS += -I$(srctree)/drivers/android/kernelsu -I$(srctree)/drivers/android/kernelsu/include -I$(srctree)/drivers/android/kernelsu/uapi -I$(srctree)/drivers/android/kernelsu/policy -I$(srctree)/drivers/android/kernelsu/core
          EOF

          # 3. Replace GrassKernel branding with Darknight across all configs and scripts
          find arch/arm64/configs -type f -exec sed -i 's/-GrassKernel/-Darknight/g; s/GrassKernel/Darknight/g; s/grass/Darknight/gI' {} + || true
          if [ -f "build_kernel.sh" ]; then
            sed -i 's/GrassKernel/Darknight/g; s/-Grass/-Darknight/g' build_kernel.sh || true
          fi

      - name: Generate & Enforce Defconfig (M21 + One UI 6.1 + KSU + SuSFS + No-LTO)
        run: |
          cd "$GITHUB_WORKSPACE/kernel"
          mkdir -p out

          # Locate M21 base defconfig in Grass-Unified2
          if [ -f "arch/arm64/configs/exynos9611-m21_defconfig" ]; then
            BASE_DEFCONFIG="exynos9611-m21_defconfig"
          elif [ -f "arch/arm64/configs/m21_defconfig" ]; then
            BASE_DEFCONFIG="m21_defconfig"
          else
            BASE_DEFCONFIG=$(cd arch/arm64/configs && find . -iname "*m21*" | head -n 1 | sed 's|^\./||')
          fi
          echo "Using base defconfig: $BASE_DEFCONFIG"

          make O=out ARCH=arm64 "$BASE_DEFCONFIG"

          # Merge vendor/grass or OneUI config fragments if present in repo
          for frag in \
            "arch/arm64/configs/vendor/grass.config" \
            "arch/arm64/configs/vendor/oneui.config" \
            "arch/arm64/configs/vendor/m21.config"; do
            if [ -f "$frag" ]; then
              cat "$frag" >> out/.config
            fi
          done

          # Force-apply Darknight, KSU, SuSFS, Kprobes, OverlayFS, and LTO_NONE settings
          cat << 'EOF' >> out/.config
          CONFIG_LOCALVERSION="-Darknight"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_LTO_NONE=y
          # CONFIG_LTO is not set
          # CONFIG_LTO_CLANG is not set
          # CONFIG_THINLTO is not set
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          EOF

          # Resolve config dependencies and re-enforce critical flags so olddefconfig cannot strip them
          make O=out ARCH=arm64 olddefconfig

          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Darknight"/' out/.config
          grep -q '^CONFIG_KSU=y' out/.config || echo "CONFIG_KSU=y" >> out/.config
          grep -q '^CONFIG_KPROBES=y' out/.config || echo "CONFIG_KPROBES=y" >> out/.config
          grep -q '^CONFIG_LTO_NONE=y' out/.config || echo "CONFIG_LTO_NONE=y" >> out/.config

          echo "=== Verified Active Config Flags ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_KPROBES|CONFIG_LTO|CONFIG_OVERLAY_FS" out/.config

      - name: Compile Darknight Kernel Image
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          # Also mirror uapi headers into out/ build directories to guarantee resolution from any CWD
          mkdir -p out/drivers/android/kernelsu/uapi out/drivers/android/kernelsu/policy/uapi out/drivers/android/kernelsu/core/uapi
          cp -rf drivers/android/kernelsu/uapi/*.h out/drivers/android/kernelsu/uapi/ 2>/dev/null || true
          cp -rf drivers/android/kernelsu/uapi/*.h out/drivers/android/kernelsu/policy/uapi/ 2>/dev/null || true
          cp -rf drivers/android/kernelsu/uapi/*.h out/drivers/android/kernelsu/core/uapi/ 2>/dev/null || true

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Verify Compiled Image & KernelSU / SuSFS Symbols
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          IMAGE_PATH="out/arch/arm64/boot/Image"
          if [ ! -f "$IMAGE_PATH" ]; then
            echo "ERROR: Kernel Image not found at $IMAGE_PATH!"
            exit 1
          fi

          IMAGE_SIZE=$(stat -c%s "$IMAGE_PATH")
          echo "Uncompressed Image size: $((IMAGE_SIZE / 1024 / 1024)) MB ($IMAGE_SIZE bytes)"

          echo "=== Verifying KernelSU Symbols in vmlinux ==="
          llvm-nm out/vmlinux | grep -E "kernelsu_init|ksu_handle_vfs_read|ksu_handle_execveat" | head -n 20

          if ! llvm-nm out/vmlinux | grep -q "ksu_"; then
            echo "ERROR: KernelSU symbols are missing from vmlinux!"
            exit 1
          fi

          echo "=== Verifying Darknight Localversion in Image ==="
          strings "$IMAGE_PATH" | grep -i "Darknight" | head -n 5

      - name: Package Flashable AnyKernel3 Archive (OneUI 6.1)
        run: |
          cd "$GITHUB_WORKSPACE/kernel"

          # Use repo's AnyKernel3 template if present, otherwise clone standard AnyKernel3
          if [ -d "AnyKernel3" ]; then
            cp -rf AnyKernel3 "$GITHUB_WORKSPACE/AnyKernel3"
          elif [ -d "anykernel" ]; then
            cp -rf anykernel "$GITHUB_WORKSPACE/AnyKernel3"
          else
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"
          fi

          cd "$GITHUB_WORKSPACE/AnyKernel3"
          rm -rf .git README.md *Image* *.zip

          cp -vf "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image" ./Image
          if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtb.img" ]; then
            cp -vf "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtb.img" ./dtb
          fi
          if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtbo.img" ]; then
            cp -vf "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtbo.img" ./dtbo.img
          fi

          # Rebrand AnyKernel3 script for Darknight & Samsung Galaxy M21 (SM-M215F/SM-M215G)
          if [ -f "anykernel.sh" ]; then
            sed -i 's/kernel.string=.*/kernel.string=Darknight Kernel for Galaxy M21 (OneUI 6.1 | KSU + SuSFS)/g' anykernel.sh
            sed -i 's/GrassKernel/Darknight/g' anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          fi

          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x "*.git*" "README.md" "*.zip"
          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Upload Flashable Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Darknight-Kernel-M21-KSU-SUSFS-OneUI
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30
