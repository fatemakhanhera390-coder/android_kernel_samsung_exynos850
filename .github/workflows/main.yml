name: Build Darknight Kernel with KernelSU & SuSFS for Galaxy M21 (OneUI 6.1)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device'
        required: true
        default: 'm21'
        type: choice
        options:
          - m21
          - a51
          - m31
          - m31s
          - f41
      rom_type:
        description: 'ROM Type (OneUI for DisturbedUI / Port ROMs)'
        required: true
        default: 'oneui'
        type: choice
        options:
          - oneui
          - aosp
      ksu_version:
        description: 'KernelSU Branch / Tag (v3.3.1, main, etc.)'
        required: true
        default: 'v3.3.1'
        type: string
      enable_susfs:
        description: 'Integrate SuSFS (v2.3.0 / 4.14 patches)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel with Clang & AnyKernel3
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev \
            pkg-config libncurses-dev ccache zip unzip curl \
            tar wget xz-utils libtool automake autoconf python3

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b Grass-Unified2 https://github.com/ghazzor/grass_kernel.git kernel_source
          cd kernel_source
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Setup Toolchain inside kernel_source/toolchain
        run: |
          cd $KERNEL_DIR
          mkdir -p toolchain
          cd toolchain
          curl -sLO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          
          echo "$KERNEL_DIR/toolchain/bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV

      - name: Configure Kernel Name to Darknight & Apply Clang 19+ Fixes
        run: |
          cd $KERNEL_DIR

          echo "[*] Setting Kernel Name to Darknight..."
          # Set localversion in configs
          sed -i 's/CONFIG_LOCALVERSION="-Grass"/CONFIG_LOCALVERSION="-Darknight"/g' arch/arm64/configs/vendor/grass.config
          sed -i 's/CONFIG_LOCALVERSION_BRANCH_SHA=y/# CONFIG_LOCALVERSION_BRANCH_SHA is not set/g' arch/arm64/configs/vendor/grass.config
          echo 'CONFIG_LOCALVERSION="-Darknight"' >> arch/arm64/configs/vendor/grass.config

          echo "[*] Bypassing LTO compiler check in Makefile..."
          sed -i 's/$(error Cannot use CONFIG_LTO/# $(error Cannot use CONFIG_LTO/g' Makefile
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_NONE=y/g' arch/arm64/configs/vendor/grass.config
          sed -i 's/CONFIG_THINLTO=y/# CONFIG_THINLTO is not set/g' arch/arm64/configs/vendor/grass.config
          echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/vendor/grass.config

          echo "[*] Fixing Clang 19 const-init warnings across the tree..."
          # 1. Global compiler flags in Makefile to completely disable default-const-init-field-unsafe error
          sed -i '/KBUILD_CFLAGS.*:=/a KBUILD_CFLAGS += -Wno-default-const-init-field-unsafe -Wno-error -Wno-unused-but-set-variable' Makefile
          
          # 2. Source-level patches for kernel/params.c, sdfat, and sdcardfs
          if [ -f "kernel/params.c" ]; then
            sed -i 's/struct kernel_param dummy;/struct kernel_param dummy = { .perm = 0 };/g' kernel/params.c
            sed -i 's/struct kernel_param kp;/struct kernel_param kp = { .perm = 0 };/g' kernel/params.c
          fi
          if [ -f "fs/sdfat/sdfat.h" ]; then
            sed -i 's/struct inode fake_inode;/struct inode fake_inode = { .i_nlink = 0 };/g' fs/sdfat/sdfat.h
          fi
          if [ -f "fs/sdcardfs/inode.c" ]; then
            sed -i 's/struct inode tmp;/struct inode tmp = { .i_nlink = 0 };/g' fs/sdcardfs/inode.c
          fi

      - name: Setup KernelSU & SuSFS Patches
        run: |
          cd $KERNEL_DIR

          # 1. Update / Integrate KernelSU
          KSU_REF="${{ github.event.inputs.ksu_version }}"
          echo "[*] Integrating KernelSU (${KSU_REF})..."
          rm -rf KernelSU drivers/kernelsu
          
          # Setup KernelSU v3.3.1 (matching versionCode 32680)
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${KSU_REF}" || \
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

          # 2. Integrate SuSFS for Linux 4.14
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            echo "[*] Cloning SuSFS 4.14 patches..."
            git clone --depth=1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu || \
            git clone --depth=1 https://github.com/Star-Seven/susfs4ksu.git /tmp/susfs4ksu

            echo "[*] Copying SuSFS source files..."
            cp -r /tmp/susfs4ksu/kernel_patches/fs/* fs/
            cp -r /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/

            echo "[*] Applying SuSFS patch to KernelSU..."
            if [ -d "drivers/kernelsu" ]; then
              cd drivers/kernelsu
              patch -p1 --forward < /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
              cd $KERNEL_DIR
            elif [ -d "KernelSU" ]; then
              cd KernelSU
              patch -p1 --forward < /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
              cd $KERNEL_DIR
            fi

            # Enable SuSFS configs in defconfig
            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/grass.config
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/vendor/grass.config
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/vendor/grass.config
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUMV=y" >> arch/arm64/configs/vendor/grass.config
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> arch/arm64/configs/vendor/grass.config
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/vendor/grass.config
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> arch/arm64/configs/vendor/grass.config
          fi

      - name: Build Kernel Image & AnyKernel3 Zip
        run: |
          cd $KERNEL_DIR

          export DEVICE="${{ github.event.inputs.device }}"
          export ROM="${{ github.event.inputs.rom_type }}"
          export KSU=1
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$KERNEL_DIR/toolchain/bin:$PATH"

          chmod +x build_kernel.sh
          ./build_kernel.sh 2>&1 | tee build.log

          # Strictly verify that the kernel binary was compiled
          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "[-] ERROR: out/arch/arm64/boot/Image was NOT created! Build failed."
            exit 1
          fi

      - name: Package Darknight AnyKernel3 Zip
        id: locate_zip
        run: |
          cd $KERNEL_DIR

          echo "[*] Creating fresh AnyKernel3 package for Darknight Kernel..."
          rm -rf /tmp/AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/AnyKernel3
          cp out/arch/arm64/boot/Image /tmp/AnyKernel3/Image
          
          # Configure AnyKernel3 for Galaxy M21
          sed -i 's/kernel.string=.*/kernel.string=Darknight Kernel for Galaxy M21/g' /tmp/AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=m21nsxx/g' /tmp/AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=m21/g' /tmp/AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=SM-M215F/g' /tmp/AnyKernel3/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=SM-M215G/g' /tmp/AnyKernel3/anykernel.sh
          
          mkdir -p kernel_zip
          cd /tmp/AnyKernel3
          zip -r9 $KERNEL_DIR/kernel_zip/Darknight-Kernel-M21-KSU-SUSFS-OneUI.zip * -x .git README.md
          
          ZIP_FILE="kernel_zip/Darknight-Kernel-M21-KSU-SUSFS-OneUI.zip"
          echo "FLASHABLE_ZIP=$KERNEL_DIR/$ZIP_FILE" >> $GITHUB_ENV
          echo "FLASHABLE_BASENAME=$(basename $ZIP_FILE)" >> $GITHUB_ENV
          ls -lh "$KERNEL_DIR/$ZIP_FILE"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLASHABLE_BASENAME }}
          path: ${{ env.FLASHABLE_ZIP }}
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_number }}
          name: Darknight Kernel Galaxy M21 (KSU + SuSFS) OneUI 6.1
          body: |
            ### Darknight Custom Kernel for Samsung Galaxy M21 (SM-M215F / SM-M215G)
            - **Kernel Name:** Darknight
            - **Target ROM:** OneUI 6.1 (Android 14 DisturbedUI / Ports)
            - **Base Kernel:** Linux 4.14.246 (Exynos 9611)
            - **Compiler:** Neutron Clang
            - **Root:** KernelSU v3.3.1 (32680) + SuSFS 2.3.0 Integrated
            - **Format:** TWRP / OrangeFox Flashable AnyKernel3 Zip
          files: ${{ env.FLASHABLE_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Diagnostics Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-log
          path: |
            kernel_source/build.log
            kernel_source/arch/arm64/configs/vendor/grass.config
          retention-days: 7
