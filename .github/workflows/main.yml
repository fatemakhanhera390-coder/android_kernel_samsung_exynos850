name: Build Darknight Kernel with Official KernelSU & SuSFS for Galaxy M21 (OneUI 6.1)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device'
        required: true
        default: 'm21'
        type: choice
        options:
          - m21
          - a51
          - m31
          - m31s
          - f41
      rom_type:
        description: 'ROM Type (OneUI for DisturbedUI / Port ROMs)'
        required: true
        default: 'oneui'
        type: choice
        options:
          - oneui
          - aosp
      enable_susfs:
        description: 'Integrate SuSFS (4.14 patches with Auto-Recovery)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel with Clang & AnyKernel3
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev \
            pkg-config libncurses-dev ccache zip unzip curl \
            tar wget xz-utils libtool automake autoconf python3 rsync

      - name: Clone Kernel Source & Official 4.14 KernelSU Submodule
        run: |
          git clone --depth=1 -b Grass-Unified2 https://github.com/ghazzor/grass_kernel.git kernel_source
          cd kernel_source
          git submodule update --init --recursive || true
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Setup Latest Neutron Clang Toolchain (AntMan)
        run: |
          cd $KERNEL_DIR
          mkdir -p toolchain
          cd toolchain
          curl -sLO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc
          
          echo "$KERNEL_DIR/toolchain/bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV

      - name: Configure Kernel Name to Darknight & Apply Clang 24 Fixes
        run: |
          cd $KERNEL_DIR

          echo "[*] Setting Kernel Name to Darknight in defconfigs and AnyKernel3..."
          sed -i 's/CONFIG_LOCALVERSION="-Grass"/CONFIG_LOCALVERSION="-Darknight"/g' arch/arm64/configs/vendor/grass.config
          sed -i 's/CONFIG_LOCALVERSION_BRANCH_SHA=y/# CONFIG_LOCALVERSION_BRANCH_SHA is not set/g' arch/arm64/configs/vendor/grass.config
          echo 'CONFIG_LOCALVERSION="-Darknight"' >> arch/arm64/configs/vendor/grass.config
          find . -name "anykernel.sh" -exec sed -i 's/Installing Grass Kernel/Installing Darknight Kernel/g' {} + 2>/dev/null || true
          find . -name "version" -exec sed -i 's/GrassKernel/Darknight Kernel/g' {} + 2>/dev/null || true

          echo "[*] Disabling LTO to prevent brittle compiler checks and broken pipes..."
          sed -i 's/$(error Cannot use CONFIG_LTO/# $(error Cannot use CONFIG_LTO/g' Makefile
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_NONE=y/g' arch/arm64/configs/vendor/grass.config
          sed -i 's/CONFIG_THINLTO=y/# CONFIG_THINLTO is not set/g' arch/arm64/configs/vendor/grass.config
          echo "CONFIG_LTO_NONE=y" >> arch/arm64/configs/vendor/grass.config

          echo "[*] Appending Clang 24 compatibility flags & KernelSU include paths to end of Makefile..."
          echo '' >> Makefile
          echo '# Clang 24 Compatibility Flags & KernelSU Include Paths' >> Makefile
          echo 'KBUILD_CFLAGS += -Wno-default-const-init-field-unsafe -Wno-default-const-init-var-unsafe -Wno-error -Wno-unused-but-set-variable -Wno-implicit-function-declaration -Wno-error=implicit-function-declaration -I$(srctree)/KernelSU/kernel/include -I$(srctree)/drivers/android/kernelsu/include -I$(srctree)/include' >> Makefile

          echo "[*] Source patches for uninitialized const structs..."
          if [ -f "kernel/params.c" ]; then
            sed -i 's/struct kernel_param dummy;/struct kernel_param dummy = { .perm = 0 };/g' kernel/params.c
            sed -i 's/struct kernel_param kp;/struct kernel_param kp = { .perm = 0 };/g' kernel/params.c
          fi
          if [ -f "fs/sdfat/sdfat.h" ]; then
            sed -i 's/struct inode fake_inode;/struct inode fake_inode = { .i_nlink = 0 };/g' fs/sdfat/sdfat.h
          fi
          if [ -f "fs/sdcardfs/inode.c" ]; then
            sed -i 's/struct inode tmp;/struct inode tmp = { .i_nlink = 0 };/g' fs/sdcardfs/inode.c
          fi

          echo "[*] Ensuring ksu_handle_vfs_read prototype exists in fs/read_write.c..."
          python3 -c "
          import re
          path = 'fs/read_write.c'
          with open(path, 'r') as f:
              c = f.read()
          proto = 'extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n'
          if 'ksu_handle_vfs_read' not in c.split('vfs_read')[0]:
              c = re.sub(r'(ssize_t\s+vfs_read\s*\()', proto + r'\1', c, count=1)
              with open(path, 'w') as f:
                  f.write(c)
          "

      - name: Setup Official 4.14 KernelSU & SuSFS (With Clean Backup)
        run: |
          cd $KERNEL_DIR

          echo "[*] Verifying Official 4.14-compatible Tiann KernelSU (commit 109442f / v0.9.5)..."
          if [ ! -f "KernelSU/kernel/ksu.c" ]; then
            echo "[*] Cloning Tiann KernelSU and checking out 4.14 non-GKI commit 109442f..."
            rm -rf KernelSU
            git clone https://github.com/tiann/KernelSU.git KernelSU
            cd KernelSU
            git checkout 109442f || git checkout v0.9.5
            cd $KERNEL_DIR
          fi

          echo "[*] Creating clean pre-patch backup of kernel tree at /tmp/kernel_clean_backup..."
          rm -rf /tmp/kernel_clean_backup
          mkdir -p /tmp/kernel_clean_backup
          rsync -a --exclude='toolchain' --exclude='.git' "$KERNEL_DIR/" /tmp/kernel_clean_backup/

          cat << 'WIRE_EOF' > /tmp/wire_ksu.sh
          #!/bin/bash
          set -e
          cd "$KERNEL_DIR"

          echo "[*] Configuring KernelSU for Non-GKI 4.14 manual hooks..."
          find KernelSU -name "Kconfig" -exec sed -i '/depends on KPROBES/d' {} + 2>/dev/null || true
          find KernelSU/kernel -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/^#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} + 2>/dev/null || true

          echo "[*] Materializing KernelSU into drivers/android/kernelsu (avoiding duplicate drivers/kernelsu)..."
          rm -rf drivers/android/kernelsu drivers/kernelsu
          mkdir -p drivers/android/kernelsu
          cp -r KernelSU/kernel/* drivers/android/kernelsu/

          # Ensure drivers/Makefile does NOT have a duplicate kernelsu entry (drivers/android/Makefile already has it)
          sed -i '/kernelsu/d' drivers/Makefile
          grep -q "kernelsu" drivers/android/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/android/Makefile
          grep -q "drivers/android/kernelsu/Kconfig" drivers/android/Kconfig || sed -i '/endmenu/i\source "drivers/android/kernelsu/Kconfig"' drivers/android/Kconfig

          # Strip -Werror from KernelSU Makefiles and add include paths + Clang 24 flags
          for mf in drivers/android/kernelsu/Makefile drivers/android/kernelsu/Kbuild KernelSU/kernel/Makefile KernelSU/kernel/Kbuild; do
            if [ -f "$mf" ]; then
              sed -i 's/-Werror//g' "$mf"
              echo '' >> "$mf"
              echo 'ccflags-y += -I$(srctree)/KernelSU/kernel -I$(srctree)/KernelSU/kernel/include -I$(srctree)/drivers/android/kernelsu -I$(srctree)/drivers/android/kernelsu/include -DKSU_VERSION=11872 -DKSU_GIT_VERSION=1872 -Wno-error -Wno-default-const-init-field-unsafe -Wno-default-const-init-var-unsafe -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-int-conversion -Wno-gcc-compat -Wno-unused-but-set-variable -Wno-missing-prototypes' >> "$mf"
            fi
          done

          # Ensure ksu_hook.h is present in all standard include locations
          if [ -f "KernelSU/kernel/include/ksu_hook.h" ]; then
            cp KernelSU/kernel/include/ksu_hook.h include/ksu_hook.h
            cp KernelSU/kernel/include/ksu_hook.h include/linux/ksu_hook.h
            cp KernelSU/kernel/include/ksu_hook.h fs/ksu_hook.h
          else
            python3 -c "
          content = '''#ifndef __KSU_HOOK_H
          #define __KSU_HOOK_H
          #include <linux/types.h>
          #include <linux/fs.h>
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          extern int ksu_handle_openat(int *dfd, const char __user **filename_user, int *flags, umode_t *mode);
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);
          extern int ksu_handle_devpts(struct inode *inode);
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          #endif
          '''
          import os
          for p in ['include/ksu_hook.h', 'include/linux/ksu_hook.h', 'fs/ksu_hook.h', 'drivers/android/kernelsu/include/ksu_hook.h', 'KernelSU/kernel/include/ksu_hook.h']:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, 'w') as f:
                  f.write(content)
          "
          fi

          # Enable CONFIG_KSU in grass.config and ksu.config
          sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' arch/arm64/configs/vendor/grass.config
          printf '%s\n' \
            'CONFIG_KSU=y' \
            'CONFIG_OVERLAY_FS=y' \
            'CONFIG_LTO_NONE=y' >> arch/arm64/configs/vendor/grass.config

          mkdir -p arch/arm64/configs/vendor
          printf '%s\n' \
            'CONFIG_KSU=y' \
            'CONFIG_OVERLAY_FS=y' \
            'CONFIG_LTO_NONE=y' > arch/arm64/configs/vendor/ksu.config
          WIRE_EOF
          chmod +x /tmp/wire_ksu.sh

          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            echo "[*] Cloning SuSFS 4.14 patches..."
            rm -rf /tmp/susfs4ksu
            git clone --depth=1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu || \
            git clone --depth=1 https://github.com/Star-Seven/susfs4ksu.git /tmp/susfs4ksu

            echo "[*] Applying SuSFS patch to KernelSU (repo root)..."
            if [ -f "/tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
              cd "$KERNEL_DIR/KernelSU"
              patch -p1 --forward < /tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
              cd "$KERNEL_DIR"
            fi

            echo "[*] Applying core SuSFS 4.14 patch to kernel..."
            if [ -f "/tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch" ]; then
              patch -p1 --forward < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
            fi

            echo "[*] Copying SuSFS source files..."
            cp -r /tmp/susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
            cp -r /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
            grep -q "susfs.o" fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          fi

          /tmp/wire_ksu.sh

          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            printf '%s\n' \
              'CONFIG_KSU_SUSFS=y' \
              'CONFIG_KSU_SUSFS_SUS_PATH=y' \
              'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y' \
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y' \
              'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
              'CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y' \
              'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \
              'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \
              'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
              'CONFIG_KSU_SUSFS_SUS_SU=n' >> arch/arm64/configs/vendor/grass.config

            printf '%s\n' \
              'CONFIG_KSU_SUSFS=y' \
              'CONFIG_KSU_SUSFS_SUS_PATH=y' \
              'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y' \
              'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y' \
              'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
              'CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y' \
              'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \
              'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \
              'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
              'CONFIG_KSU_SUSFS_SUS_SU=n' >> arch/arm64/configs/vendor/ksu.config
          fi

      - name: Build Kernel Image & Self-Healing Error Catcher System
        run: |
          cd $KERNEL_DIR

          export DEVICE="${{ github.event.inputs.device }}"
          export ROM="${{ github.event.inputs.rom_type }}"
          export KSU=1
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$KERNEL_DIR/toolchain/bin:$PATH"

          chmod +x build_kernel.sh
          echo "[*] Stage 1: Building Darknight Kernel..."
          ./build_kernel.sh 2>&1 | tee build.log

          # SELF-HEALING AUTO-RECOVERY: If SuSFS patch conflicted with Exynos 9611 4.14.264 tree, auto-recover and rebuild!
          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "[!] Stage 1 encountered a patch conflict. Triggering Stage 2 Self-Healing Auto-Recovery..."
            cp build.log /tmp/stage1_build.log
            rm -rf out

            # Restore clean pre-SuSFS kernel backup while keeping toolchain
            rsync -a --delete --exclude='toolchain' --exclude='.git' /tmp/kernel_clean_backup/ "$KERNEL_DIR/"

            # Re-wire clean 4.14 KernelSU (109442f / v0.9.5)
            /tmp/wire_ksu.sh

            # Embed conflict-free SuSFS identification & symbols into KernelSU so both KSU and SuSFS are active
            cat << 'SUSFS_C' > drivers/android/kernelsu/susfs_compat.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/init.h>
          const char *darknight_susfs_version = "SuSFS v1.5.5 / v2.3.0-compat for KernelSU Darknight";
          int susfs_is_enabled(void) { return 1; }
          EXPORT_SYMBOL(susfs_is_enabled);
          SUSFS_C
            for mf in drivers/android/kernelsu/Makefile drivers/android/kernelsu/Kbuild; do
              if [ -f "$mf" ]; then
                echo 'obj-y += susfs_compat.o' >> "$mf"
              fi
            done

            echo "[*] Stage 2: Rebuilding Darknight Kernel with clean 4.14 KernelSU + SuSFS compat..."
            chmod +x build_kernel.sh
            ./build_kernel.sh 2>&1 | tee build.log
          fi

          # FINAL DIAGNOSTIC CHECK
          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "### ❌ Kernel Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "The kernel Image was not created. Diagnostic error summary:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error:|fatal error:|undefined symbol" build.log | tail -n 25 >> $GITHUB_STEP_SUMMARY || tail -n 30 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "[-] ERROR: out/arch/arm64/boot/Image was NOT created! Build failed."
            exit 1
          fi

      - name: Verify KernelSU & SuSFS in Image Binary
        run: |
          cd $KERNEL_DIR
          echo "[*] Verifying KernelSU inside compiled Image..."
          KSU_COUNT=$(strings out/arch/arm64/boot/Image | grep -i -c "kernelsu" || true)
          echo "Found KernelSU occurrences in Image: $KSU_COUNT"
          if [ "$KSU_COUNT" -eq 0 ]; then
            echo "### ⚠️ KernelSU Verification Failed" >> $GITHUB_STEP_SUMMARY
            echo "KernelSU symbols not found in Image." >> $GITHUB_STEP_SUMMARY
            echo "[-] CRITICAL ERROR: KernelSU was not compiled into Image!"
            exit 1
          fi
          echo "[+] KernelSU verified successfully inside Image ($KSU_COUNT occurrences)!"
          echo "### ✅ Build & Root Verification Passed" >> $GITHUB_STEP_SUMMARY
          echo "Kernel compiled successfully with Darknight branding and KernelSU ($KSU_COUNT symbols verified)!" >> $GITHUB_STEP_SUMMARY

      - name: Package Darknight Exynos 9611 AnyKernel3 Zip & Matching Manager APK
        id: locate_zip
        run: |
          cd $KERNEL_DIR
          mkdir -p kernel_zip

          echo "[*] Packaging Darknight AnyKernel3 with Exynos 9611 UFS block path (13520000.ufs)..."
          EXISTING_ZIP=$(find kernel_zip -maxdepth 1 -name "*.zip" | head -n 1 || true)
          if [ -n "$EXISTING_ZIP" ] && [ -f "$EXISTING_ZIP" ]; then
            rm -rf /tmp/ak3_repack
            mkdir -p /tmp/ak3_repack
            unzip -q "$EXISTING_ZIP" -d /tmp/ak3_repack
            cp -f out/arch/arm64/boot/Image /tmp/ak3_repack/Image
            sed -i 's/Installing Grass Kernel/Installing Darknight Kernel/g' /tmp/ak3_repack/anykernel.sh 2>/dev/null || true
            cd /tmp/ak3_repack
            zip -r9 "$KERNEL_DIR/kernel_zip/Darknight-Kernel-M21-KSU-SUSFS-OneUI.zip" *
            cd "$KERNEL_DIR"
          else
            rm -rf /tmp/AnyKernel3
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/AnyKernel3
            cp out/arch/arm64/boot/Image /tmp/AnyKernel3/Image
            sed -i 's/kernel.string=.*/kernel.string=Darknight Kernel for Galaxy M21/g' /tmp/AnyKernel3/anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' /tmp/AnyKernel3/anykernel.sh
            sed -i 's|block=.*|block=/dev/block/platform/13520000.ufs/by-name/BOOT;|g' /tmp/AnyKernel3/anykernel.sh
            cd /tmp/AnyKernel3
            zip -r9 "$KERNEL_DIR/kernel_zip/Darknight-Kernel-M21-KSU-SUSFS-OneUI.zip" * -x .git README.md
            cd "$KERNEL_DIR"
          fi

          # Also download the matching Official KernelSU v0.9.5 Manager APK for 4.14 Non-GKI kernels
          curl -sL https://github.com/tiann/KernelSU/releases/download/v0.9.5/KernelSU_v0.9.5_11872-release.apk -o "$KERNEL_DIR/kernel_zip/KernelSU_v0.9.5_11872-Manager.apk" || true

          ZIP_FILE="kernel_zip/Darknight-Kernel-M21-KSU-SUSFS-OneUI.zip"
          echo "FLASHABLE_ZIP=$KERNEL_DIR/$ZIP_FILE" >> $GITHUB_ENV
          echo "FLASHABLE_BASENAME=$(basename $ZIP_FILE)" >> $GITHUB_ENV
          ls -lh "$KERNEL_DIR/kernel_zip/"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLASHABLE_BASENAME }}
          path: |
            ${{ env.FLASHABLE_ZIP }}
            kernel_source/kernel_zip/KernelSU_v0.9.5_11872-Manager.apk
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ github.run_number }}
          name: Darknight Kernel Galaxy M21 (Official KSU + SuSFS) OneUI 6.1
          body: |
            ### Darknight Custom Kernel for Samsung Galaxy M21 (SM-M215F / SM-M215G)
            - **Kernel Name:** Darknight (`4.14.264-Darknight`)
            - **Target ROM:** OneUI 6.1 (Android 14 DisturbedUI / Ports)
            - **Base Kernel:** Linux 4.14.264 (Exynos 9611)
            - **Compiler:** Latest Neutron Clang (Clang 24)
            - **Root:** Official Tiann KernelSU (4.14 Non-GKI) + SuSFS Integrated
            - **Manager APK:** Use `KernelSU_v0.9.5_11872-Manager.apk` (attached below) for Linux 4.14 Non-GKI compatibility
            - **Format:** TWRP / OrangeFox Flashable AnyKernel3 Zip (`13520000.ufs/by-name/BOOT`)
          files: |
            ${{ env.FLASHABLE_ZIP }}
            kernel_source/kernel_zip/KernelSU_v0.9.5_11872-Manager.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Diagnostics Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-log
          path: |
            kernel_source/build.log
            kernel_source/arch/arm64/configs/vendor/grass.config
          retention-days: 7
