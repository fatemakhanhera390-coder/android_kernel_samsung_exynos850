              "",
          ]), encoding="utf-8")

          fs_mk = ws / "fs" / "Makefile"
          fs_mk_txt = fs_mk.read_text(encoding="utf-8")
          if "susfs.o" not in fs_mk_txt:
              fs_mk_txt += (
                  "\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n"
                  "CFLAGS_susfs.o += -Wno-strict-prototypes -Wno-missing-prototypes -Wno-missing-declarations -Wno-declaration-after-statement\n"
              )
              fs_mk.write_text(fs_mk_txt, encoding="utf-8")
              log("[SUSFS] Added susfs.o to fs/Makefile")

          # Add SUSFS Kconfig options to KernelSU-Next/kernel/Kconfig
          kconfig_p = ksu_dir / "Kconfig"
          kc_txt = kconfig_p.read_text(encoding="utf-8")
          susfs_kconfig = "\n".join([
              'menu "KernelSU - SUSFS"',
              "config KSU_SUSFS",
              '    bool "KernelSU addon - SUSFS"',
              "    depends on KSU",
              "    default y",
              "config KSU_SUSFS_HAS_MAGIC_MOUNT",
              '    bool "SUSFS magic mount"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_SUS_PATH",
              '    bool "SUSFS sus_path"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_SUS_MOUNT",
              '    bool "SUSFS sus_mount"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT",
              '    bool "SUSFS auto add ksu default mount"',
              "    depends on KSU_SUSFS_SUS_MOUNT",
              "    default y",
              "config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT",
              '    bool "SUSFS auto add bind mount"',
              "    depends on KSU_SUSFS_SUS_MOUNT",
              "    default y",
              "config KSU_SUSFS_SUS_KSTAT",
              '    bool "SUSFS sus_kstat"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_SUS_OVERLAYFS",
              '    bool "SUSFS sus_overlayfs"',
              "    depends on KSU_SUSFS_SUS_KSTAT",
              "    default n",
              "config KSU_SUSFS_TRY_UMOUNT",
              '    bool "SUSFS try_umount"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT",
              '    bool "SUSFS auto add try_umount"',
              "    depends on KSU_SUSFS_TRY_UMOUNT",
              "    default y",
              "config KSU_SUSFS_SPOOF_UNAME",
              '    bool "SUSFS spoof uname"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_ENABLE_LOG",
              '    bool "SUSFS enable log"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS",
              '    bool "SUSFS hide symbols"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG",
              '    bool "SUSFS spoof cmdline"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_OPEN_REDIRECT",
              '    bool "SUSFS open redirect"',
              "    depends on KSU_SUSFS",
              "    default y",
              "config KSU_SUSFS_SUS_SU",
              '    bool "SUSFS sus_su"',
              "    depends on KSU_SUSFS",
              "    default n",
              "endmenu",
          ])
          if "config KSU_SUSFS" not in kc_txt:
              idx = kc_txt.rfind("endmenu")
              kc_txt = (kc_txt[:idx] + susfs_kconfig + "\n" + kc_txt[idx:]) if idx != -1 else (kc_txt + "\n" + susfs_kconfig)
              kconfig_p.write_text(kc_txt, encoding="utf-8")
              log("[SUSFS] Added CONFIG_KSU_SUSFS* options to KernelSU-Next/kernel/Kconfig")

          # Wire susfs_init() into KernelSU-Next/kernel/core/init.c
          init_c = ksu_dir / "core" / "init.c"
          init_txt = init_c.read_text(encoding="utf-8")
          if "susfs_init" not in init_txt:
              init_txt = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n" + init_txt
              init_txt, init_cnt = re.subn(
                  r"ksu_supercalls_init\s*\(\s*\)\s*;",
                  "ksu_supercalls_init();\n#ifdef CONFIG_KSU_SUSFS\n\tsusfs_init();\n#endif",
                  init_txt,
                  count=1,
              )
              assert init_cnt == 1, "ksu_supercalls_init() not found in core/init.c"
              init_c.write_text(init_txt, encoding="utf-8")
              log("[SUSFS] Wired susfs_init() into KernelSU-Next/kernel/core/init.c")

          # Wire ksu_handle_sys_reboot & ksu_handle_susfs_command in supercall/supercall.c
          sc_c = ksu_dir / "supercall" / "supercall.c"
          sc_txt = sc_c.read_text(encoding="utf-8")
          sc_txt = sc_txt.replace(
              "static struct kprobe reboot_kp =",
              "static struct kprobe __maybe_unused reboot_kp =",
              1,
          )
          sc_txt = sc_txt.replace(
              "rc = register_kprobe(&reboot_kp);",
              "rc = 0; /* Handled directly via ksu_handle_sys_reboot in kernel/reboot.c */",
              1,
          )
          sc_txt = sc_txt.replace(
              "unregister_kprobe(&reboot_kp);",
              "/* unregister_kprobe(&reboot_kp); */",
              1,
          )
          reboot_bridge = "\n".join([
              "",
              "#ifdef CONFIG_KSU_SUSFS",
              "#include <linux/susfs.h>",
              "#endif",
              "",
              "int ksu_handle_susfs_command(int magic1, int magic2, unsigned int cmd, void __user *arg, void __user *err_out)",
              "{",
              "#ifdef CONFIG_KSU_SUSFS",
              "    int error = 0;",
              "    (void)magic2;",
              "    if ((unsigned int)magic1 != 0xdeadbeefU)",
              "        return -EINVAL;",
              "    if (current_uid().val != 0)",
              "        return -EPERM;",
              "    if (cmd == CMD_SUSFS_ADD_SUS_PATH) {",
              "        error = susfs_add_sus_path((struct st_susfs_sus_path __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_ADD_SUS_MOUNT) {",
              "        error = susfs_add_sus_mount((struct st_susfs_sus_mount __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_ADD_SUS_KSTAT || cmd == CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY) {",
              "        error = susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_UPDATE_SUS_KSTAT) {",
              "        error = susfs_update_sus_kstat((struct st_susfs_sus_kstat __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_ADD_TRY_UMOUNT) {",
              "        error = susfs_add_try_umount((struct st_susfs_try_umount __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_SET_UNAME) {",
              "        error = susfs_set_uname((struct st_susfs_uname __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_ENABLE_LOG) {",
              "        error = susfs_set_log((unsigned int)(unsigned long)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG) {",
              "        error = susfs_set_cmdline_or_bootconfig((char __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_ADD_OPEN_REDIRECT) {",
              "        error = susfs_add_open_redirect((struct st_susfs_open_redirect __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_SHOW_VERSION) {",
              "        error = susfs_show_version((char __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_SHOW_ENABLED_FEATURES) {",
              "        error = susfs_show_enabled_features((char __user *)arg, 4096);",
              "        goto out_copy;",
              "    }",
              "    if (cmd == CMD_SUSFS_SHOW_VARIANT) {",
              "        error = susfs_show_variant((char __user *)arg);",
              "        goto out_copy;",
              "    }",
              "    return -EINVAL;",
              "out_copy:",
              "    if (err_out) {",
              "        if (copy_to_user(err_out, &error, sizeof(error)))",
              "            return -EFAULT;",
              "    }",
              "    return 0;",
              "#else",
              "    return -ENOSYS;",
              "#endif",
              "}",
              "",
              "int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg)",
              "{",
              "    struct pt_regs real_regs;",
              "    struct pt_regs outer_regs;",
              "",
              "    if ((unsigned int)magic1 != KSU_INSTALL_MAGIC1)",
              "        return 0;",
              "",
              "    if (cmd >= 0x55550U && cmd <= 0x60000U) {",
              "        ksu_handle_susfs_command(magic1, magic2, cmd, arg ? *arg : NULL, NULL);",
              "        return 0;",
              "    }",
              "",
              "    memset(&real_regs, 0, sizeof(real_regs));",
              "    memset(&outer_regs, 0, sizeof(outer_regs));",
              "    real_regs.regs[0] = (unsigned long)(unsigned int)magic1;",
              "    real_regs.regs[1] = (unsigned long)(unsigned int)magic2;",
              "    real_regs.regs[2] = (unsigned long)cmd;",
              "    real_regs.regs[3] = arg ? (unsigned long)(*arg) : 0UL;",
              "    PT_REGS_PARM1(&outer_regs) = (unsigned long)&real_regs;",
              "",
              "    return reboot_handler_pre(NULL, &outer_regs);",
              "}",
              "",
          ])
          sc_txt += "\n" + reboot_bridge
          sc_c.write_text(sc_txt, encoding="utf-8")
          log("[Fix #1b] Added ksu_handle_sys_reboot and ksu_handle_susfs_command to supercall/supercall.c")

          # Patch kernel/reboot.c SYSCALL_DEFINE4(reboot, ...) right before the first if (...) statement
          reboot_c = ws / "kernel" / "reboot.c"
          rb_txt = reboot_c.read_text(encoding="utf-8")
          if "ksu_handle_sys_reboot" not in rb_txt:
              rb_decl = "\n".join([
                  "",
                  "#ifdef CONFIG_KSU",
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);",
                  "#endif",
                  "",
              ])
              m = re.search(r"SYSCALL_DEFINE4\s*\(\s*reboot\s*,[^{]+\{", rb_txt)
              assert m, "SYSCALL_DEFINE4(reboot, ...) not found in kernel/reboot.c"
              rb_txt = rb_txt[:m.start()] + rb_decl + rb_txt[m.start():]
              m = re.search(r"SYSCALL_DEFINE4\s*\(\s*reboot\s*,[^{]+\{", rb_txt)
              m_if = re.search(r"\bif\s*\(", rb_txt[m.end():])
              assert m_if, "First if (...) statement not found in SYSCALL_DEFINE4(reboot)"
              pos = m.end() + m_if.start()
              rb_hook = (
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                  "#endif\n\t"
              )
              rb_txt = rb_txt[:pos] + rb_hook + rb_txt[pos:]
              reboot_c.write_text(rb_txt, encoding="utf-8")
              log("[Fix #1c] Wired direct ksu_handle_sys_reboot call into kernel/reboot.c SYSCALL_DEFINE4(reboot)")

          # Patch kernel/sys.c (__sys_setresuid, SYSCALL_DEFINE1(newuname), SYSCALL_DEFINE5(prctl))
          sys_c = ws / "kernel" / "sys.c"
          sys_txt = sys_c.read_text(encoding="utf-8")
          if "ksu_handle_setresuid" not in sys_txt:
              sys_decl = "\n".join([
                  "",
                  "#ifdef CONFIG_KSU",
                  "#include <linux/thread_info.h>",
                  "extern int ksu_handle_setresuid(uid_t old_uid, uid_t new_uid);",
                  "extern int ksu_handle_susfs_command(int magic1, int magic2, unsigned int cmd, void __user *arg, void __user *err_out);",
                  "#endif",
                  "#ifdef CONFIG_KSU_SUSFS",
                  "#include <linux/susfs.h>",
                  "#endif",
                  "",
              ])
              m_sr = re.search(r"long\s+__sys_setresuid\s*\(\s*uid_t\s+ruid\s*,\s*uid_t\s+euid\s*,\s*uid_t\s+suid\s*\)\s*\{", sys_txt)
              assert m_sr, "__sys_setresuid not found in kernel/sys.c"
              sys_txt = sys_txt[:m_sr.start()] + sys_decl + sys_txt[m_sr.start():]
              m_sr = re.search(r"long\s+__sys_setresuid\s*\(\s*uid_t\s+ruid\s*,\s*uid_t\s+euid\s*,\s*uid_t\s+suid\s*\)\s*\{", sys_txt)
              next_fn = sys_txt.find("SYSCALL_DEFINE3(setresuid", m_sr.end())
              assert next_fn != -1, "SYSCALL_DEFINE3(setresuid) not found after __sys_setresuid"
              fn_body = sys_txt[m_sr.end():next_fn]
              m_cc = re.search(r"(return\s+commit_creds\s*\(\s*new\s*\)\s*;|retval\s*=\s*commit_creds\s*\(\s*new\s*\)\s*;)", fn_body)
              assert m_cc, "commit_creds(new) not found in __sys_setresuid"
              if m_cc.group(1).strip().startswith("return"):
                  cc_repl = "\n".join([
                      "{",
                      "\t\tuid_t ksu_old_uid = current_uid().val;",
                      "\t\tint ksu_ret = commit_creds(new);",
                      "#ifdef CONFIG_KSU",
                      "\t\tif (ksu_ret >= 0 && !test_ti_thread_flag(current_thread_info(), TIF_SYSCALL_TRACEPOINT))",
                      "\t\t\tksu_handle_setresuid(ksu_old_uid, current_uid().val);",
                      "#endif",
                      "\t\treturn ksu_ret;",
                      "\t}",
                  ])
              else:
                  cc_repl = "\n".join([
                      "{",
                      "\t\tuid_t ksu_old_uid = current_uid().val;",
                      "\t\tretval = commit_creds(new);",
                      "#ifdef CONFIG_KSU",
                      "\t\tif (retval >= 0 && !test_ti_thread_flag(current_thread_info(), TIF_SYSCALL_TRACEPOINT))",
                      "\t\t\tksu_handle_setresuid(ksu_old_uid, current_uid().val);",
                      "#endif",
                      "\t}",
                  ])
              fn_body = fn_body[:m_cc.start()] + cc_repl + fn_body[m_cc.end():]
              sys_txt = sys_txt[:m_sr.end()] + fn_body + sys_txt[next_fn:]

              # Hook SYSCALL_DEFINE1(newuname) for SUSFS uname spoofing
              sys_txt = re.sub(
                  r"(memcpy\s*\(\s*&tmp\s*,\s*&utsname\s*\(\s*\)\s*->\s*sysname\s*,\s*sizeof\s*\(\s*tmp\s*\)\s*\)\s*;)",
                  r"\1\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif",
                  sys_txt,
                  count=1,
              )

              # Hook SYSCALL_DEFINE5(prctl) for SUSFS userspace commands
              m_pr = re.search(r"SYSCALL_DEFINE5\s*\(\s*prctl\s*,[^{]+\{", sys_txt)
              assert m_pr, "SYSCALL_DEFINE5(prctl) not found in kernel/sys.c"
              m_sec = re.search(r"error\s*=\s*security_task_prctl\s*\([^;]+;", sys_txt[m_pr.end():])
              assert m_sec, "security_task_prctl call not found in SYSCALL_DEFINE5(prctl)"
              idx_pr = m_pr.end() + m_sec.start()
              pr_hook = "\n".join([
                  "#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SUSFS)",
                  "\tif ((unsigned int)option == 0xdeadbeefU && arg2 >= 0x55550UL && arg2 <= 0x60000UL) {",
                  "\t\tif (ksu_handle_susfs_command((int)option, 0, (unsigned int)arg2, (void __user *)arg3, (void __user *)arg5) == 0)",
                  "\t\t\treturn 0;",
                  "\t}",
                  "#endif",
                  "\t",
              ])
              sys_txt = sys_txt[:idx_pr] + pr_hook + sys_txt[idx_pr:]
              sys_c.write_text(sys_txt, encoding="utf-8")
              log("[Fix #5b] Wired tracepoint-guarded __sys_setresuid, newuname, and prctl hooks in kernel/sys.c")

          (diag / "integration-summary.txt").write_text("\n".join(report) + "\n", encoding="utf-8")
          PYRUNTIME

          git diff > "${DIAG_DIR}/patches/kernel-tree-integration.diff"
          git -C KernelSU-Next diff > "${DIAG_DIR}/patches/ksunext-integration.diff"

      - name: F1. Configure kernel (.config) and run SUSFS + KSU-Next preflight compilation
        env:
          INPUT_MGR_PKG: ${{ github.event.inputs.ksu_manager_package || 'com.rifsxd.ksunext' }}
          INPUT_MGR_SIZE: ${{ github.event.inputs.ksu_manager_size || '0x3e6' }}
          INPUT_MGR_HASH: ${{ github.event.inputs.ksu_manager_hash || '0cbd8ba08218d2f5a7fbe2820534f670f9c396199620845557185460d06b2d76' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          exec > >(tee -a "${DIAG_DIR}/configure-build.log") 2>&1
          cd "${GITHUB_WORKSPACE}"

          make ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" "${DEFCONFIG}"

          scripts/config --file .config \
            --set-str LOCALVERSION "-Darknight" \
            --disable LOCALVERSION_AUTO \
            --enable KSU \
            --enable KSU_DEBUG \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_HAS_MAGIC_MOUNT \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            --enable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --disable KSU_SUSFS_SUS_OVERLAYFS \
            --enable KSU_SUSFS_TRY_UMOUNT \
            --enable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --disable KSU_SUSFS_SUS_SU \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable FTRACE \
            --enable FTRACE_SYSCALLS \
            --enable HAVE_SYSCALL_TRACEPOINTS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable SECURITY_SELINUX \
            --disable SECURITY_SELINUX_ALWAYS_PERMISSIVE \
            --disable SECURITY_SELINUX_DISABLE

          make ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig
          make ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" syncconfig
          make ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" prepare scripts

          # Generate SELinux flask.h and av_permissions.h required by non-GKI SELinux rules
          SELINUX_GENHDR="scripts/selinux/genheaders/genheaders"
          test -x "${SELINUX_GENHDR}"
          "${SELINUX_GENHDR}" security/selinux/flask.h security/selinux/av_permissions.h
          test -s security/selinux/flask.h
          test -s security/selinux/av_permissions.h

          cp -f .config "${DIAG_DIR}/final-kernel.config"
          grep -E "^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_FTRACE|CONFIG_HAVE_SYSCALL_TRACEPOINTS|CONFIG_KALLSYMS|CONFIG_SECURITY_SELINUX|CONFIG_LOCALVERSION)" .config \
            > "${DIAG_DIR}/config-summary.txt"
          cat "${DIAG_DIR}/config-summary.txt"

          grep -Fxq 'CONFIG_LOCALVERSION="-Darknight"' include/config/auto.conf
          grep -Fxq 'CONFIG_KSU=y' .config
          grep -Fxq 'CONFIG_KSU_SUSFS=y' .config
          grep -Fxq 'CONFIG_KALLSYMS=y' .config
          grep -Fxq 'CONFIG_KALLSYMS_ALL=y' .config
          ! grep -Fxq 'CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y' .config

          KREL="$(make -s ARCH="${ARCH}" kernelrelease)"
          echo "Verified make kernelrelease: ${KREL}"
          if [ "${KREL}" != "${EXPECTED_KERNEL_RELEASE}" ]; then
            echo "ERROR: Expected kernelrelease '${EXPECTED_KERNEL_RELEASE}', got '${KREL}'" >&2
            exit 1
          fi

          # Preflight compile of modified kernel files, fs/susfs.o, and drivers/kernelsu/
          make -j"$(nproc)" V=1 ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            KSU_MANAGER_PACKAGE="${INPUT_MGR_PKG}" \
            KSU_NEXT_MANAGER_SIZE="${INPUT_MGR_SIZE}" \
            KSU_NEXT_MANAGER_HASH="${INPUT_MGR_HASH}" \
            fs/namespace.o fs/susfs.o fs/exec.o kernel/reboot.o kernel/sys.o \
            drivers/soc/samsung/exynos-el3_mon.o drivers/kernelsu/ \
            2>&1 | tee "${DIAG_DIR}/ksu-preflight-build.log"

          test -s fs/susfs.o
          test -s drivers/kernelsu/built-in.a
          find drivers/kernelsu -name "*.o" | sort | tee "${DIAG_DIR}/ksu-compiled-objects.txt"

      - name: F2. Build full arm64 Image and vmlinux and verify symbols/disassembly
        env:
          INPUT_MGR_PKG: ${{ github.event.inputs.ksu_manager_package || 'com.rifsxd.ksunext' }}
          INPUT_MGR_SIZE: ${{ github.event.inputs.ksu_manager_size || '0x3e6' }}
          INPUT_MGR_HASH: ${{ github.event.inputs.ksu_manager_hash || '0cbd8ba08218d2f5a7fbe2820534f670f9c396199620845557185460d06b2d76' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          BUILD_START_EPOCH="$(date +%s)"
          make -j"$(nproc)" ARCH="${ARCH}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            KSU_MANAGER_PACKAGE="${INPUT_MGR_PKG}" \
            KSU_NEXT_MANAGER_SIZE="${INPUT_MGR_SIZE}" \
            KSU_NEXT_MANAGER_HASH="${INPUT_MGR_HASH}" \
            Image 2>&1 | tee "${DIAG_DIR}/kernel-build.log"

          IMAGE_PATH="${GITHUB_WORKSPACE}/arch/arm64/boot/Image"
          VMLINUX_PATH="${GITHUB_WORKSPACE}/vmlinux"
          test -s "${IMAGE_PATH}"
          test -s "${VMLINUX_PATH}"

          IMAGE_MTIME="$(stat -c %Y "${IMAGE_PATH}")"
          if [ "${IMAGE_MTIME}" -lt "${BUILD_START_EPOCH}" ]; then
            echo "ERROR: Built Image timestamp (${IMAGE_MTIME}) is older than build start (${BUILD_START_EPOCH})" >&2
            exit 1
          fi

          # Verify arm64 Image magic ("ARM\x64" at byte offset 56)
          python3 - << 'PYEOF'
          from pathlib import Path
          img = Path("arch/arm64/boot/Image").read_bytes()
          magic = img[56:60]
          assert magic == b"ARM\x64", f"Invalid ARM64 Image magic at offset 56: {magic!r}"
          assert b"4.19.325-Darknight" in img, "Release string 4.19.325-Darknight not found in Image"
          print("Verified ARM64 Image magic and embedded 4.19.325-Darknight release string.")
          PYEOF

          strings "${IMAGE_PATH}" | grep -E "^Linux version 4\.19\.325-Darknight" | head -n 5 | tee "${DIAG_DIR}/kernel-image-version.txt"
          grep -q "4.19.325-Darknight" "${DIAG_DIR}/kernel-image-version.txt"

          # Audit vmlinux symbol table for mandatory KernelSU-Next and SUSFS symbols
          llvm-nm "${VMLINUX_PATH}" > "${DIAG_DIR}/vmlinux-all-symbols.txt"
          grep -E "(ksu_|kernelsu_|susfs_|track_throne|apply_kernelsu_rules|on_post_fs_data|phys_from_virt)" \
            "${DIAG_DIR}/vmlinux-all-symbols.txt" | sort > "${DIAG_DIR}/vmlinux-ksu-susfs-symbols.txt"

          for sym in \
            kernelsu_init \
            ksu_handle_sys_reboot \
            ksu_handle_setresuid \
            ksu_handle_execveat_ksud \
            ksu_disable_seccomp_for_manager \
            ksu_install_fd \
            track_throne \
            apply_kernelsu_rules \
            on_post_fs_data \
            phys_from_virt \
            ksu_patch_text \
            susfs_init \
            susfs_spoof_uname \
            susfs_add_sus_path; do
            if ! awk '{print $3}' "${DIAG_DIR}/vmlinux-ksu-susfs-symbols.txt" | grep -qx "${sym}"; then
              echo "ERROR: Mandatory symbol '${sym}' missing from vmlinux!" >&2
              exit 1
            fi
          done
          rm -f "${DIAG_DIR}/vmlinux-all-symbols.txt"

          # Disassemble __arm64_sys_reboot in vmlinux to prove direct call to ksu_handle_sys_reboot
          REBOOT_VA="0x$(llvm-nm "${VMLINUX_PATH}" | awk '$3 == "__arm64_sys_reboot" {print $1; exit}')"
          REBOOT_END="$(python3 -c "print(hex(int('${REBOOT_VA}', 16) + 0x120))")"
          llvm-objdump -d --start-address="${REBOOT_VA}" --stop-address="${REBOOT_END}" \
            "${VMLINUX_PATH}" | tee "${DIAG_DIR}/reboot-disasm.txt"
          grep -q "ksu_handle_sys_reboot" "${DIAG_DIR}/reboot-disasm.txt"

          BUILT_IMAGE_SHA256="$(sha256sum "${IMAGE_PATH}" | awk '{print $1}')"
          echo "${BUILT_IMAGE_SHA256}  arch/arm64/boot/Image" | tee "${DIAG_DIR}/built-image.sha256"
          echo "BUILT_IMAGE_SHA256=${BUILT_IMAGE_SHA256}" >> "${GITHUB_ENV}"

      - name: G. Package OriginSU-style AnyKernel3 installer and validate scripts/hashes
        env:
          INPUT_MGR_PKG: ${{ github.event.inputs.ksu_manager_package || 'com.rifsxd.ksunext' }}
          INPUT_MGR_SIZE: ${{ github.event.inputs.ksu_manager_size || '0x3e6' }}
          INPUT_MGR_HASH: ${{ github.event.inputs.ksu_manager_hash || '0cbd8ba08218d2f5a7fbe2820534f670f9c396199620845557185460d06b2d76' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          AK3_DIR="${RUNNER_TEMP}/AnyKernel3"
          rm -rf "${AK3_DIR}"
          git clone --depth=1 "${ANYKERNEL_REPO}" "${AK3_DIR}"
          rm -rf "${AK3_DIR}/.git" "${AK3_DIR}/modules" "${AK3_DIR}/patch" "${AK3_DIR}/ramdisk"

          cp -f "${GITHUB_WORKSPACE}/arch/arm64/boot/Image" "${AK3_DIR}/Image"

          # Enhance update-binary devicecheck so do.devicecheck=1 also inspects ro.boot.em.model,
          # ro.boot.bootloader, ro.boot.hardware, and ro.product.board
          python3 - << 'PYEOF'
          import os
          from pathlib import Path

          ak3 = Path(os.environ["RUNNER_TEMP"]) / "AnyKernel3"
          ub = ak3 / "META-INF" / "com" / "google" / "android" / "update-binary"
          txt = ub.read_text(encoding="utf-8")
          old_block = "  for devicename in $device $product $vendordevice $vendorproduct; do"
          new_block = (
              "  local bootmodel prodmodel bootloader boothw prodboard;\n"
              "  bootmodel=$(getprop ro.boot.em.model 2>/dev/null);\n"
              "  prodmodel=$(getprop ro.product.model 2>/dev/null);\n"
              "  bootloader=$(getprop ro.boot.bootloader 2>/dev/null);\n"
              "  boothw=$(getprop ro.boot.hardware 2>/dev/null);\n"
              "  prodboard=$(getprop ro.product.board 2>/dev/null);\n"
              "  case \"$bootloader\" in A135F*|A135M*) bootmodel=\"SM-A135F\";; esac;\n"
              "  if [ -n \"$boothw\" ] && [ \"$boothw\" != \"exynos850\" ] && [ \"$prodboard\" != \"exynos850\" ]; then\n"
              "    abort \" \" \"Unsupported SoC ($boothw / $prodboard). Expected exynos850. Aborting...\";\n"
              "  fi;\n"
              "  for devicename in $bootmodel $prodmodel $ boothw $prodboard $device $product $vendordevice $vendorproduct; do"
          ).replace("$ boothw", "$boothw")
          if old_block in txt:
              txt = txt.replace(old_block, new_block, 1)
              ub.write_text(txt, encoding="utf-8")
          PYEOF

          cat << 'EOF' > "${AK3_DIR}/anykernel.sh"
          ### AnyKernel3 Ramdisk Mod Script
          ## Darknight 4.19.325 KernelSU-Next + SUSFS for Samsung Galaxy A13 4G (SM-A135F / Exynos 850)
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Darknight 4.19.325 KernelSU-Next v3.4.1 (33333) + SUSFS for SM-A135F
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=a13
          device.name2=a13nsxx
          device.name3=a13snxx
          device.name4=a13x
          device.name5=exynos850
          device.name6=a14
          device.name7=a04s
          device.name8=SM-A135F
          device.name9=universal3830
          supported.versions=13,14,15
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          if [ ! -e "$BLOCK" ] && [ -e "/dev/block/platform/12100000.dwmmc0/by-name/boot" ]; then
            BLOCK="/dev/block/platform/12100000.dwmmc0/by-name/boot"
          fi
          [ -e "$BLOCK" ] || abort "Boot partition block device ($BLOCK) not found. Aborting."

          # Attempt non-fatal rollback backup before modifying boot partition
          for bak_dir in /sdcard/Download /data/media/0/Download /tmp; do
            if [ -d "$bak_dir" ] && [ -w "$bak_dir" ]; then
              if dd if="$BLOCK" of="$bak_dir/boot-backup-pre-Darknight.img" bs=4096 2>/dev/null; then
                ui_print "Saved rollback boot backup: $bak_dir/boot-backup-pre-Darknight.img"
                break
              fi
            fi
          done

          split_boot;
          flash_boot;
          EOF
          sed -i 's/^          //' "${AK3_DIR}/anykernel.sh"
          chmod 0755 "${AK3_DIR}/anykernel.sh"

          cat << 'EOF' > "${AK3_DIR}/ROLLBACK.md"
          # Rollback Plan — Samsung Galaxy A13 4G (SM-A135F)

          1. **Automatic Backup During Flash**:
             The installer attempts to dump your current `/dev/block/by-name/boot` partition to:
             - `/sdcard/Download/boot-backup-pre-Darknight.img` (or `/tmp/boot-backup-pre-Darknight.img` in recovery).
          2. **Restore via TWRP / OrangeFox Recovery**:
             - Reboot to Recovery -> **Install** -> **Install Image** -> select `boot-backup-pre-Darknight.img` -> target **Boot** partition -> Swipe to flash, or
             - Flash your previous working AnyKernel3 ZIP (e.g. `Originkernel.zip`).
          3. **Restore via Odin / Heimdall (Download Mode)**:
             - Pack your stock/working `boot.img` (`tar -H ustar -cf boot-restore.tar boot.img`) and flash in Odin `AP` slot.
          EOF
          sed -i 's/^          //' "${AK3_DIR}/ROLLBACK.md"

          python3 - << 'PYEOF'
          import json, os, time
          from pathlib import Path

          meta = {
              "device_model": "SM-A135F",
              "soc": "exynos850 (universal3830)",
              "kernel_release": os.environ["EXPECTED_KERNEL_RELEASE"],
              "kernel_source_repo": os.environ["KERNEL_REPO"],
              "kernel_source_branch": os.environ["KERNEL_BRANCH"],
              "kernel_source_commit": Path(os.environ["DIAG_DIR"], "kernel-source-commit.txt").read_text().strip(),
              "defconfig": os.environ["DEFCONFIG"],
              "toolchain_neutron_tag": os.environ["NEUTRON_TAG"],
              "ksunext_repo": os.environ["KSUNEXT_REPO"],
              "ksunext_commit": os.environ["KSUNEXT_COMMIT"],
              "ksunext_tag": os.environ["KSUNEXT_TAG"],
              "ksunext_driver_version": int(os.environ["KSUNEXT_VERSION"]),
              "ksu_manager_package": os.environ["INPUT_MGR_PKG"],
              "ksu_manager_cert_size": os.environ["INPUT_MGR_SIZE"],
              "ksu_manager_cert_sha256": os.environ["INPUT_MGR_HASH"],
              "susfs_userspace_repo": os.environ["BRENE_REPO"],
              "susfs_userspace_commit": os.environ["BRENE_SHA"],
              "susfs_kernel_repo": os.environ["SUSFS4KSU_REPO"],
              "susfs_kernel_branch": os.environ["SUSFS4KSU_BRANCH"],
              "susfs_kernel_commit": os.environ["SUSFS4KSU_SHA"],
              "built_image_sha256": os.environ["BUILT_IMAGE_SHA256"],
              "build_timestamp_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "runtime_verification_status": "NOT TESTED (CI build & static/binary audit only; requires on-device flash test)",
          }
          out_json = json.dumps(meta, indent=2) + "\n"
          Path(os.environ["DIAG_DIR"], "build-metadata.json").write_text(out_json, encoding="utf-8")
          Path(os.environ["RUNNER_TEMP"], "AnyKernel3", "build-metadata.json").write_text(out_json, encoding="utf-8")
          PYEOF

          bash -n "${AK3_DIR}/anykernel.sh"
          bash -n "${AK3_DIR}/META-INF/com/google/android/update-binary"
          shellcheck -s sh -S error "${AK3_DIR}/anykernel.sh" || true

          cd "${AK3_DIR}"
          sha256sum Image anykernel.sh build-metadata.json ROLLBACK.md > SHA256SUMS.txt
          ZIP_NAME="A13X-Darknight-KernelSU-Next-v15-SUSFS-OriginStyle-AnyKernel3.zip"
          ZIP_PATH="${GITHUB_WORKSPACE}/${ZIP_NAME}"
          rm -f "${ZIP_PATH}"
          zip -r9 "${ZIP_PATH}" . -x '*/.git/*' '*/README*' '*placeholder'

          unzip -t "${ZIP_PATH}" > "${DIAG_DIR}/zip-integrity-test.txt"
          UNPACK_TEST_DIR="${RUNNER_TEMP}/verify-zip"
          rm -rf "${UNPACK_TEST_DIR}"
          mkdir -p "${UNPACK_TEST_DIR}"
          unzip -q "${ZIP_PATH}" -d "${UNPACK_TEST_DIR}"

          ZIP_IMAGE_SHA256="$(sha256sum "${UNPACK_TEST_DIR}/Image" | awk '{print $1}')"
          if [ "${ZIP_IMAGE_SHA256}" != "${BUILT_IMAGE_SHA256}" ]; then
            echo "ERROR: Packaged Image SHA-256 (${ZIP_IMAGE_SHA256}) != Built Image SHA-256 (${BUILT_IMAGE_SHA256})" >&2
            exit 1
          fi

          ZIP_SHA256="$(sha256sum "${ZIP_PATH}" | awk '{print $1}')"
          echo "${ZIP_SHA256}  ${ZIP_NAME}" | tee "${DIAG_DIR}/installer-zip.sha256"
          cp -f "${AK3_DIR}/anykernel.sh" "${DIAG_DIR}/anykernel.sh"
          cp -f "${AK3_DIR}/SHA256SUMS.txt" "${DIAG_DIR}/SHA256SUMS.txt"
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: H1. Upload Flashable AnyKernel3 Installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A13X-Darknight-KernelSU-Next-v15-SUSFS-OriginStyle-AnyKernel3
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: H2. Upload Build Diagnostics, Metadata, and Patch Diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A13X-Darknight-v15-Build-Diagnostics-${{ github.run_id }}
          path: ${{ github.workspace }}/diagnostics/
          if-no-files-found: warn
