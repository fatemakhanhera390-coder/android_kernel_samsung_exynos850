name: A13X Darknight KernelSU-Next Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: a13x-darknight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-preflight:
    name: Validate workflow and shell before kernel build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install lint dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq tar gzip xz-utils

      - name: Download latest actionlint release
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 https://api.github.com/repos/rhysd/actionlint/releases/latest \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' -o "$RUNNER_TEMP/actionlint-release.json"
          ASSET_URL="$(jq -r '[.assets[] | select(.name | test("linux_amd64[.]tar[.]gz$"))][0].browser_download_url // empty' "$RUNNER_TEMP/actionlint-release.json")"
          if [[ -z "$ASSET_URL" ]]; then
            echo 'Could not locate the latest actionlint linux_amd64 tar.gz release asset.' >&2
            jq -r '.assets[].name' "$RUNNER_TEMP/actionlint-release.json" >&2 || true
            exit 1
          fi
          curl -fL --retry 3 "$ASSET_URL" -o "$RUNNER_TEMP/actionlint.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          test -x "$RUNNER_TEMP/actionlint/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint/actionlint" -version

      - name: Download latest ShellCheck release
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/koalaman/shellcheck/releases/latest \
            -o "$RUNNER_TEMP/shellcheck-release.json"
          SHELLCHECK_TAG="$(jq -r '.tag_name // empty' "$RUNNER_TEMP/shellcheck-release.json")"
          ASSET_URL="$(jq -r '[.assets[] | select(.name | endswith(".linux.x86_64.tar.xz"))][0].browser_download_url // empty' "$RUNNER_TEMP/shellcheck-release.json")"
          if [[ -z "$SHELLCHECK_TAG" || -z "$ASSET_URL" ]]; then
            echo 'Could not locate the latest ShellCheck Linux x86_64 release asset.' >&2
            jq -r '.assets[].name' "$RUNNER_TEMP/shellcheck-release.json" >&2 || true
            exit 1
          fi
          curl -fL --retry 3 "$ASSET_URL" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          mkdir -p "$RUNNER_TEMP/shellcheck"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck"
          SHELLCHECK_BIN="$(find "$RUNNER_TEMP/shellcheck" -type f -name shellcheck -perm /111 -print -quit)"
          [[ -n "$SHELLCHECK_BIN" && -x "$SHELLCHECK_BIN" ]] || {
            echo 'The downloaded ShellCheck archive contains no executable shellcheck binary.' >&2
            find "$RUNNER_TEMP/shellcheck" -maxdepth 5 -type f -print | sort >&2 || true
            exit 1
          }
          SHELLCHECK_BIN_DIR="$(dirname "$SHELLCHECK_BIN")"
          echo "$SHELLCHECK_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SHELLCHECK_BIN_DIR:$PATH"
          echo "Installed latest ShellCheck release: $SHELLCHECK_TAG"
          shellcheck --version

      - name: Lint all GitHub Actions workflows and embedded shell
        shell: bash
        run: |
          set -Eeuo pipefail
          actionlint -color -oneline .github/workflows/main.yml

  build:
    needs: workflow-preflight
    name: Build A13X Darknight + KernelSU-Next + AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KERNEL_REPO: Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850
      KERNEL_BRANCH: lineage-24.0
      DEFCONFIG: exynos850-a13nsxx_defconfig
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      LLVM: '1'
      LLVM_IAS: '1'
      # These two versions are intentionally pinned to the user's requirements.
      # Other CI utilities/actions are updated independently.
      NEUTRON_TAG: '06092026'
      KSU_REF: '8f902aeb16033024143ae36cf711df902cf02fae'
      EXPECTED_KSU_COMMIT: '8f902aeb16033024143ae36cf711df902cf02fae'
      KSU_REPO: KernelSU-Next/KernelSU-Next
      KERNEL_BUILD_JOBS: '2'

    steps:
      - name: Checkout A13 kernel source
        uses: actions/checkout@v7
        with:
          repository: Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850
          ref: lineage-24.0
          path: kernel
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize diagnostics directory
        if: always()
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/diagnostics"

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git jq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libelf-dev libncurses-dev libssl-dev python3 python-is-python3 \
            rsync dwarves zstd lz4 zip unzip file

      - name: Download Neutron Clang 24 release
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/diagnostics/toolchain-install.log") 2>&1
          [[ "$NEUTRON_TAG" =~ ^[0-9]{8}$ ]] || {
            echo "Invalid Neutron tag: $NEUTRON_TAG (expected DDMMYYYY)" >&2
            exit 1
          }
          API_URL="https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/tags/${NEUTRON_TAG}"
          curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' "$API_URL" \
            -o "$RUNNER_TEMP/neutron-release.json"
          ASSET_URL="$(jq -r '[.assets[] | select(.name | endswith(".tar.zst"))][0].browser_download_url // empty' "$RUNNER_TEMP/neutron-release.json")"
          if [[ -z "$ASSET_URL" || "$ASSET_URL" == null ]]; then
            echo "No .tar.zst Neutron Clang asset found for tag $NEUTRON_TAG" >&2
            jq -r '.assets[].name' "$RUNNER_TEMP/neutron-release.json" || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/neutron-clang"
          curl -fL --retry 3 "$ASSET_URL" -o "$RUNNER_TEMP/neutron-clang.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/neutron-clang.tar.zst" -C "$RUNNER_TEMP/neutron-clang"

          # Some Neutron catalogue archives ship the compiler as clang-24 rather than clang.
          # Find both regular files and symlinks, then expose the conventional LLVM=1 tool names.
          CLANG_BIN=""
          for candidate in clang clang-24 clang-24.0 clang-24.0.0 clang-24.0.0git; do
            CLANG_BIN="$(find "$RUNNER_TEMP/neutron-clang" \( -type f -o -type l \) \
              -path '*/bin/*' -name "$candidate" -print -quit)"
            [[ -n "$CLANG_BIN" ]] && break
          done
          [[ -n "$CLANG_BIN" && -x "$CLANG_BIN" ]] || {
            echo "Could not locate executable clang or clang-24 inside release asset." >&2
            find "$RUNNER_TEMP/neutron-clang" \( -type f -o -type l \) -maxdepth 5 -print | sort | head -250 || true
            exit 1
          }

          TOOLCHAIN_BIN="$(dirname "$CLANG_BIN")"
          if [[ "$(basename "$CLANG_BIN")" != "clang" ]]; then
            ln -sfn "$(basename "$CLANG_BIN")" "$TOOLCHAIN_BIN/clang"
          fi

          # Supply conventional aliases for version-suffixed LLVM tools where needed.
          for tool in clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-ranlib llvm-size llvm-strings llvm-cov; do
            if [[ ! -x "$TOOLCHAIN_BIN/$tool" ]]; then
              for suffix in -24 -24.0 -24.0.0 -24.0.0git; do
                if [[ -x "$TOOLCHAIN_BIN/${tool}${suffix}" ]]; then
                  ln -sfn "${tool}${suffix}" "$TOOLCHAIN_BIN/$tool"
                  break
                fi
              done
            fi
          done
          # Compiler packages may provide only clang-24, not clang++-24.
          if [[ ! -x "$TOOLCHAIN_BIN/clang++" ]]; then
            ln -sfn "$(basename "$CLANG_BIN")" "$TOOLCHAIN_BIN/clang++"
          fi
          [[ -x "$TOOLCHAIN_BIN/ld.lld" ]] || {
            echo "Could not locate ld.lld in $TOOLCHAIN_BIN" >&2
            find "$RUNNER_TEMP/neutron-clang" \( -type f -o -type l \) -path '*/bin/*' -print | sort | head -250 || true
            exit 1
          }

          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          echo "NEUTRON_CLANG_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"
          # GITHUB_PATH takes effect in following steps only; update this shell as well.
          export PATH="$TOOLCHAIN_BIN:$PATH"
          echo "Using compiler at: $(command -v clang)"
          clang --version
          ld.lld --version
          clang --version | grep -Eq 'version 24\.0\.0git' || {
            echo "Expected Clang 24.0.0git from tag 06092026; actual compiler version differs." >&2
            exit 1
          }

      - name: Integrate pinned KernelSU-Next (no SUSFS)
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_REF}/kernel/setup.sh" \
            -o "$RUNNER_TEMP/ksu-setup.sh"
          cd "$GITHUB_WORKSPACE/kernel"
          bash "$RUNNER_TEMP/ksu-setup.sh" "$KSU_REF" 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/ksu-setup.log"
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile
          test -d KernelSU-Next/.git
          KSU_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          echo "KernelSU-Next commit: $KSU_COMMIT" | tee "$GITHUB_WORKSPACE/diagnostics/ksu-commit.txt"
          if [[ "$KSU_COMMIT" != "$EXPECTED_KSU_COMMIT" ]]; then
            echo "Pinned KernelSU-Next commit mismatch: got $KSU_COMMIT, expected $EXPECTED_KSU_COMMIT" >&2
            exit 1
          fi
          echo "Requested KernelSU-Next ref: $KSU_REF" >> "$GITHUB_WORKSPACE/diagnostics/ksu-commit.txt"
          git -C KernelSU-Next status --short >> "$GITHUB_WORKSPACE/diagnostics/ksu-commit.txt"
          # KernelSU-Next at this pinned revision uses its own syscall dispatcher / tracepoint
          # hook manager. Do NOT apply the older backslashxx legacy manual-call-site script:
          # it expects APIs such as ksu_handle_execveat that this revision does not export.
          KSU_REV_COUNT="$(git -C KernelSU-Next rev-list --count HEAD)"
          KSU_DRIVER_VERSION="$((30000 + KSU_REV_COUNT))"
          {
            echo "KernelSU-Next commit: $KSU_COMMIT"
            echo "KernelSU-Next git revision count: $KSU_REV_COUNT"
            echo "Calculated KernelSU driver version: $KSU_DRIVER_VERSION"
            echo "Expected manager/driver baseline: 33333"
            echo 'Integration model: KernelSU-Next syscall dispatcher + syscall tracepoint hook manager'
            echo 'Legacy syscall_hook_patches.sh: intentionally NOT applied (API mismatch with this KSU-Next revision)'
          } | tee "$GITHUB_WORKSPACE/diagnostics/ksu-version-info.txt"
          if [[ "$KSU_DRIVER_VERSION" != "33333" ]]; then
            echo "KernelSU driver version mismatch: calculated $KSU_DRIVER_VERSION, expected 33333. Refuse to build an incompatible image." >&2
            exit 1
          fi
          for source in kernel/hook/syscall_hook_manager.c kernel/hook/syscall_event_bridge.c kernel/hook/arm64/syscall_hook.c kernel/feature/sucompat.c; do
            test -s "KernelSU-Next/$source" || { echo "Required KernelSU-Next source missing: $source" >&2; exit 1; }
          done
          grep -q 'ksu_syscall_hook_manager_init' KernelSU-Next/kernel/hook/syscall_hook_manager.c
          grep -q 'register_trace_prio_sys_enter' KernelSU-Next/kernel/hook/syscall_hook_manager.c
          grep -q 'ksu_register_syscall_hook(__NR_execveat' KernelSU-Next/kernel/hook/syscall_hook_manager.c
          echo 'Pinned KernelSU-Next dispatcher integration sources verified.'

      - name: Patch KernelSU-Next VFS operations for the Samsung 4.19.325 tree
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          KSU_FILE="KernelSU-Next/kernel/infra/file_wrapper.c"
          test -f "$KSU_FILE" || { echo "KernelSU file_wrapper.c not found: $KSU_FILE" >&2; exit 1; }
          python3 - "$KSU_FILE" <<'PYVFS'
          from pathlib import Path
          import re, sys

          path = Path(sys.argv[1])
          src = path.read_text()
          original = src

          # The target Samsung Exynos850 4.19.325 vendor tree lacks these
          # optional struct file_operations members. Remove only their wrappers.
          src, iopoll_block = re.subn(
              r'#if LINUX_VERSION_CODE >= KERNEL_VERSION\(6, 1, 0\)\n'
              r'static int ksu_wrapper_iopoll\b.*?^#endif[ \t]*\n',
              '', src, count=1, flags=re.S | re.M
          )
          if iopoll_block != 1:
              raise SystemExit('Expected KernelSU-Next iopoll wrapper block not found exactly once; refusing unsafe patch.')

          src, iopoll_assignment = re.subn(
              r'^\s*p->ops\.iopoll = fp->f_op->iopoll \? ksu_wrapper_iopoll : NULL;\s*\n',
              '', src, count=1, flags=re.M
          )
          if iopoll_assignment != 1:
              raise SystemExit('Expected iopoll assignment not found exactly once.')

          src, remap_helper = re.subn(
              r'^// no REMAP_FILE_DEDUP: use file_in\n.*?(?=^static int ksu_wrapper_fadvise\b)',
              '', src, count=1, flags=re.S | re.M
          )
          if remap_helper != 1:
              raise SystemExit('Expected remap_file_range wrapper block not found exactly once.')

          src, remap_assignment = re.subn(
              r'^\s*p->ops\.remap_file_range =\n'
              r'\s*fp->f_op->remap_file_range \? ksu_wrapper_remap_file_range : NULL;\s*\n',
              '', src, count=1, flags=re.M
          )
          if remap_assignment != 1:
              raise SystemExit('Expected remap_file_range assignment not found exactly once.')

          marker = '#include "infra/file_wrapper.h"\n'
          comment = (
              '\n/* Darknight target compatibility: the Samsung Exynos850 4.19.325 vendor tree\n'
              ' * omits file_operations.iopoll and file_operations.remap_file_range.\n'
              ' * The corresponding optional callbacks are omitted; other KernelSU-Next\n'
              ' * file-wrapper operations remain unchanged.\n'
              ' */\n'
          )
          if marker not in src:
              raise SystemExit('Cannot locate stable include marker for compatibility note.')
          if 'Darknight target compatibility:' not in src:
              src = src.replace(marker, marker + comment, 1)

          if src == original:
              raise SystemExit('No KernelSU compatibility changes were made.')
          path.write_text(src)
          print('Applied 4.19 VFS compatibility patch: omitted iopoll/remap_file_range callbacks only.')
          PYVFS
          git -C KernelSU-Next diff --check
          git -C KernelSU-Next diff --binary -- kernel/infra/file_wrapper.c \
            > "$GITHUB_WORKSPACE/diagnostics/ksu-4.19-vfs-compatibility.patch"
          cp "$KSU_FILE" "$GITHUB_WORKSPACE/diagnostics/ksu-file_wrapper.c.patched"
          grep -q 'Darknight target compatibility:' "$KSU_FILE"
          if grep -Eq 'p->ops\.iopoll|fp->f_op->iopoll|p->ops\.remap_file_range|fp->f_op->remap_file_range|REMAP_FILE_DEDUP' "$KSU_FILE"; then
            echo 'Unsupported VFS callback references remain in KernelSU file_wrapper.c.' >&2
            exit 1
          fi
          echo 'KernelSU VFS compatibility patch verified and saved in diagnostics.'

      - name: Disable unsupported seccomp-cache internals on Linux 4.19
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          KSU_FILE="KernelSU-Next/kernel/infra/seccomp_cache.c"
          test -f "$KSU_FILE" || { echo "KernelSU seccomp_cache.c not found: $KSU_FILE" >&2; exit 1; }
          python3 - "$KSU_FILE" <<'PYSECCOMP'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          src = path.read_text()
          marker = "DARKNIGHT_LEGACY_SECCOMP_CACHE_STUBS"
          if marker in src:
              raise SystemExit("Darknight seccomp compatibility wrapper is already present; refusing to wrap twice.")
          if "SECCOMP_ARCH_NATIVE_NR" not in src or "ksu_seccomp_allow_cache" not in src or "ksu_seccomp_clear_cache" not in src:
              raise SystemExit("KernelSU-Next seccomp_cache.c differs from the expected pinned source; refusing an unverified patch.")

          prefix = """/*
           * DARKNIGHT_LEGACY_SECCOMP_CACHE_STUBS
           * Linux 4.19 has no SECCOMP_ARCH_NATIVE_NR/action-cache implementation.
           * KernelSU-Next's newer seccomp_cache.c mirrors private seccomp_filter
           * internals that do not exist in this kernel. Never fake the missing
           * structure/NR definitions: the offsets would be unsafe at runtime.
           * The helpers are no-ops when the target kernel has no seccomp action cache.
           */
          #include <linux/version.h>
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 15, 0)
          #include <linux/seccomp.h>
          #include "infra/seccomp_cache.h"

          void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr)
          {
              (void)filter;
              (void)nr;
          }

          void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr)
          {
              (void)filter;
              (void)nr;
          }
          #else
          """
          suffix = "\n#endif /* LINUX_VERSION_CODE < KERNEL_VERSION(5, 15, 0) */\n"
          path.write_text(prefix + src + suffix)
          print("Applied Darknight legacy seccomp-cache compatibility: no-op helpers for Linux < 5.15; original implementation retained for newer kernels.")
          PYSECCOMP

          git -C KernelSU-Next diff --check
          git -C KernelSU-Next diff --binary -- kernel/infra/seccomp_cache.c \
            > "$GITHUB_WORKSPACE/diagnostics/ksu-legacy-seccomp-cache-compatibility.patch"
          cp "$KSU_FILE" "$GITHUB_WORKSPACE/diagnostics/ksu-seccomp_cache.c.patched"
          grep -q 'DARKNIGHT_LEGACY_SECCOMP_CACHE_STUBS' "$KSU_FILE"
          grep -q 'void ksu_seccomp_allow_cache(struct seccomp_filter \*filter, int nr)' "$KSU_FILE"
          grep -q 'void ksu_seccomp_clear_cache(struct seccomp_filter \*filter, int nr)' "$KSU_FILE"
          echo 'KernelSU-Next legacy seccomp-cache compatibility patch verified and saved in diagnostics.'

      - name: Fix legacy mount-flags header include for Linux 4.19
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          FILE="KernelSU-Next/kernel/infra/su_mount_ns.c"
          test -f "$FILE" || { echo "Expected pinned KernelSU source not found: $FILE" >&2; exit 1; }
          python3 - "$FILE" <<'PYMOUNT'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '#include <uapi/linux/mount.h>'
          lines = [
              '#if __has_include(<uapi/linux/mount.h>)',
              '#include <uapi/linux/mount.h>',
              '#else',
              '/* Linux 4.19 vendor tree keeps MS_* mount flags in uapi/linux/fs.h. */',
              '#include <uapi/linux/fs.h>',
              '#endif',
          ]
          new = '/* DARKNIGHT_MOUNT_FLAGS_HEADER_FALLBACK */\n' + '\n'.join(lines) + '\n'
          if 'DARKNIGHT_MOUNT_FLAGS_HEADER_FALLBACK' in s:
              raise SystemExit('Mount header fallback already present; refusing to patch twice.')
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one <uapi/linux/mount.h> include in su_mount_ns.c; inspect source before patching.')
          p.write_text(s.replace(old, new, 1))
          print('Applied conditional UAPI mount-flags header fallback.')
          PYMOUNT
          git -C KernelSU-Next diff --check
          git -C KernelSU-Next diff --binary -- kernel/infra/su_mount_ns.c \
            > "$GITHUB_WORKSPACE/diagnostics/ksu-mount-header-fallback.patch"
          cp "$FILE" "$GITHUB_WORKSPACE/diagnostics/ksu-su_mount_ns.c.patched"
          grep -q 'DARKNIGHT_MOUNT_FLAGS_HEADER_FALLBACK' "$FILE"

      - name: Fix Clang sizeof-pointer warnings in OVT touchscreen test driver
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          FILE="drivers/input/touchscreen/ovt/td4150_spi/ovt_tcm_sec_fn_test.c"
          test -f "$FILE" || { echo "Expected touchscreen source not found: $FILE" >&2; exit 1; }
          python3 - "$FILE" <<'PYFIX'
          from pathlib import Path
          import re, sys

          path = Path(sys.argv[1])
          source = path.read_text()
          pattern = re.compile(
              r'snprintf\(\s*tcm_hcd->print_buf\s*,\s*'
              r'sizeof\(\s*tcm_hcd->print_buf\s*\)\s*,\s*"NG"\s*\)\s*;'
          )
          fixed, count = pattern.subn(
              'memcpy(tcm_hcd->print_buf, "NG", sizeof("NG"));', source
          )
          if count < 1:
              raise SystemExit(
                  'No expected sizeof(pointer) NG call found; inspect source and diagnostics.'
              )
          path.write_text(fixed)
          print(f'Fixed {count} snprintf(sizeof(pointer)) call(s) in {path}.')
          PYFIX
          git diff --check
          git diff --binary -- "$FILE" > "$GITHUB_WORKSPACE/diagnostics/touchscreen-source-fix.patch"
          cp "$FILE" "$GITHUB_WORKSPACE/diagnostics/ovt_tcm_sec_fn_test.c.patched"

      - name: Configure kernel and verify KSU config
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          test -f Makefile
          test -f "arch/arm64/configs/$DEFCONFIG"
          SOURCE_VERSION="$(make -s kernelversion)"
          echo "Kernel source version (base VERSION/PATCHLEVEL/SUBLEVEL/EXTRAVERSION only): $SOURCE_VERSION"
          [[ "$SOURCE_VERSION" == "4.19.325" ]] || {
            echo "Unexpected kernel version: $SOURCE_VERSION (expected 4.19.325)" >&2
            exit 1
          }

          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" "$DEFCONFIG"
          scripts/config --file .config --enable KSU
          scripts/config --file .config --enable KPROBES
          scripts/config --file .config --enable KALLSYMS
          scripts/config --file .config --enable KALLSYMS_ALL
          scripts/config --file .config --enable KSU_DEBUG
          scripts/config --file .config --enable FTRACE
          scripts/config --file .config --enable FTRACE_SYSCALLS
          scripts/config --file .config --enable KRETPROBES
          scripts/config --file .config --set-str LOCALVERSION '-Darknight'
          scripts/config --file .config --disable LOCALVERSION_AUTO

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          config = Path('.config').read_text()
          symbols = sorted(set(re.findall(r'^(?:# )?(CONFIG_[A-Z0-9_]*SUSFS[A-Z0-9_]*)', config, re.M)))
          for symbol in symbols:
              subprocess.run(['scripts/config', '--file', '.config', '--disable', symbol.removeprefix('CONFIG_')], check=True)
          print(f'Disabled {len(symbols)} SUSFS config option(s). No SUSFS repository or patches are added.')
          PY

          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" olddefconfig

          # Linux 4.19's `kernelrelease` target does not sync Kconfig itself.
          # The .config already says -Darknight, but setlocalversion reads
          # include/config/auto.conf, which can still contain the defconfig's
          # old local version (-exynos850) after olddefconfig. Refresh it now.
          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" syncconfig
          grep -Fxq 'CONFIG_LOCALVERSION="-Darknight"' include/config/auto.conf || {
            echo 'include/config/auto.conf did not refresh CONFIG_LOCALVERSION to -Darknight.' >&2
            grep -E '^CONFIG_LOCALVERSION(=|_)' include/config/auto.conf .config || true
            exit 1
          }
          for item in CONFIG_KSU=y CONFIG_KPROBES=y CONFIG_KALLSYMS=y CONFIG_KALLSYMS_ALL=y CONFIG_EXT4_FS=y CONFIG_KSU_DEBUG=y CONFIG_FTRACE=y CONFIG_FTRACE_SYSCALLS=y; do
            grep -Fxq "$item" .config || { echo "Required config missing after olddefconfig: $item" >&2; exit 1; }
          done
          if grep -Eq '^CONFIG_[A-Z0-9_]*SUSFS[A-Z0-9_]*=y' .config; then
            echo 'A SUSFS option remains enabled; aborting.' >&2
            exit 1
          fi
          KRELEASE="$(make -s ARCH="$ARCH" kernelrelease)"
          echo "$KRELEASE" | tee "$GITHUB_WORKSPACE/diagnostics/kernelrelease.txt"
          [[ "$KRELEASE" == "4.19.325-Darknight" ]] || { echo "Unexpected kernel release: $KRELEASE (expected exactly 4.19.325-Darknight)" >&2; exit 1; }
          cp .config "$GITHUB_WORKSPACE/diagnostics/kernel.config"
          grep -E '^(CONFIG_(KSU|KSU_DEBUG|KPROBES|KALLSYMS|KALLSYMS_ALL|EXT4_FS|FTRACE|FTRACE_SYSCALLS|KRETPROBES|LOCALVERSION|LOCALVERSION_AUTO)|# CONFIG_.*SUSFS.* is not set|CONFIG_.*SUSFS.*=)' .config \
            > "$GITHUB_WORKSPACE/diagnostics/config-summary.txt" || true

      - name: Preflight KernelSU objects and report compatibility blockers
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="$GITHUB_WORKSPACE/diagnostics/ksu-preflight-build.log"
          API_REPORT="$GITHUB_WORKSPACE/diagnostics/kernel-api-compatibility.txt"
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          echo "Kernel release: $(make -s ARCH=arm64 kernelrelease)" | tee "$API_REPORT"
          echo "Preflight mode: make -k -j2 drivers/kernelsu/; full Image build is gated on this passing." | tee -a "$API_REPORT"

          # Compile the KernelSU directory first, before spending time building Image.
          # -k attempts independent objects so diagnostics capture more than one error.
          set +e
          make -k V=1 -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" drivers/kernelsu/ 2>&1 | tee "$LOG"
          KSU_MAKE_RC=${PIPESTATUS[0]}
          set -e
          echo "KernelSU object preflight exit code: $KSU_MAKE_RC" | tee -a "$API_REPORT"

          python3 - "$LOG" "$GITHUB_WORKSPACE/diagnostics/ksu-preflight-errors.txt" <<'PYERR'
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          out = []
          pat = re.compile(r'(?:fatal error:|\berror:|undefined reference to|No such file or directory|make(?:\[[0-9]+\])?: \*\*\*|Error [0-9]+|LLVM ERROR:)')
          for i, line in enumerate(src):
              if pat.search(line):
                  out.append(f'--- line {i+1} ---')
                  for j in range(max(0, i-2), min(len(src), i+4)):
                      out.append(f'{j+1}: {src[j]}')
          Path(sys.argv[2]).write_text('\n'.join(out) + ('\n' if out else 'No compiler/linker/make errors detected in KSU preflight log.\n'))
          print(f'Wrote {len(out)} diagnostic lines to {sys.argv[2]}')
          PYERR

          # Detect APIs referenced by the pinned KSU tree but not implemented in this 4.19 kernel.
          # This is a safety gate: never invent a prototype for a missing kernel implementation.
          KSU_SRC="$GITHUB_WORKSPACE/kernel/KernelSU-Next/kernel"
          for api in path_mount path_umount; do
            if grep -R -n --include='*.c' --include='*.h' --include='*.S' \
              -E "^[[:space:]]*(static[[:space:]]+)?(int|long|void|bool|ssize_t|unsigned[[:space:]]+long|struct[[:space:]]+[^*]+[[:space:]]*\*)[[:space:]]+${api}[[:space:]]*\(" \
              "$GITHUB_WORKSPACE/kernel/fs" "$GITHUB_WORKSPACE/kernel/include" 2>/dev/null | grep -v "$KSU_SRC" > "$RUNNER_TEMP/${api}-defs.txt"; then
              echo "$api: a definition was found in the base kernel tree:" | tee -a "$API_REPORT"
              tee -a "$API_REPORT" < "$RUNNER_TEMP/${api}-defs.txt"
            elif grep -R -n --include='*.c' --include='*.h' "\b${api}[[:space:]]*(" "$KSU_SRC" >/dev/null 2>&1; then
              echo "BLOCKER: pinned KernelSU-Next references $api, but no implementation was found in the Linux 4.19 base tree." | tee -a "$API_REPORT"
              echo "A semantics-preserving port is required; refusing to guess a kernel API shim or proceed to full Image compilation." | tee -a "$API_REPORT"
              printf '%s\n' "$api" >> "$GITHUB_WORKSPACE/diagnostics/unresolved-kernel-apis.txt"
            fi
          done

          if [[ "$KSU_MAKE_RC" -ne 0 ]]; then
            echo 'KernelSU object preflight failed; see ksu-preflight-build.log and ksu-preflight-errors.txt.' >&2
            exit "$KSU_MAKE_RC"
          fi
          if [[ -s "$GITHUB_WORKSPACE/diagnostics/unresolved-kernel-apis.txt" ]]; then
            echo 'Unresolved KernelSU kernel APIs remain; full kernel build is intentionally blocked.' >&2
            exit 1
          fi
          echo 'KernelSU object compile and kernel API preflight passed.'

      - name: Compile kernel Image
        shell: bash
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          {
            echo "Build started (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Neutron tag: $NEUTRON_TAG"
            clang --version
            ld.lld --version
            echo "Command: make V=1 -j${KERNEL_BUILD_JOBS} ARCH=$ARCH LLVM=$LLVM LLVM_IAS=$LLVM_IAS CROSS_COMPILE=$CROSS_COMPILE Image (CONFIG_LOCALVERSION is set to -Darknight in .config)"
          } | tee "$GITHUB_WORKSPACE/diagnostics/kernel-build.log"
          make V=1 -j"$KERNEL_BUILD_JOBS" ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" Image 2>&1 | tee -a "$GITHUB_WORKSPACE/diagnostics/kernel-build.log"
          test -s arch/arm64/boot/Image
          file arch/arm64/boot/Image | tee "$GITHUB_WORKSPACE/diagnostics/kernel-image-file.txt"
          strings arch/arm64/boot/Image | grep -m1 'Linux version' | tee "$GITHUB_WORKSPACE/diagnostics/kernel-image-version.txt" || true
          strings arch/arm64/boot/Image | grep -iE -m15 'KernelSU|ksu|grant root|Darknight' \
            > "$GITHUB_WORKSPACE/diagnostics/kernel-image-ksu-strings.txt" || true

      - name: Package TWRP-flashable AnyKernel3 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          AK3="$RUNNER_TEMP/AnyKernel3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3"
          cp "$GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image" "$AK3/Image"
          cat > "$AK3/anykernel.sh" <<'AK3SCRIPT'
          ### AnyKernel3 Ramdisk Mod Script
          ## Darknight KernelSU-Next for Samsung Galaxy A13X (SM-A135F / SM-A135M)
          properties() { '
          kernel.string=Darknight KernelSU-Next for Samsung Galaxy A13X by MAX ARAF
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a13
          device.name2=a13x
          device.name3=a13nsxx
          device.name4=SM-A135F
          device.name5=SM-A135M
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3SCRIPT
          chmod 0755 "$AK3/anykernel.sh"
          rm -rf "$AK3/.git" "$AK3/.github"
          rm -f "$AK3/README.md" "$AK3/README" "$AK3/.gitignore"
          find "$AK3" -name placeholder -type f -delete
          cd "$AK3"
          zip -qr "$GITHUB_WORKSPACE/A13X-Darknight-KernelSU-Next-AnyKernel3.zip" . \
            -x '*/.git/*' '*/README*' '*placeholder'
          unzip -t "$GITHUB_WORKSPACE/A13X-Darknight-KernelSU-Next-AnyKernel3.zip"

          KRELEASE="$(cd "$GITHUB_WORKSPACE/kernel" && make -s ARCH=arm64 kernelrelease)"
          KSU_COMMIT="$(git -C "$GITHUB_WORKSPACE/kernel/KernelSU-Next" rev-parse HEAD)"
          KERNEL_COMMIT="$(git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD)"
          {
            echo "Kernel release: $KRELEASE"
            [[ "$KRELEASE" == "4.19.325-Darknight" ]] || { echo "Refusing to package kernel: expected 4.19.325-Darknight, got $KRELEASE" >&2; exit 1; }
            echo "Kernel source: https://github.com/$KERNEL_REPO/tree/$KERNEL_BRANCH"
            echo "Kernel source commit: $KERNEL_COMMIT"
            echo "KernelSU repository: https://github.com/$KSU_REPO"
            echo "KernelSU ref requested: $KSU_REF"
            echo "KernelSU commit: $KSU_COMMIT"
            echo "KernelSU method: KernelSU-Next pinned source with built-in syscall dispatcher / tracepoint hooks; legacy manual hook script not applied"
            echo "KernelSU driver version: $((30000 + $(git -C "$GITHUB_WORKSPACE/kernel/KernelSU-Next" rev-list --count HEAD)))"
            echo "Neutron Clang tag: $NEUTRON_TAG"
            echo "Architecture: arm64"
            echo "Defconfig: $DEFCONFIG"
            echo "AnyKernel3 target: boot (non-A/B setting; verify on-device partition layout)"
            echo "SUSFS: disabled / not integrated"
            echo "Root access: must be verified on-device; CI cannot guarantee manager grant success"
          } > "$GITHUB_WORKSPACE/build-info.txt"
          (cd "$GITHUB_WORKSPACE" && sha256sum A13X-Darknight-KernelSU-Next-AnyKernel3.zip > sha256sum.txt)

      - name: Upload flashable kernel ZIP and build info
        uses: actions/upload-artifact@v7
        with:
          name: A13X-Darknight-KernelSU-Next-AnyKernel3
          path: |
            A13X-Darknight-KernelSU-Next-AnyKernel3.zip
            build-info.txt
            sha256sum.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnostics (runs even after failed build)
        if: always()
        shell: bash
        run: |
          set +e
          DIAG="$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$DIAG"
          {
            echo "A13X Darknight Kernel build diagnostics"
            echo "UTC time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GitHub repository: $GITHUB_REPOSITORY"
            echo "Workflow run ID: $GITHUB_RUN_ID"
            echo "Workflow run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Runner OS: ${RUNNER_OS:-unknown}"
            echo "Runner arch: ${RUNNER_ARCH:-unknown}"
            echo "Kernel repo: $KERNEL_REPO"
            echo "Kernel branch: $KERNEL_BRANCH"
            echo "Defconfig: $DEFCONFIG"
            echo "Neutron release tag: $NEUTRON_TAG"
            echo "KernelSU repo: $KSU_REPO"
            echo "KernelSU requested ref: $KSU_REF"
            echo 'Legacy syscall hook patch: intentionally disabled; pinned KernelSU-Next revision owns its dispatcher hooks'
            echo 'KernelSU 4.19 VFS compatibility: omits unavailable iopoll/remap_file_range callbacks'
            echo 'KernelSU 4.19 seccomp compatibility: no-op cache helpers because this kernel lacks the action-cache internals'
            echo 'Preflight: compiles KernelSU objects before full Image and blocks on unresolved base-kernel APIs; no arbitrary auto-fixes are attempted.'
            echo
            echo '--- Toolchain ---'
            if command -v clang >/dev/null 2>&1; then clang --version; else echo 'clang unavailable'; fi
            if command -v ld.lld >/dev/null 2>&1; then ld.lld --version; else echo 'ld.lld unavailable'; fi
            echo
            echo '--- Kernel source ---'
            if [[ -d "$GITHUB_WORKSPACE/kernel/.git" ]]; then
              git -C "$GITHUB_WORKSPACE/kernel" rev-parse HEAD
              git -C "$GITHUB_WORKSPACE/kernel" log -1 --format='%H%n%ad%n%s' --date=iso-strict
              git -C "$GITHUB_WORKSPACE/kernel" status --short
              git -C "$GITHUB_WORKSPACE/kernel" diff --check
              git -C "$GITHUB_WORKSPACE/kernel" diff --binary > "$DIAG/all-kernel-source-diffs.patch"
              if [[ -d "$GITHUB_WORKSPACE/kernel/KernelSU-Next/.git" ]]; then
                echo '--- KernelSU-Next commit ---'
                git -C "$GITHUB_WORKSPACE/kernel/KernelSU-Next" rev-parse HEAD
                git -C "$GITHUB_WORKSPACE/kernel/KernelSU-Next" log -1 --format='%H%n%ad%n%s' --date=iso-strict
                git -C "$GITHUB_WORKSPACE/kernel/KernelSU-Next" grep -n -E 'KSU_VERSION|ksu_syscall_hook_manager_init|register_trace_prio_sys_enter|ksu_register_syscall_hook|ksu_handle_execveat_sucompat|ksu_handle_faccessat_sucompat' HEAD -- kernel 2>/dev/null | head -200
                echo '--- KernelSU seccomp-cache compatibility source (working tree) ---'
                grep -n -E 'DARKNIGHT_LEGACY_SECCOMP_CACHE_STUBS|SECCOMP_ARCH_NATIVE_NR|ksu_seccomp_(allow|clear)_cache' "$GITHUB_WORKSPACE/kernel/KernelSU-Next/kernel/infra/seccomp_cache.c" 2>/dev/null | head -100
                git -C "$GITHUB_WORKSPACE/kernel/KernelSU-Next" diff --binary > "$DIAG/ksu-all-source-diffs.patch"
                echo "KSU Git revision count: $(git -C "$GITHUB_WORKSPACE/kernel/KernelSU-Next" rev-list --count HEAD)"
              fi
              if [[ -f "$GITHUB_WORKSPACE/kernel/Makefile" ]]; then
                echo "Kernel version: $(make -s -C "$GITHUB_WORKSPACE/kernel" kernelversion 2>&1)"
                echo "Kernel release: $(make -s -C "$GITHUB_WORKSPACE/kernel" ARCH=arm64 kernelrelease 2>&1)"
              fi
            else
              echo 'Kernel source checkout is unavailable.'
            fi
          } > "$DIAG/build-environment.txt" 2>&1

          if [[ -f "$GITHUB_WORKSPACE/kernel/.config" ]]; then
            cp "$GITHUB_WORKSPACE/kernel/.config" "$DIAG/kernel.config"
            if [[ -f "$GITHUB_WORKSPACE/kernel/include/config/auto.conf" ]]; then
              cp "$GITHUB_WORKSPACE/kernel/include/config/auto.conf" "$DIAG/kernel.auto.conf"
              grep -E '^CONFIG_LOCALVERSION(=|_)' "$GITHUB_WORKSPACE/kernel/include/config/auto.conf" \
                > "$DIAG/auto-localversion-summary.txt" || true
            fi
            grep -E '^(CONFIG_(KSU|KSU_DEBUG|KPROBES|KALLSYMS|KALLSYMS_ALL|EXT4_FS|FTRACE|FTRACE_SYSCALLS|KRETPROBES|LOCALVERSION|LOCALVERSION_AUTO)|# CONFIG_.*SUSFS.* is not set|CONFIG_.*SUSFS.*=)' \
              "$GITHUB_WORKSPACE/kernel/.config" > "$DIAG/config-summary.txt" || true
          else
            echo 'Kernel .config was not generated.' > "$DIAG/config-summary.txt"
          fi

          : > "$DIAG/errors-summary.txt"
          for log in "$DIAG"/*.log; do
            [[ -f "$log" ]] || continue
            {
              echo "===== $(basename "$log") ====="
              grep -nE -i '(^|[[:space:]])(fatal )?error:|error generated|errors? generated|make\[[0-9]+\]: \*\*\*|Error [0-9]+|undefined reference to|No such file or directory|LLVM ERROR:|Broken pipe|warning:' "$log" || true
              echo
            } >> "$DIAG/errors-summary.txt"
          done
          if [[ -f "$DIAG/kernel-build.log" ]]; then
            tail -n 250 "$DIAG/kernel-build.log" > "$DIAG/kernel-build-last-250-lines.txt" || true
          fi
          python3 - "$DIAG" <<'PYDIAG'
          from pathlib import Path
          import re, sys
          d = Path(sys.argv[1])
          sources = [p for p in d.glob('*.log') if p.is_file()]
          primary = []
          warnings = []
          broken = 0
          error_pat = re.compile(r'(:\d+(?::\d+)?:\s*(?:fatal )?error:|undefined reference to|No such file or directory|make(?:\[[0-9]+\])?: \*\*\*|Error [0-9]+|LLVM ERROR:)')
          for p in sources:
              lines = p.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if 'Broken pipe' in line:
                      broken += 1
                      continue
                  if error_pat.search(line):
                      ctx = lines[max(0, i-1):min(len(lines), i+3)]
                      primary.append((p.name, i+1, '\n'.join(ctx)))
                  elif 'warning:' in line.lower():
                      warnings.append(f'{p.name}:{i+1}: {line}')
          seen = set()
          out = []
          for name, line_no, block in primary:
              key = (name, block)
              if key in seen:
                  continue
              seen.add(key)
              out.extend([f'[{name}:{line_no}]', block, ''])
          if not out:
              out = ['No matching compiler/linker/make errors found in captured logs.']
          out += ['', f'Broken-pipe messages (possibly secondary): {broken}', f'Warnings captured: {len(warnings)}', 'See errors-summary.txt and individual logs for full context.']
          (d/'primary-errors.txt').write_text('\n'.join(out) + '\n')
          (d/'warnings-summary.txt').write_text('\n'.join(warnings) + ('\n' if warnings else 'No warnings captured.\n'))
          print(f'Primary diagnostic blocks: {len(seen)}; warnings: {len(warnings)}; broken pipes: {broken}')
          PYDIAG
          {
            echo 'Diagnostics files:'
            find "$DIAG" -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
            echo
            echo 'Includes toolchain info, source commit/diffs, KernelSU source/version/hook-manager inspection, config, KSU preflight compile, kernel compile, grouped primary errors, warnings, and full logs.'
          } > "$DIAG/README.txt"

      - name: Upload build diagnostics (always, including failures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: A13X-Darknight-Build-Diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
