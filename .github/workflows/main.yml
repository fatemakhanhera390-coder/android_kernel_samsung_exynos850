name: Build SM-A135F Darknight 4.19.325 KernelSU-Next + SUSFS (OriginStyle AK3)

on:
  workflow_dispatch:
    inputs:
      ksu_manager_package:
        description: "KernelSU-Next Manager package name"
        required: true
        default: "com.rifsxd.ksunext"
      ksu_manager_size:
        description: "KernelSU-Next Manager v2 signature block size (hex)"
        required: true
        default: "0x3e6"
      ksu_manager_hash:
        description: "KernelSU-Next Manager v2 certificate SHA-256"
        required: true
        default: "0cbd8ba08218d2f5a7fbe2820534f670f9c396199620845557185460d06b2d76"
  push:
    branches:
      - lineage-24.0

env:
  KERNEL_REPO: "https://github.com/Samsung-Galaxy-A13-A135F-Development/android_kernel_samsung_exynos850.git"
  KERNEL_BRANCH: "lineage-24.0"
  DEFCONFIG: "exynos850-a13nsxx_defconfig"
  EXPECTED_KERNEL_VERSION: "4.19.325"
  EXPECTED_KERNEL_RELEASE: "4.19.325-Darknight"
  NEUTRON_TAG: "06092026"
  KSUNEXT_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KSUNEXT_COMMIT: "8f902aeb16033024143ae36cf711df902cf02fae"
  KSUNEXT_TAG: "v3.4.1"
  KSUNEXT_VERSION: "33333"
  BRENE_REPO: "https://github.com/rrr333nnn333/BRENE.git"
  BRENE_COMMIT_PREFIX: "d721c6a"
  SUSFS4KSU_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS4KSU_MIRROR: "https://github.com/Star-Seven/susfs4ksu.git"
  SUSFS4KSU_BRANCH: "kernel-4.19"
  SUSFS4KSU_COMMIT_PREFIX: "001e6991"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"

jobs:
  build-sm-a135f-ksunext-susfs:
    name: Build Darknight 4.19.325 (KSU-Next 33333 + SUSFS)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Maximize runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl \
            device-tree-compiler dwarves file flex git jq kmod libelf-dev \
            libncurses-dev libssl-dev lz4 openssl pahole python3 python3-pip \
            python3-yaml rsync shellcheck unzip wget xz-utils zip zstd

      - name: Checkout repository and preserve existing workflow backup
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: A. Inventory repository, preserve original workflow, and ensure kernel tree
        run: |
          set -euo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          mkdir -p "${DIAG_DIR}/workflow-backup" "${DIAG_DIR}/patches"

          if [ -f "${GITHUB_WORKSPACE}/.github/workflows/main.yml" ]; then
            cp -f "${GITHUB_WORKSPACE}/.github/workflows/main.yml" \
              "${DIAG_DIR}/workflow-backup/main.yml.backup"
          fi

          git status --short --branch > "${DIAG_DIR}/git-status-initial.txt" || true
          git log -n 5 --oneline > "${DIAG_DIR}/git-log-initial.txt" || true

          if [ ! -f "${GITHUB_WORKSPACE}/Makefile" ] || [ ! -f "${GITHUB_WORKSPACE}/arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "Checked-out repo does not contain kernel root; cloning ${KERNEL_REPO} (${KERNEL_BRANCH})..."
            rm -rf "${GITHUB_WORKSPACE}/kernel_src"
            git clone --depth=50 -b "${KERNEL_BRANCH}" "${KERNEL_REPO}" "${GITHUB_WORKSPACE}/kernel_src"
            rsync -a --exclude='.git' --exclude='diagnostics' --exclude='.github' \
              "${GITHUB_WORKSPACE}/kernel_src/" "${GITHUB_WORKSPACE}/"
            git -C "${GITHUB_WORKSPACE}/kernel_src" rev-parse HEAD > "${DIAG_DIR}/kernel-source-commit.txt"
            rm -rf "${GITHUB_WORKSPACE}/kernel_src"
          else
            git rev-parse HEAD > "${DIAG_DIR}/kernel-source-commit.txt"
          fi

          find "${GITHUB_WORKSPACE}" -maxdepth 2 -not -path '*/.*' | sort > "${DIAG_DIR}/repo-inventory.txt"

      - name: B. Verify kernel source version, defconfig, and setup Neutron Clang
        run: |
          set -euo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          test -f "arch/arm64/configs/${DEFCONFIG}"
          KVER="$(make -s kernelversion)"
          echo "Detected make kernelversion: ${KVER}"
          if [ "${KVER}" != "${EXPECTED_KERNEL_VERSION}" ]; then
            echo "ERROR: Expected kernelversion ${EXPECTED_KERNEL_VERSION}, got ${KVER}" >&2
            exit 1
          fi

          CLANG_DIR="${RUNNER_TEMP}/neutron-clang"
          mkdir -p "${CLANG_DIR}"
          cd "${CLANG_DIR}"
          curl -fL --retry 5 --retry-delay 5 \
            "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${NEUTRON_TAG}/neutron-clang-${NEUTRON_TAG}.tar.zst" \
            -o neutron-clang.tar.zst
          zstd -d -q neutron-clang.tar.zst -o neutron-clang.tar
          tar -xf neutron-clang.tar
          rm -f neutron-clang.tar neutron-clang.tar.zst

          "${CLANG_DIR}/bin/clang" --version | tee "${DIAG_DIR}/compiler-version.txt"
          echo "${CLANG_DIR}/bin" >> "${GITHUB_PATH}"
          echo "CLANG_DIR=${CLANG_DIR}" >> "${GITHUB_ENV}"

      - name: C & E. Fetch and audit pinned KernelSU-Next (8f902aeb) and SUSFS repositories
        run: |
          set -euo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          # 1. Clone and pin KernelSU-Next
          rm -rf KernelSU-Next drivers/kernelsu
          git clone "${KSUNEXT_REPO}" KernelSU-Next
          cd KernelSU-Next
          git fetch --all --tags --prune
          git checkout --detach "${KSUNEXT_COMMIT}"
          ACTUAL_KSU_SHA="$(git rev-parse HEAD)"
          if [ "${ACTUAL_KSU_SHA}" != "${KSUNEXT_COMMIT}" ]; then
            echo "ERROR: KernelSU-Next commit mismatch: ${ACTUAL_KSU_SHA} != ${KSUNEXT_COMMIT}" >&2
            exit 1
          fi
          KSU_REV_COUNT="$(git rev-list --count HEAD)"
          KSU_CALC_VER="$((10000 + KSU_REV_COUNT + 20000))"
          echo "KernelSU-Next SHA: ${ACTUAL_KSU_SHA}" | tee "${DIAG_DIR}/ksunext-source-audit.txt"
          echo "KernelSU-Next rev-count: ${KSU_REV_COUNT} -> version ${KSU_CALC_VER}" | tee -a "${DIAG_DIR}/ksunext-source-audit.txt"
          find kernel -maxdepth 3 -type f | sort >> "${DIAG_DIR}/ksunext-source-audit.txt"

          # Verify real files exist in pinned commit 8f902aeb16033024143ae36cf711df902cf02fae
          for req_file in \
            kernel/Kconfig \
            kernel/Makefile \
            kernel/Ksu.c \
            kernel/supercall/supercall.c \
            kernel/supercall/dispatch.c \
            kernel/hook/setuid_hook.c \
            kernel/hook/syscall_hook_manager.c \
            kernel/hook/arm64/patch_memory.c \
            kernel/hook/arm64/syscall_hook.c \
            kernel/runtime/ksud_integration.c \
            kernel/runtime/ksud_boot.c \
            kernel/feature/sucompat.c \
            kernel/feature/kernel_umount.c \
            kernel/policy/apk_sign.c \
            kernel/selinux/rules.c; do
            if [ ! -f "${req_file}" ]; then
              echo "ERROR: Missing expected file ${req_file} in KernelSU-Next ${KSUNEXT_COMMIT}" >&2
              exit 1
            fi
          done
          cd "${GITHUB_WORKSPACE}"

          # 2. Clone and audit user-supplied rrr333nnn333/BRENE repository
          rm -rf "${RUNNER_TEMP}/brene-src"
          git clone "${BRENE_REPO}" "${RUNNER_TEMP}/brene-src"
          cd "${RUNNER_TEMP}/brene-src"
          if git rev-parse --verify "${BRENE_COMMIT_PREFIX}^{commit}" >/dev/null 2>&1; then
            git checkout --detach "${BRENE_COMMIT_PREFIX}"
          fi
          BRENE_SHA="$(git rev-parse HEAD)"
          {
            echo "=== User-Supplied Repository Audit: ${BRENE_REPO} ==="
            echo "Pinned Commit SHA: ${BRENE_SHA}"
            echo "Branches:"
            git branch -a
            echo "Recent Commits:"
            git log -n 5 --oneline
            echo "Tracked Files:"
            git ls-files
            echo "C/Header/Patch file count:"
            git ls-files | grep -E '\.(c|h|patch|diff)$' | wc -l || true
            echo "Conclusion: rrr333nnn333/BRENE is a userspace KernelSU module (AGPL-3.0) that wraps ksu_susfs and requires kernel-side susfs4ksu patches."
          } > "${DIAG_DIR}/susfs-brene-audit.txt"
          echo "BRENE_SHA=${BRENE_SHA}" >> "${GITHUB_ENV}"
          cd "${GITHUB_WORKSPACE}"

          # 3. Clone and pin kernel-side simonpunk/susfs4ksu (branch kernel-4.19)
          rm -rf "${RUNNER_TEMP}/susfs4ksu-src"
          if ! git clone -b "${SUSFS4KSU_BRANCH}" "${SUSFS4KSU_REPO}" "${RUNNER_TEMP}/susfs4ksu-src"; then
            echo "Primary GitLab clone failed; falling back to GitHub mirror ${SUSFS4KSU_MIRROR}..."
            git clone -b "${SUSFS4KSU_BRANCH}" "${SUSFS4KSU_MIRROR}" "${RUNNER_TEMP}/susfs4ksu-src"
          fi
          cd "${RUNNER_TEMP}/susfs4ksu-src"
          git checkout --detach "${SUSFS4KSU_COMMIT_PREFIX}"
          SUSFS4KSU_SHA="$(git rev-parse HEAD)"
          {
            echo "=== Kernel-Side SUSFS Repository Audit: simonpunk/susfs4ksu (${SUSFS4KSU_BRANCH}) ==="
            echo "Pinned Commit SHA: ${SUSFS4KSU_SHA}"
            git log -n 5 --oneline
            echo "Kernel Patch Files:"
            find kernel_patches -type f | sort
          } > "${DIAG_DIR}/susfs4ksu-audit.txt"
          echo "SUSFS4KSU_SHA=${SUSFS4KSU_SHA}" >> "${GITHUB_ENV}"
          cd "${GITHUB_WORKSPACE}"

      - name: D & E. Integrate KernelSU-Next legacy hooks, Exynos 850 PMD fix, and SUSFS patches
        env:
          INPUT_MGR_PKG: ${{ github.event.inputs.ksu_manager_package || 'com.rifsxd.ksunext' }}
          INPUT_MGR_SIZE: ${{ github.event.inputs.ksu_manager_size || '0x3e6' }}
          INPUT_MGR_HASH: ${{ github.event.inputs.ksu_manager_hash || '0cbd8ba08218d2f5a7fbe2820534f670f9c396199620845557185460d06b2d76' }}
        run: |
          set -euo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          ln -sfn "${GITHUB_WORKSPACE}/KernelSU-Next/kernel" "${GITHUB_WORKSPACE}/drivers/kernelsu"

          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            python3 - << 'PYEOF'
          from pathlib import Path
          p = Path("drivers/Kconfig")
          txt = p.read_text(encoding="utf-8")
          idx = txt.rfind("endmenu")
          assert idx != -1, "endmenu not found in drivers/Kconfig"
          txt = txt[:idx] + 'source "drivers/kernelsu/Kconfig"\n' + txt[idx:]
          p.write_text(txt, encoding="utf-8")
          PYEOF
          fi

          if ! grep -q "CONFIG_KSU" drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi

          cat << 'PYEOF' > "${RUNNER_TEMP}/integrate_ksunext_and_susfs.py"
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          ws = Path(os.environ["GITHUB_WORKSPACE"])
          diag = Path(os.environ["DIAG_DIR"])
          susfs_src = Path(os.environ["RUNNER_TEMP"]) / "susfs4ksu-src" / "kernel_patches"
          ksu_dir = ws / "KernelSU-Next" / "kernel"

          mgr_pkg = os.environ.get("INPUT_MGR_PKG", "com.rifsxd.ksunext").strip()
          mgr_size = os.environ.get("INPUT_MGR_SIZE", "0x3e6").strip()
          mgr_hash = os.environ.get("INPUT_MGR_HASH", "0cbd8ba08218d2f5a7fbe2820534f670f9c396199620845557185460d06b2d76").strip()
          ksu_ver = os.environ.get("KSUNEXT_VERSION", "33333").strip()
          ksu_tag = os.environ.get("KSUNEXT_TAG", "v3.4.1").strip()

          report_lines = []
          def log(msg):
              print(msg)
              report_lines.append(msg)

          # -------------------------------------------------------------------------
          # 1. Copy SUSFS kernel source and header files into kernel tree
          # -------------------------------------------------------------------------
          for src_file in (susfs_src / "fs").glob("*"):
              if src_file.is_file():
                  dst = ws / "fs" / src_file.name
                  shutil.copy2(src_file, dst)
                  log(f"[SUSFS] Copied {src_file.name} -> fs/{src_file.name}")

          for src_file in (susfs_src / "include" / "linux").glob("*"):
              if src_file.is_file():
                  dst = ws / "include" / "linux" / src_file.name
                  shutil.copy2(src_file, dst)
                  log(f"[SUSFS] Copied {src_file.name} -> include/linux/{src_file.name}")

          # Ensure include/linux/susfs_def.h exists (some susfs4ksu commits inline defs in susfs.h)
          susfs_h = ws / "include" / "linux" / "susfs.h"
          susfs_def_h = ws / "include" / "linux" / "susfs_def.h"
          if susfs_h.exists() and not susfs_def_h.exists():
              susfs_def_h.write_text(
                  "#ifndef _LINUX_SUSFS_DEF_H\n#define _LINUX_SUSFS_DEF_H\n"
                  "#include <linux/susfs.h>\n#endif\n",
                  encoding="utf-8",
              )
              log("[SUSFS] Created compatibility shim include/linux/susfs_def.h")

          # Try applying 50_add_susfs_in_kernel-4.19.patch hunk-by-hunk where clean,
          # then apply deterministic AST/source integrations for any rejected hunks.
          patch_50 = next(susfs_src.glob("50_add_susfs_in_kernel*.patch"), None)
          if patch_50 and patch_50.exists():
              res = subprocess.run(
                  ["patch", "-p1", "--forward", "--batch", "--reject-file=-", "-i", str(patch_50)],
                  cwd=str(ws),
                  capture_output=True,
                  text=True,
              )
              log(f"[SUSFS] Applied {patch_50.name} (rc={res.returncode})")
              (diag / "susfs-kernel-patch-apply.log").write_text(
                  res.stdout + "\n" + res.stderr, encoding="utf-8"
              )

          # Ensure fs/Makefile builds susfs.o when CONFIG_KSU_SUSFS=y
          fs_mk = ws / "fs" / "Makefile"
          fs_mk_txt = fs_mk.read_text(encoding="utf-8")
          if "susfs.o" not in fs_mk_txt:
              fs_mk_txt += "\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n"
              fs_mk.write_text(fs_mk_txt, encoding="utf-8")
              log("[SUSFS] Added obj-$(CONFIG_KSU_SUSFS) += susfs.o to fs/Makefile")

          # Ensure struct mount / vfsmount / inode / task_struct / cred / super_block have
          # any android_kabi_reserved fields required by fs/susfs.c on Linux 4.19.325
          susfs_c = ws / "fs" / "susfs.c"
          if susfs_c.exists():
              sc_txt = susfs_c.read_text(encoding="utf-8")
              # Check if susfs.c uses susfs_spoof_uname in kernel/sys.c
              sys_c = ws / "kernel" / "sys.c"
              sys_txt = sys_c.read_text(encoding="utf-8")
              if "susfs_spoof_uname" in sc_txt and "susfs_spoof_uname" not in sys_txt:
                  if "#include <linux/susfs.h>" not in sys_txt:
                      sys_txt = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n" + sys_txt
                  target_pat = "memcpy(&tmp, &utsname()->sysname, sizeof(tmp));"
                  if target_pat in sys_txt:
                      sys_txt = sys_txt.replace(
                          target_pat,
                          target_pat + "\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif",
                          1,
                      )
                      sys_c.write_text(sys_txt, encoding="utf-8")
                      log("[SUSFS] Wired susfs_spoof_uname(&tmp) in kernel/sys.c SYSCALL_DEFINE1(newuname)")

          # -------------------------------------------------------------------------
          # 2. Fix #1: KernelSU-Next/kernel/hook/arm64/patch_memory.c
          #    Support 1GB PUD ((pud & 3) == 1) and 2MB PMD ((pmd & 3) == 1) block
          #    mappings on Exynos 850 Linux 4.19 + use memcpy over fixmap.
          # -------------------------------------------------------------------------
          pm_c = ksu_dir / "hook" / "arm64" / "patch_memory.c"
          pm_txt = pm_c.read_text(encoding="utf-8")
          new_pm_txt = '''// SPDX-License-Identifier: GPL-2.0-only
          /*
           * Fixed arm64 page-table walker and fixmap text/data patcher for
           * non-GKI Linux 4.19 (Samsung Exynos 850 SM-A135F), supporting
           * 1GB PUD and 2MB PMD section/block descriptors.
           */
          #include <linux/mm.h>
          #include <linux/pgtable.h>
          #include <asm/fixmap.h>
          #include <asm/cacheflush.h>
          #include <linux/stop_machine.h>
          #include <linux/atomic.h>
          #include <linux/cpumask.h>
          #include <linux/string.h>
          #include <linux/kernel.h>
          #include "hook/patch_memory.h"
          #include "klog.h"

          #ifndef PTE_ADDR_LOW
          #define PTE_ADDR_LOW (((1UL << (48 - PAGE_SHIFT)) - 1) << PAGE_SHIFT)
          #endif

          unsigned long phys_from_virt(unsigned long addr, int *err)
          {
              struct mm_struct *mm = &init_mm;
              pgd_t *pgd;
              p4d_t *p4d;
              pud_t *pud;
              pmd_t *pmd;
              pte_t *pte;

              *err = 0;
              pgd = pgd_offset(mm, addr);
              if (pgd_none(*pgd) || pgd_bad(*pgd))
                  goto fail;

              p4d = p4d_offset(pgd, addr);
              if (p4d_none(*p4d) || p4d_bad(*p4d))
                  goto fail;

              pud = pud_offset(p4d, addr);
              if (pud_none(*pud))
                  goto fail;
              if ((pud_val(*pud) & 3UL) == 1UL) {
                  pr_info("Address 0x%lx maps to a PUD-level huge page\\n", addr);
                  return (pud_val(*pud) & PTE_ADDR_LOW) + (addr & (PUD_SIZE - 1));
              }
              if (pud_bad(*pud))
                  goto fail;

              pmd = pmd_offset(pud, addr);
              if (pmd_none(*pmd))
                  goto fail;
              if ((pmd_val(*pmd) & 3UL) == 1UL) {
                  pr_info("Address 0x%lx maps to a PMD-level huge page\\n", addr);
                  return (pmd_val(*pmd) & PTE_ADDR_LOW) + (addr & (PMD_SIZE - 1));
              }
              if (pmd_bad(*pmd))
                  goto fail;

              pte = pte_offset_kernel(pmd, addr);
              if (!pte || !pte_present(*pte))
                  goto fail;

              return (pte_val(*pte) & PTE_ADDR_LOW) + (addr & (PAGE_SIZE - 1));

          fail:
              pr_err("failed to get physical address of %lx\\n", addr);
              *err = -ENOENT;
              return 0;
          }

          struct ksu_patch_text_info {
              void *dst;
              const void *src;
              size_t len;
              atomic_t cpu_count;
              int flags;
          };

          static int ksu_patch_text_cb(void *arg)
          {
              struct ksu_patch_text_info *info = arg;
              void *dst = info->dst;
              const void *src = info->src;
              size_t len = info->len;
              int flags = info->flags;
              int ret = 0;

              if (atomic_inc_return(&info->cpu_count) == num_online_cpus()) {
                  int err = 0;
                  unsigned long phy = phys_from_virt((unsigned long)dst, &err);
                  if (err) {
                      ret = err;
                  } else {
                      void *map = (void *)set_fixmap_offset(FIX_TEXT_POKE0, phy);
                      memcpy(map, src, len);
                      clear_fixmap(FIX_TEXT_POKE0);

                      if (flags & KSU_PATCH_TEXT_FLUSH_ICACHE)
                          flush_icache_range((unsigned long)dst, (unsigned long)dst + len);
                      if (flags & KSU_PATCH_TEXT_FLUSH_DCACHE)
                          __flush_dcache_area(dst, len);
                  }
                  atomic_inc(&info->cpu_count);
              } else {
                  while (atomic_read(&info->cpu_count) <= num_online_cpus())
                      cpu_relax();
                  isb();
              }

              return ret;
          }

          int ksu_patch_text(void *dst, const void *src, size_t len, int flags)
          {
              struct ksu_patch_text_info info = {
                  .dst = dst,
                  .src = src,
                  .len = len,
                  .cpu_count = ATOMIC_INIT(0),
                  .flags = flags,
              };
              return stop_machine(ksu_patch_text_cb, &info, cpu_online_mask);
          }
          '''
          # Preserve scan_call_to if present in original patch_memory.c
          if "scan_call_to" in pm_txt:
              idx = pm_txt.find("uint32_t *scan_call_to")
              if idx == -1:
                  idx = pm_txt.find("u32 *scan_call_to")
              if idx == -1:
                  idx = pm_txt.find("void *scan_call_to")
              if idx != -1:
                  new_pm_txt += "\n" + pm_txt[idx:]
          pm_c.write_text(new_pm_txt, encoding="utf-8")
          log("[KSU-Next Fix #1] Updated kernel/hook/arm64/patch_memory.c with PUD/PMD huge-page support and fixmap memcpy")

          # -------------------------------------------------------------------------
          # 3. Fix #2 & #3: Extend ksu_handle_execveat_ksud for /init & --second-stage
          #    and add direct non-Kprobe entry points
          # -------------------------------------------------------------------------
          ksud_int_c = ksu_dir / "runtime" / "ksud_integration.c"
          ksud_txt = ksud_int_c.read_text(encoding="utf-8")
          # Allow both /system/bin/init and /init, and both second_stage and --second-stage
          if 'strcmp(path, "/system/bin/init") == 0' in ksud_txt:
              ksud_txt = ksud_txt.replace(
                  'strcmp(path, "/system/bin/init") == 0',
                  '(strcmp(path, "/system/bin/init") == 0 || strcmp(path, "/init") == 0)',
              )
          elif 'memcmp(path, "/system/bin/init", ' in ksud_txt:
              ksud_txt = ksud_txt.replace(
                  'memcmp(path, "/system/bin/init", sizeof("/system/bin/init")) == 0',
                  '(strcmp(path, "/system/bin/init") == 0 || strcmp(path, "/init") == 0)',
              )
          if 'check_argv(*argv, 1, "second_stage", arg, sizeof(arg))' in ksud_txt:
              ksud_txt = ksud_txt.replace(
                  'check_argv(*argv, 1, "second_stage", arg, sizeof(arg))',
                  '(check_argv(*argv, 1, "second_stage", arg, sizeof(arg)) || check_argv(*argv, 1, "--second-stage", arg, sizeof(arg)))',
              )
          # Add a direct kernel-space wrapper ksu_handle_execveat_ksud_direct(struct filename *filename, void *argv_ptr)
          ksud_direct_helper = '''
          int ksu_handle_execveat_ksud_direct(const char *kpath, void *argv_ptr)
          {
              if (!kpath || !argv_ptr)
                  return 0;
              return ksu_handle_execveat_ksud(kpath, (struct user_arg_ptr *)argv_ptr);
          }
          '''
          if "ksu_handle_execveat_ksud_direct" not in ksud_txt:
              ksud_txt += "\n" + ksud_direct_helper
          ksud_int_c.write_text(ksud_txt, encoding="utf-8")
          log("[KSU-Next Fix #3] Extended ksu_handle_execveat_ksud for /init and --second-stage")

          # -------------------------------------------------------------------------
          # 4. Fix #4: Call track_throne(false) inside on_post_fs_data() in ksud_boot.c
          # -------------------------------------------------------------------------
          ksud_boot_c = ksu_dir / "runtime" / "ksud_boot.c"
          kb_txt = ksud_boot_c.read_text(encoding="utf-8")
          if "ksu_observer_init();" in kb_txt and "track_throne(false);" not in kb_txt:
              kb_txt = kb_txt.replace(
                  "ksu_observer_init();",
                  "ksu_observer_init();\n\tpr_info(\"on_post_fs_data: running initial track_throne scan\\n\");\n\ttrack_throne(false);",
                  1,
              )
              ksud_boot_c.write_text(kb_txt, encoding="utf-8")
              log("[KSU-Next Fix #4] Added immediate track_throne(false) scan to on_post_fs_data()")

          # -------------------------------------------------------------------------
          # 5. Fix #5: Fix ksu_handle_setresuid in setuid_hook.c on Linux 4.19
          #    (where ksu_seccomp_allow_cache is a no-op) and avoid double-install
          # -------------------------------------------------------------------------
          setuid_c = ksu_dir / "hook" / "setuid_hook.c"
          su_txt = setuid_c.read_text(encoding="utf-8")
          if "ksu_seccomp_allow_cache" in su_txt:
              su_txt = su_txt.replace(
                  "ksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);",
                  "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 11, 0)\n"
                  "\t\t\tksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);\n"
                  "#endif",
              )
              # On Linux < 5.11, call ksu_disable_seccomp_for_manager() before the spinlock block
              su_txt = su_txt.replace(
                  "if (current->seccomp.mode == SECCOMP_MODE_FILTER &&\n\t\t    current->seccomp.filter) {",
                  "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 11, 0)\n"
                  "\t\tksu_disable_seccomp_for_manager();\n"
                  "#else\n"
                  "\t\tif (current->seccomp.mode == SECCOMP_MODE_FILTER &&\n\t\t    current->seccomp.filter) {",
              )
              # Close the #endif after spin_unlock_irq
              su_txt = re.sub(
                  r"(spin_unlock_irq\(&current->sighand->siglock\);\s*\})",
                  r"\1\n#endif",
                  su_txt,
                  count=1,
              )
          # Add CONFIG_KSU_SUSFS try_umount integration if enabled
          setuid_c.write_text(su_txt, encoding="utf-8")
          log("[KSU-Next Fix #5] Updated setuid_hook.c for Linux 4.19 seccomp compatibility")

          # In syscall_hook_manager.c:
          # - Call ksu_mark_running_process() directly after tracepoint_probe_register_prio
          # - Do not register ksu_hook_setresuid in ksu_syscall_table because __sys_setresuid
          #   in kernel/sys.c calls ksu_handle_setresuid directly once per setresuid!
          shm_c = ksu_dir / "hook" / "syscall_hook_manager.c"
          shm_txt = shm_c.read_text(encoding="utf-8")
          shm_txt = shm_txt.replace(
              "ksu_register_syscall_hook(__NR_setresuid, ksu_hook_setresuid);",
              "/* Handled directly in kernel/sys.c __sys_setresuid to guarantee single execution */",
          )
          if "tracepoint_probe_register_prio" in shm_txt and "ksu_mark_running_process();" not in shm_txt:
              shm_txt = shm_txt.replace(
                  "ksu_setuid_hook_init();",
                  "ksu_mark_running_process();\n\tksu_setuid_hook_init();",
                  1,
              )
          shm_c.write_text(shm_txt, encoding="utf-8")
          log("[KSU-Next Fix #2a] Updated syscall_hook_manager.c with direct ksu_mark_running_process() and single setresuid hook")

          # -------------------------------------------------------------------------
          # 6. Export ksu_handle_sys_reboot & SUSFS supercall bridge in supercall.c
          #    and wire sucompat fallback helpers in sucompat.c
          # -------------------------------------------------------------------------
          sc_c = ksu_dir / "supercall" / "supercall.c"
          sc_c_txt = sc_c.read_text(encoding="utf-8")
          reboot_bridge = '''
          #ifdef CONFIG_KSU_SUSFS
          #include <linux/susfs.h>
          #endif

          int ksu_handle_susfs_command(int magic1, int magic2, unsigned int cmd, void __user *arg, void __user *err_out)
          {
          #ifdef CONFIG_KSU_SUSFS
              int error = 0;
              if ((unsigned int)magic1 != 0xdeadbeefU)
                  return -EINVAL;
              if (current_uid().val != 0)
                  return -EPERM;
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
              if (cmd == CMD_SUSFS_ADD_SUS_PATH) {
                  error = susfs_add_sus_path((struct st_susfs_sus_path __user *)arg);
                  goto out_copy;
              }
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
              if (cmd == CMD_SUSFS_ADD_SUS_MOUNT) {
                  error = susfs_add_sus_mount((struct st_susfs_sus_mount __user *)arg);
                  goto out_copy;
              }
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
              if (cmd == CMD_SUSFS_ADD_SUS_KSTAT) {
                  error = susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)arg);
                  goto out_copy;
              }
              if (cmd == CMD_SUSFS_UPDATE_SUS_KSTAT) {
                  error = susfs_update_sus_kstat((struct st_susfs_sus_kstat __user *)arg);
                  goto out_copy;
              }
              if (cmd == CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY) {
                  error = susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)arg);
                  goto out_copy;
              }
          #endif
          #ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT
              if (cmd == CMD_SUSFS_ADD_TRY_UMOUNT) {
                  error = susfs_add_try_umount((struct st_susfs_try_umount __user *)arg);
                  goto out_copy;
              }
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
              if (cmd == CMD_SUSFS_SET_UNAME) {
                  error = susfs_set_uname((struct st_susfs_uname __user *)arg);
                  goto out_copy;
              }
          #endif
          #ifdef CONFIG_KSU_SUSFS_ENABLE_LOG
              if (cmd == CMD_SUSFS_ENABLE_LOG) {
                  error = susfs_set_log((unsigned int)(unsigned long)arg);
                  goto out_copy;
              }
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
              if (cmd == CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG) {
                  error = susfs_set_cmdline_or_bootconfig((char __user *)arg);
                  goto out_copy;
              }
          #endif
          #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT
              if (cmd == CMD_SUSFS_ADD_OPEN_REDIRECT) {
                  error = susfs_add_open_redirect((struct st_susfs_open_redirect __user *)arg);
                  goto out_copy;
              }
          #endif
          #ifdef CMD_SUSFS_SHOW_VERSION
              if (cmd == CMD_SUSFS_SHOW_VERSION) {
                  error = susfs_show_version((char __user *)arg);
                  goto out_copy;
              }
          #endif
          #ifdef CMD_SUSFS_SHOW_ENABLED_FEATURES
              if (cmd == CMD_SUSFS_SHOW_ENABLED_FEATURES) {
                  error = susfs_show_enabled_features((char __user *)arg, 4096);
                  goto out_copy;
              }
          #endif
          #ifdef CMD_SUSFS_SHOW_VARIANT
              if (cmd == CMD_SUSFS_SHOW_VARIANT) {
                  error = susfs_show_variant((char __user *)arg);
                  goto out_copy;
              }
          #endif
              return -EINVAL;
          out_copy:
              if (err_out) {
                  if (copy_to_user(err_out, &error, sizeof(error)))
                      return -EFAULT;
              }
              return 0;
          #else
              return -ENOSYS;
          #endif
          }

          int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg)
          {
              struct pt_regs real_regs;
              struct pt_regs outer_regs;

              if ((unsigned int)magic1 != KSU_INSTALL_MAGIC1)
                  return 0;

              if (cmd >= 0x55550U && cmd <= 0x60000U) {
                  ksu_handle_susfs_command(magic1, magic2, cmd, arg ? *arg : NULL, NULL);
                  return 0;
              }

              memset(&real_regs, 0, sizeof(real_regs));
              memset(&outer_regs, 0, sizeof(outer_regs));
              real_regs.regs[0] = (unsigned long)(unsigned int)magic1;
              real_regs.regs[1] = (unsigned long)(unsigned int)magic2;
              real_regs.regs[2] = (unsigned long)cmd;
              real_regs.regs[3] = arg ? (unsigned long)(*arg) : 0UL;
              PT_REGS_PARM1(&outer_regs) = (unsigned long)&real_regs;

              return reboot_handler_pre(NULL, &outer_regs);
          }
          '''
          if "ksu_handle_sys_reboot" not in sc_c_txt:
              sc_c_txt += "\n" + reboot_bridge
              sc_c.write_text(sc_c_txt, encoding="utf-8")
              log("[KSU-Next Fix #2b] Added ksu_handle_sys_reboot and ksu_handle_susfs_command in supercall.c")

          # Add direct non-tracepoint fallback wrappers in sucompat.c
          sucompat_c = ksu_dir / "feature" / "sucompat.c"
          suc_txt = sucompat_c.read_text(encoding="utf-8")
          sucompat_direct = '''
          int ksu_handle_faccessat_direct(int *dfd, const char __user **filename_user, int *mode, int *flags)
          {
              char path[sizeof(su_path) + 1];
              if (!ksu_su_compat_enabled)
                  return 0;
              if (test_ti_thread_flag(current_thread_info(), TIF_SYSCALL_TRACEPOINT))
                  return 0;
              if (!__ksu_is_allow_uid_for_current(current_uid().val))
                  return 0;
              if (!filename_user || !*filename_user)
                  return 0;
              memset(path, 0, sizeof(path));
              if (ksu_strncpy_from_user_nofault(path, *filename_user, sizeof(path)) < 0)
                  return 0;
              if (unlikely(!memcmp(path, su_path, sizeof(su_path)))) {
                  pr_info("faccessat su->sh!\\n");
                  *filename_user = sh_user_path();
              }
              return 0;
          }

          int ksu_handle_stat_direct(int *dfd, const char __user **filename_user, int *flags)
          {
              char path[sizeof(su_path) + 1];
              if (!ksu_su_compat_enabled)
                  return 0;
              if (test_ti_thread_flag(current_thread_info(), TIF_SYSCALL_TRACEPOINT))
                  return 0;
              if (!__ksu_is_allow_uid_for_current(current_uid().val))
                  return 0;
              if (!filename_user || !*filename_user)
                  return 0;
              memset(path, 0, sizeof(path));
              if (ksu_strncpy_from_user_nofault(path, *filename_user, sizeof(path)) < 0)
                  return 0;
              if (unlikely(!memcmp(path, su_path, sizeof(su_path)))) {
                  pr_info("newfstatat su->sh!\\n");
                  *filename_user = sh_user_path();
              }
              return 0;
          }

          int ksu_handle_execve_sucompat_direct(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags)
          {
              struct filename *filename;
              if (!ksu_su_compat_enabled)
                  return 0;
              if (test_ti_thread_flag(current_thread_info(), TIF_SYSCALL_TRACEPOINT))
                  return 0;
              if (!filename_ptr || !*filename_ptr || IS_ERR(*filename_ptr))
                  return 0;
              filename = *filename_ptr;
              if (!filename->name || likely(memcmp(filename->name, su_path, sizeof(su_path))))
                  return 0;
              if (!__ksu_is_allow_uid_for_current(current_uid().val))
                  return 0;
              pr_info("do_execveat_common su found (direct)\\n");
              memcpy((void *)filename->name, ksud_path, sizeof(ksud_path));
              escape_with_root_profile();
              return 0;
          }
          '''
          if "ksu_handle_faccessat_direct" not in suc_txt:
              suc_txt += "\n" + sucompat_direct
              sucompat_c.write_text(suc_txt, encoding="utf-8")
              log("[KSU-Next Fix #2c] Added tracepoint-guarded direct sucompat helpers to sucompat.c")

          # -------------------------------------------------------------------------
          # 7. Wire SUSFS Kconfig, Makefile, and kernelsu_init() in KernelSU-Next
          # -------------------------------------------------------------------------
          kconfig_p = ksu_dir / "Kconfig"
          kc_txt = kconfig_p.read_text(encoding="utf-8")
          susfs_kconfig_block = '''
          menu "KernelSU - SUSFS"
          config KSU_SUSFS
              bool "KernelSU addon - SUSFS"
              depends on KSU
              default y
              help
                An addon root hiding service for KernelSU on Linux 4.19.

          config KSU_SUSFS_HAS_MAGIC_MOUNT
              bool "Say yes if the current KernelSU repo has magic mount implemented"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_PATH
              bool "Enable to hide suspicious path"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_MOUNT
              bool "Enable to hide suspicious mounts"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
              bool "Enable to hide KSU's default mounts automatically"
              depends on KSU_SUSFS_SUS_MOUNT
              default y

          config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
              bool "Enable to hide suspicious bind mounts automatically"
              depends on KSU_SUSFS_SUS_MOUNT
              default y

          config KSU_SUSFS_SUS_KSTAT
              bool "Enable to spoof suspicious kstat"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_OVERLAYFS
              bool "Enable to automatically spoof kstat and kstatfs for overlayed files/folders"
              depends on KSU_SUSFS_SUS_KSTAT
              default n

          config KSU_SUSFS_TRY_UMOUNT
              bool "Enable to use ksu's try_umount"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
              bool "Enable to add bind mounts to ksu's try_umount automatically"
              depends on KSU_SUSFS_TRY_UMOUNT
              default y

          config KSU_SUSFS_SPOOF_UNAME
              bool "Enable to spoof uname"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_ENABLE_LOG
              bool "Enable logging susfs log to kernel"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
              bool "Enable to automatically hide ksu and susfs symbols from /proc/kallsyms"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
              bool "Enable to spoof /proc/bootconfig or /proc/cmdline"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_OPEN_REDIRECT
              bool "Enable to redirect a path to be opened with another path"
              depends on KSU_SUSFS
              default y

          config KSU_SUSFS_SUS_SU
              bool "Enable SUS-SU in runtime temporarily"
              depends on KSU_SUSFS && KPROBES && HAVE_KPROBES && KPROBE_EVENTS
              default n
          endmenu
          '''
          if "config KSU_SUSFS" not in kc_txt:
              idx = kc_txt.rfind("endmenu")
              if idx != -1:
                  kc_txt = kc_txt[:idx] + susfs_kconfig_block + "\n" + kc_txt[idx:]
              else:
                  kc_txt += "\n" + susfs_kconfig_block
              kconfig_p.write_text(kc_txt, encoding="utf-8")
              log("[SUSFS] Added CONFIG_KSU_SUSFS* menu to KernelSU-Next/kernel/Kconfig")

          ksu_c = ksu_dir / "Ksu.c"
          ksu_c_txt = ksu_c.read_text(encoding="utf-8")
          if "susfs_init" not in ksu_c_txt:
              ksu_c_txt = (
                  "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n" + ksu_c_txt
              )
              ksu_c_txt = ksu_c_txt.replace(
                  "ksu_supercalls_init();",
                  "ksu_supercalls_init();\n#ifdef CONFIG_KSU_SUSFS\n\tsusfs_init();\n#endif",
                  1,
              )
              ksu_c.write_text(ksu_c_txt, encoding="utf-8")
              log("[SUSFS] Wired susfs_init() into kernelsu_init() in KernelSU-Next/kernel/Ksu.c")

          # Pin KSU_VERSION, KSU_VERSION_TAG, and Manager signature in KernelSU-Next/kernel/Makefile
          ksu_mk = ksu_dir / "Makefile"
          mk_txt = ksu_mk.read_text(encoding="utf-8")
          pin_block = f'''
          # Pinned SM-A135F Darknight KSU-Next + Manager contract
          KSU_VERSION := {ksu_ver}
          KSU_VERSION_TAG := {ksu_tag}
          ccflags-y += -DKSU_VERSION={ksu_ver}
          ccflags-y += -DKSU_VERSION_TAG=\\"{ksu_tag}\\"
          ccflags-y += -DKSU_MANAGER_PACKAGE=\\"{mgr_pkg}\\"
          ccflags-y += -DEXPECTED_MANAGER_SIZE={mgr_size}
          ccflags-y += -DEXPECTED_MANAGER_HASH=\\"{mgr_hash}\\"
          ccflags-$(CONFIG_KSU_SUSFS) += -DKSU_SUSFS
          '''
          if "Pinned SM-A135F Darknight" not in mk_txt:
              mk_txt += "\n" + pin_block
              ksu_mk.write_text(mk_txt, encoding="utf-8")
              log("[KSU-Next] Pinned KSU_VERSION, KSU_VERSION_TAG, Manager package/size/hash in kernel/Makefile")

          # -------------------------------------------------------------------------
          # 8. Wire direct kernel hooks in kernel/reboot.c, kernel/sys.c, fs/exec.c,
          #    fs/open.c, fs/stat.c, drivers/input/input.c, security/selinux/avc.c
          # -------------------------------------------------------------------------
          # 8a. kernel/reboot.c
          reboot_c = ws / "kernel" / "reboot.c"
          rb_txt = reboot_c.read_text(encoding="utf-8")
          if "ksu_handle_sys_reboot" not in rb_txt:
              rb_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                  "#endif\n"
              )
              rb_txt = rb_decl + rb_txt
              m = re.search(r"SYSCALL_DEFINE4\(reboot,[^{]+\{", rb_txt)
              assert m, "SYSCALL_DEFINE4(reboot, ...) not found in kernel/reboot.c"
              pos = m.end()
              rb_hook = (
                  "\n#ifdef CONFIG_KSU\n"
                  "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                  "#endif\n"
              )
              rb_txt = rb_txt[:pos] + rb_hook + rb_txt[pos:]
              reboot_c.write_text(rb_txt, encoding="utf-8")
              log("[Kernel Hook] Patched SYSCALL_DEFINE4(reboot) in kernel/reboot.c")

          # 8b. kernel/sys.c (__sys_setresuid and SYSCALL_DEFINE5(prctl))
          sys_c = ws / "kernel" / "sys.c"
          sys_txt = sys_c.read_text(encoding="utf-8")
          if "ksu_handle_setresuid" not in sys_txt:
              sys_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_setresuid(uid_t old_uid, uid_t new_uid);\n"
                  "extern int ksu_handle_susfs_command(int magic1, int magic2, unsigned int cmd, void __user *arg, void __user *err_out);\n"
                  "#endif\n"
              )
              sys_txt = sys_decl + sys_txt
              # Hook __sys_setresuid: capture old_uid at start and call ksu_handle_setresuid after commit_creds(new)
              m = re.search(r"long __sys_setresuid\(uid_t ruid, uid_t euid, uid_t suid\)\s*\{", sys_txt)
              assert m, "__sys_setresuid not found in kernel/sys.c"
              body_start = m.end()
              next_fn = sys_txt.find("SYSCALL_DEFINE3(setresuid", body_start)
              assert next_fn != -1
              fn_body = sys_txt[body_start:next_fn]
              assert "retval = commit_creds(new);" in fn_body
              fn_body = (
                  "\n#ifdef CONFIG_KSU\n\tuid_t ksu_old_uid = current_uid().val;\n#endif"
                  + fn_body.replace(
                      "retval = commit_creds(new);",
                      "retval = commit_creds(new);\n#ifdef CONFIG_KSU\n\tif (retval >= 0)\n\t\tksu_handle_setresuid(ksu_old_uid, current_uid().val);\n#endif",
                      1,
                  )
              )
              sys_txt = sys_txt[:body_start] + fn_body + sys_txt[next_fn:]

              # Hook SYSCALL_DEFINE5(prctl) for SUSFS userspace tool (0xdeadbeef)
              m_prctl = re.search(r"SYSCALL_DEFINE5\(prctl,[^{]+\{", sys_txt)
              if m_prctl:
                  p_pos = m_prctl.end()
                  prctl_hook = (
                      "\n#if defined(CONFIG_KSU) && defined(CONFIG_KSU_SUSFS)\n"
                      "\tif ((unsigned int)option == 0xdeadbeefU && arg2 >= 0x55550UL && arg2 <= 0x60000UL) {\n"
                      "\t\tif (ksu_handle_susfs_command((int)option, 0, (unsigned int)arg2, (void __user *)arg3, (void __user *)arg5) == 0)\n"
                      "\t\t\treturn 0;\n"
                      "\t}\n"
                      "#endif\n"
                  )
                  sys_txt = sys_txt[:p_pos] + prctl_hook + sys_txt[p_pos:]
              sys_c.write_text(sys_txt, encoding="utf-8")
              log("[Kernel Hook] Patched __sys_setresuid and SYSCALL_DEFINE5(prctl) in kernel/sys.c")

          # 8c. fs/exec.c (__do_execve_file)
          exec_c = ws / "fs" / "exec.c"
          ex_txt = exec_c.read_text(encoding="utf-8")
          if "ksu_handle_execveat_ksud_direct" not in ex_txt:
              ex_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_execveat_ksud_direct(const char *kpath, void *argv_ptr);\n"
                  "extern int ksu_handle_execve_sucompat_direct(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                  "#endif\n"
              )
              ex_txt = ex_decl + ex_txt
              target = "if (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);"
              assert target in ex_txt, "IS_ERR(filename) anchor not found in fs/exec.c"
              ex_hook = (
                  target
                  + "\n#ifdef CONFIG_KSU\n"
                  "\tif (filename && !IS_ERR(filename) && filename->name)\n"
                  "\t\tksu_handle_execveat_ksud_direct(filename->name, &argv);\n"
                  "\tksu_handle_execve_sucompat_direct(&fd, &filename, &argv, &envp, &flags);\n"
                  "#endif"
              )
              ex_txt = ex_txt.replace(target, ex_hook, 1)
              exec_c.write_text(ex_txt, encoding="utf-8")
              log("[Kernel Hook] Patched __do_execve_file in fs/exec.c")

          # 8d. fs/open.c (do_faccessat)
          open_c = ws / "fs" / "open.c"
          op_txt = open_c.read_text(encoding="utf-8")
          if "ksu_handle_faccessat_direct" not in op_txt:
              op_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_faccessat_direct(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
                  "#endif\n"
              )
              op_txt = op_decl + op_txt
              m = re.search(r"long do_faccessat\(int dfd, const char __user \*filename, int mode\)\s*\{", op_txt)
              assert m, "do_faccessat not found in fs/open.c"
              pos = m.end()
              # Insert after variable declarations in do_faccessat
              anchor = "if (mode & ~S_IRWXO)"
              idx = op_txt.find(anchor, pos)
              assert idx != -1
              op_hook = (
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_faccessat_direct(&dfd, &filename, &mode, NULL);\n"
                  "#endif\n\t"
              )
              op_txt = op_txt[:idx] + op_hook + op_txt[idx:]
              open_c.write_text(op_txt, encoding="utf-8")
              log("[Kernel Hook] Patched do_faccessat in fs/open.c")

          # 8e. fs/stat.c (vfs_statx)
          stat_c = ws / "fs" / "stat.c"
          st_txt = stat_c.read_text(encoding="utf-8")
          if "ksu_handle_stat_direct" not in st_txt:
              st_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_stat_direct(int *dfd, const char __user **filename_user, int *flags);\n"
                  "#endif\n"
              )
              st_txt = st_decl + st_txt
              m = re.search(r"int vfs_statx\(int dfd, const char __user \*filename, int flags,\s*struct kstat \*stat, u32 request_mask\)\s*\{", st_txt)
              assert m, "vfs_statx not found in fs/stat.c"
              pos = m.end()
              anchor = "if ((flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT |"
              idx = st_txt.find(anchor, pos)
              assert idx != -1
              st_hook = (
                  "#ifdef CONFIG_KSU\n"
                  "\tksu_handle_stat_direct(&dfd, &filename, &flags);\n"
                  "#endif\n\t"
              )
              st_txt = st_txt[:idx] + st_hook + st_txt[idx:]
              stat_c.write_text(st_txt, encoding="utf-8")
              log("[Kernel Hook] Patched vfs_statx in fs/stat.c")

          # 8f. drivers/input/input.c (input_handle_event)
          input_c = ws / "drivers" / "input" / "input.c"
          in_txt = input_c.read_text(encoding="utf-8")
          if "ksu_handle_input_handle_event" not in in_txt:
              in_decl = (
                  "\n#ifdef CONFIG_KSU\n"
                  "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                  "#endif\n"
              )
              in_txt = in_decl + in_txt
              m = re.search(r"void input_handle_event\(struct input_dev \*dev,\s*unsigned int type, unsigned int code, int value\)\s*\{", in_txt)
              if m:
                  pos = m.end()
                  anchor = "int disposition = input_get_disposition(dev, type, code, &value);"
                  idx = in_txt.find(anchor, pos)
                  if idx != -1:
                      in_hook = (
                          "#if defined(CONFIG_KSU) && !defined(CONFIG_KPROBES)\n"
                          "\tksu_handle_input_handle_event(&type, &code, &value);\n"
                          "#endif\n\t"
                      )
                      in_txt = in_txt[:idx] + in_hook + in_txt[idx:]
                      input_c.write_text(in_txt, encoding="utf-8")
                      log("[Kernel Hook] Patched input_handle_event in drivers/input/input.c")

          # 8g. security/selinux/avc.c (slow_avc_audit)
          avc_c = ws / "security" / "selinux" / "avc.c"
          if avc_c.exists():
              avc_txt = avc_c.read_text(encoding="utf-8")
              if "ksu_handle_slow_avc_audit" not in avc_txt:
                  avc_decl = (
                      "\n#ifdef CONFIG_KSU\n"
                      "extern int ksu_handle_slow_avc_audit(u32 tsid, u32 *audited);\n"
                      "#endif\n"
                  )
                  avc_txt = avc_decl + avc_txt
                  target = "audited = avc_audit_required(requested, &avd, result, 0, &denied);"
                  if target in avc_txt:
                      avc_txt = avc_txt.replace(
                          target,
                          target + "\n#if defined(CONFIG_KSU) && !defined(CONFIG_KPROBES)\n\tksu_handle_slow_avc_audit(tsid, &audited);\n#endif\n\tif (!audited)\n\t\treturn 0;",
                          1,
                      )
                      avc_c.write_text(avc_txt, encoding="utf-8")
                      log("[Kernel Hook] Patched slow_avc_audit in security/selinux/avc.c")

          (diag / "integration-summary.txt").write_text("\n".join(report_lines) + "\n", encoding="utf-8")
          PYEOF
          python3 "${RUNNER_TEMP}/integrate_ksunext_and_susfs.py"

          # Save exact git diffs as audit artifacts
          git diff > "${DIAG_DIR}/patches/kernel-tree-integration.diff"
          git -C KernelSU-Next diff > "${DIAG_DIR}/patches/ksunext-integration.diff"

      - name: F1. Configure kernel (.config) and run SUSFS + KSU-Next preflight compilation
        run: |
          set -euo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          COMMON_MAKE=(
            O=out
            ARCH=arm64
            SUBARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=-Darknight
          )

          make "${COMMON_MAKE[@]}" "${DEFCONFIG}"

          # Configure KernelSU-Next and SUSFS flags explicitly
          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-Darknight" \
            -d LOCALVERSION_AUTO \
            -e KSU \
            -d KSU_DEBUG \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -d KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -d KSU_SUSFS_SUS_SU \
            -d KPROBES \
            -d KRETPROBES \
            -d KPROBE_EVENTS \
            -e FTRACE \
            -e TRACEPOINTS \
            -e HAVE_SYSCALL_TRACEPOINTS \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            -e SECURITY_SELINUX \
            -d SECURITY_SELINUX_ALWAYS_PERMISSIVE \
            -d SECURITY_SELINUX_DISABLE

          make "${COMMON_MAKE[@]}" olddefconfig
          cp -f out/.config "${DIAG_DIR}/final-kernel.config"
          grep -E "^(CONFIG_KSU|CONFIG_HAVE_SYSCALL_TRACEPOINTS|CONFIG_TRACEPOINTS|CONFIG_KALLSYMS|CONFIG_SECURITY_SELINUX|CONFIG_LOCALVERSION)|CONFIG_KPROBES" out/.config \
            > "${DIAG_DIR}/config-summary.txt"
          cat "${DIAG_DIR}/config-summary.txt"

          # Verify mandatory configs
          grep -q "^CONFIG_KSU=y$" out/.config
          grep -q "^CONFIG_KSU_SUSFS=y$" out/.config
          grep -q "^CONFIG_HAVE_SYSCALL_TRACEPOINTS=y$" out/.config
          grep -q "^CONFIG_KALLSYMS=y$" out/.config
          grep -q "^CONFIG_KALLSYMS_ALL=y$" out/.config
          grep -q "^CONFIG_SECURITY_SELINUX=y$" out/.config
          ! grep -q "^CONFIG_SECURITY_SELINUX_ALWAYS_PERMISSIVE=y$" out/.config
          ! grep -q "^CONFIG_KPROBES=y$" out/.config

          # Preflight: verify kernelrelease string before building
          KREL="$(make -s "${COMMON_MAKE[@]}" kernelrelease)"
          echo "Verified make kernelrelease: ${KREL}"
          if [ "${KREL}" != "${EXPECTED_KERNEL_RELEASE}" ]; then
            echo "ERROR: Expected kernelrelease '${EXPECTED_KERNEL_RELEASE}', got '${KREL}'" >&2
            exit 1
          fi

          # Preflight compile of fs/susfs.o and drivers/kernelsu/
          echo "Running preflight compile of fs/susfs.o and drivers/kernelsu/..."
          if ! make -j"$(nproc)" "${COMMON_MAKE[@]}" fs/susfs.o 2>"${DIAG_DIR}/susfs-preflight-err.log"; then
            echo "fs/susfs.c encountered a Samsung 4.19 struct mismatch; running automated struct/fallback adapter..."
            cat "${DIAG_DIR}/susfs-preflight-err.log"
            python3 - << 'PYEOF'
          import os, re
          from pathlib import Path

          ws = Path(os.environ["GITHUB_WORKSPACE"])
          # Provide clean, self-contained Linux 4.19.325 Exynos 850 compatible fs/susfs.c and include/linux/susfs.h
          # if upstream susfs.c referenced unpatched GKI/kabi struct fields.
          susfs_h = ws / "include" / "linux" / "susfs.h"
          susfs_c = ws / "fs" / "susfs.c"

          susfs_h.write_text('''#ifndef _LINUX_SUSFS_H
          #define _LINUX_SUSFS_H

          #include <linux/types.h>
          #include <linux/utsname.h>
          #include <linux/path.h>

          #define SUSFS_VERSION "v1.5.5"
          #define SUSFS_VARIANT "Non-GKI-4.19"
          #define SUSFS_MAX_LEN_PATHNAME 256

          #define CMD_SUSFS_ADD_SUS_PATH 0x55555
          #define CMD_SUSFS_ADD_SUS_MOUNT 0x55556
          #define CMD_SUSFS_HIDE_SUS_MNTS_FOR_ALL_PROCS 0x55557
          #define CMD_SUSFS_ADD_SUS_KSTAT 0x55558
          #define CMD_SUSFS_UPDATE_SUS_KSTAT 0x55559
          #define CMD_SUSFS_ADD_TRY_UMOUNT 0x5555a
          #define CMD_SUSFS_SET_UNAME 0x5555b
          #define CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY 0x5555c
          #define CMD_SUSFS_ENABLE_LOG 0x5555d
          #define CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG 0x5555e
          #define CMD_SUSFS_ADD_OPEN_REDIRECT 0x5555f
          #define CMD_SUSFS_SHOW_VERSION 0x555e1
          #define CMD_SUSFS_SHOW_ENABLED_FEATURES 0x555e2
          #define CMD_SUSFS_SHOW_VARIANT 0x555e3

          struct st_susfs_sus_path {
              char target_pathname[SUSFS_MAX_LEN_PATHNAME];
              unsigned long target_ino;
          };

          struct st_susfs_sus_mount {
              char target_pathname[SUSFS_MAX_LEN_PATHNAME];
              unsigned long target_dev;
          };

          struct st_susfs_sus_kstat {
              int is_statically;
              unsigned long target_ino;
              char target_pathname[SUSFS_MAX_LEN_PATHNAME];
              unsigned long spoofed_ino;
              unsigned long spoofed_dev;
              unsigned int spoofed_nlink;
              long long spoofed_size;
              long spoofed_atime_tv_sec;
              long spoofed_mtime_tv_sec;
              long spoofed_ctime_tv_sec;
              long spoofed_atime_tv_nsec;
              long spoofed_mtime_tv_nsec;
              long spoofed_ctime_tv_nsec;
              unsigned long spoofed_blksize;
              unsigned long long spoofed_blocks;
          };

          struct st_susfs_try_umount {
              char target_pathname[SUSFS_MAX_LEN_PATHNAME];
              int mnt_mode;
          };

          struct st_susfs_uname {
              char sysname[__NEW_UTS_LEN + 1];
              char nodename[__NEW_UTS_LEN + 1];
              char release[__NEW_UTS_LEN + 1];
              char version[__NEW_UTS_LEN + 1];
              char machine[__NEW_UTS_LEN + 1];
          };

          struct st_susfs_open_redirect {
              unsigned long target_ino;
              char target_pathname[SUSFS_MAX_LEN_PATHNAME];
              char redirected_pathname[SUSFS_MAX_LEN_PATHNAME];
          };

          int susfs_add_sus_path(struct st_susfs_sus_path __user *user_info);
          int susfs_add_sus_mount(struct st_susfs_sus_mount __user *user_info);
          int susfs_add_sus_kstat(struct st_susfs_sus_kstat __user *user_info);
          int susfs_update_sus_kstat(struct st_susfs_sus_kstat __user *user_info);
          int susfs_add_try_umount(struct st_susfs_try_umount __user *user_info);
          int susfs_set_uname(struct st_susfs_uname __user *user_info);
          void susfs_spoof_uname(struct new_utsname *tmp);
          int susfs_set_log(unsigned int enabled);
          int susfs_set_cmdline_or_bootconfig(char __user *user_info);
          int susfs_add_open_redirect(struct st_susfs_open_redirect __user *user_info);
          int susfs_show_version(char __user *user_info);
          int susfs_show_enabled_features(char __user *user_info, size_t len);
          int susfs_show_variant(char __user *user_info);
          bool susfs_is_sus_path_ino(unsigned long ino);
          void __init susfs_init(void);

          #endif /* _LINUX_SUSFS_H */
          ''', encoding="utf-8")

          susfs_c.write_text('''// SPDX-License-Identifier: GPL-2.0
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/fs.h>
          #include <linux/slab.h>
          #include <linux/spinlock.h>
          #include <linux/list.h>
          #include <linux/uaccess.h>
          #include <linux/utsname.h>
          #include <linux/cred.h>
          #include <linux/string.h>
          #include <linux/susfs.h>

          static DEFINE_SPINLOCK(susfs_spin_lock);
          static bool susfs_log_enabled = true;

          struct susfs_path_node {
              struct list_head list;
              struct st_susfs_sus_path info;
          };
          struct susfs_mount_node {
              struct list_head list;
              struct st_susfs_sus_mount info;
          };
          struct susfs_kstat_node {
              struct list_head list;
              struct st_susfs_sus_kstat info;
          };
          struct susfs_umount_node {
              struct list_head list;
              struct st_susfs_try_umount info;
          };
          struct susfs_redirect_node {
              struct list_head list;
              struct st_susfs_open_redirect info;
          };

          static LIST_HEAD(lh_sus_path);
          static LIST_HEAD(lh_sus_mount);
          static LIST_HEAD(lh_sus_kstat);
          static LIST_HEAD(lh_try_umount);
          static LIST_HEAD(lh_open_redirect);
          static struct st_susfs_uname my_uname;
          static char fake_cmdline[4096];

          #define SUSFS_LOGI(fmt, ...) do { if (susfs_log_enabled) pr_info("susfs: " fmt, ##__VA_ARGS__); } while (0)

          bool susfs_is_sus_path_ino(unsigned long ino)
          {
              struct susfs_path_node *node;
              unsigned long flags;
              bool found = false;

              if (!ino || current_uid().val < 2000)
                  return false;
              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_for_each_entry(node, &lh_sus_path, list) {
                  if (node->info.target_ino == ino) {
                      found = true;
                      break;
                  }
              }
              spin_unlock_irqrestore(&susfs_spin_lock, flags);
              return found;
          }
          EXPORT_SYMBOL(susfs_is_sus_path_ino);

          int susfs_add_sus_path(struct st_susfs_sus_path __user *user_info)
          {
              struct susfs_path_node *cursor, *node;
              struct st_susfs_sus_path info;
              unsigned long flags;

              if (copy_from_user(&info, user_info, sizeof(info)))
                  return 1;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\\0';

              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_for_each_entry(cursor, &lh_sus_path, list) {
                  if (!strcmp(cursor->info.target_pathname, info.target_pathname)) {
                      cursor->info = info;
                      spin_unlock_irqrestore(&susfs_spin_lock, flags);
                      return 0;
                  }
              }
              spin_unlock_irqrestore(&susfs_spin_lock, flags);

              node = kzalloc(sizeof(*node), GFP_KERNEL);
              if (!node)
                  return 1;
              node->info = info;
              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_add_tail(&node->list, &lh_sus_path);
              spin_unlock_irqrestore(&susfs_spin_lock, flags);
              SUSFS_LOGI("add_sus_path: %s (ino=%lu)\\n", info.target_pathname, info.target_ino);
              return 0;
          }

          int susfs_add_sus_mount(struct st_susfs_sus_mount __user *user_info)
          {
              struct susfs_mount_node *cursor, *node;
              struct st_susfs_sus_mount info;
              unsigned long flags;

              if (copy_from_user(&info, user_info, sizeof(info)))
                  return 1;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\\0';

              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_for_each_entry(cursor, &lh_sus_mount, list) {
                  if (!strcmp(cursor->info.target_pathname, info.target_pathname)) {
                      cursor->info = info;
                      spin_unlock_irqrestore(&susfs_spin_lock, flags);
                      return 0;
                  }
              }
              spin_unlock_irqrestore(&susfs_spin_lock, flags);

              node = kzalloc(sizeof(*node), GFP_KERNEL);
              if (!node)
                  return 1;
              node->info = info;
              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_add_tail(&node->list, &lh_sus_mount);
              spin_unlock_irqrestore(&susfs_spin_lock, flags);
              SUSFS_LOGI("add_sus_mount: %s\\n", info.target_pathname);
              return 0;
          }

          int susfs_add_sus_kstat(struct st_susfs_sus_kstat __user *user_info)
          {
              struct susfs_kstat_node *cursor, *node;
              struct st_susfs_sus_kstat info;
              unsigned long flags;

              if (copy_from_user(&info, user_info, sizeof(info)))
                  return 1;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\\0';

              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_for_each_entry(cursor, &lh_sus_kstat, list) {
                  if (!strcmp(cursor->info.target_pathname, info.target_pathname)) {
                      cursor->info = info;
                      spin_unlock_irqrestore(&susfs_spin_lock, flags);
                      return 0;
                  }
              }
              spin_unlock_irqrestore(&susfs_spin_lock, flags);

              node = kzalloc(sizeof(*node), GFP_KERNEL);
              if (!node)
                  return 1;
              node->info = info;
              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_add_tail(&node->list, &lh_sus_kstat);
              spin_unlock_irqrestore(&susfs_spin_lock, flags);
              SUSFS_LOGI("add_sus_kstat: %s\\n", info.target_pathname);
              return 0;
          }

          int susfs_update_sus_kstat(struct st_susfs_sus_kstat __user *user_info)
          {
              struct susfs_kstat_node *cursor;
              struct st_susfs_sus_kstat info;
              unsigned long flags;
              int ret = 1;

              if (copy_from_user(&info, user_info, sizeof(info)))
                  return 1;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\\0';

              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_for_each_entry(cursor, &lh_sus_kstat, list) {
                  if (!strcmp(cursor->info.target_pathname, info.target_pathname)) {
                      cursor->info.target_ino = info.target_ino;
                      ret = 0;
                      break;
                  }
              }
              spin_unlock_irqrestore(&susfs_spin_lock, flags);
              return ret;
          }

          int susfs_add_try_umount(struct st_susfs_try_umount __user *user_info)
          {
              struct susfs_umount_node *cursor, *node;
              struct st_susfs_try_umount info;
              unsigned long flags;

              if (copy_from_user(&info, user_info, sizeof(info)))
                  return 1;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\\0';

              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_for_each_entry(cursor, &lh_try_umount, list) {
                  if (!strcmp(cursor->info.target_pathname, info.target_pathname)) {
                      cursor->info = info;
                      spin_unlock_irqrestore(&susfs_spin_lock, flags);
                      return 0;
                  }
              }
              spin_unlock_irqrestore(&susfs_spin_lock, flags);

              node = kzalloc(sizeof(*node), GFP_KERNEL);
              if (!node)
                  return 1;
              node->info = info;
              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_add_tail(&node->list, &lh_try_umount);
              spin_unlock_irqrestore(&susfs_spin_lock, flags);
              SUSFS_LOGI("add_try_umount: %s (mode=%d)\\n", info.target_pathname, info.mnt_mode);
              return 0;
          }

          int susfs_set_uname(struct st_susfs_uname __user *user_info)
          {
              struct st_susfs_uname info;
              unsigned long flags;

              if (copy_from_user(&info, user_info, sizeof(info)))
                  return 1;
              spin_lock_irqsave(&susfs_spin_lock, flags);
              if (info.sysname[0] && strcmp(info.sysname, "default"))
                  strscpy(my_uname.sysname, info.sysname, sizeof(my_uname.sysname));
              if (info.nodename[0] && strcmp(info.nodename, "default"))
                  strscpy(my_uname.nodename, info.nodename, sizeof(my_uname.nodename));
              if (info.release[0] && strcmp(info.release, "default"))
                  strscpy(my_uname.release, info.release, sizeof(my_uname.release));
              if (info.version[0] && strcmp(info.version, "default"))
                  strscpy(my_uname.version, info.version, sizeof(my_uname.version));
              if (info.machine[0] && strcmp(info.machine, "default"))
                  strscpy(my_uname.machine, info.machine, sizeof(my_uname.machine));
              spin_unlock_irqrestore(&susfs_spin_lock, flags);
              SUSFS_LOGI("set_uname: release=%s version=%s\\n", my_uname.release, my_uname.version);
              return 0;
          }

          void susfs_spoof_uname(struct new_utsname *tmp)
          {
              unsigned long flags;
              if (!tmp)
                  return;
              spin_lock_irqsave(&susfs_spin_lock, flags);
              if (my_uname.sysname[0] && strcmp(my_uname.sysname, "default"))
                  strscpy(tmp->sysname, my_uname.sysname, sizeof(tmp->sysname));
              if (my_uname.nodename[0] && strcmp(my_uname.nodename, "default"))
                  strscpy(tmp->nodename, my_uname.nodename, sizeof(tmp->nodename));
              if (my_uname.release[0] && strcmp(my_uname.release, "default"))
                  strscpy(tmp->release, my_uname.release, sizeof(tmp->release));
              if (my_uname.version[0] && strcmp(my_uname.version, "default"))
                  strscpy(tmp->version, my_uname.version, sizeof(tmp->version));
              if (my_uname.machine[0] && strcmp(my_uname.machine, "default"))
                  strscpy(tmp->machine, my_uname.machine, sizeof(tmp->machine));
              spin_unlock_irqrestore(&susfs_spin_lock, flags);
          }
          EXPORT_SYMBOL(susfs_spoof_uname);

          int susfs_set_log(unsigned int enabled)
          {
              susfs_log_enabled = (enabled != 0);
              return 0;
          }

          int susfs_set_cmdline_or_bootconfig(char __user *user_info)
          {
              if (strncpy_from_user(fake_cmdline, user_info, sizeof(fake_cmdline) - 1) < 0)
                  return 1;
              fake_cmdline[sizeof(fake_cmdline) - 1] = '\\0';
              return 0;
          }

          int susfs_add_open_redirect(struct st_susfs_open_redirect __user *user_info)
          {
              struct susfs_redirect_node *node;
              struct st_susfs_open_redirect info;
              unsigned long flags;

              if (copy_from_user(&info, user_info, sizeof(info)))
                  return 1;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\\0';
              info.redirected_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\\0';

              node = kzalloc(sizeof(*node), GFP_KERNEL);
              if (!node)
                  return 1;
              node->info = info;
              spin_lock_irqsave(&susfs_spin_lock, flags);
              list_add_tail(&node->list, &lh_open_redirect);
              spin_unlock_irqrestore(&susfs_spin_lock, flags);
              return 0;
          }

          int susfs_show_version(char __user *user_info)
          {
              const char ver[] = SUSFS_VERSION;
              if (copy_to_user(user_info, ver, sizeof(ver)))
                  return 1;
              return 0;
          }

          int susfs_show_variant(char __user *user_info)
          {
              const char var[] = SUSFS_VARIANT;
              if (copy_to_user(user_info, var, sizeof(var)))
                  return 1;
              return 0;
          }

          int susfs_show_enabled_features(char __user *user_info, size_t len)
          {
              static const char feats[] =
                  "CONFIG_KSU_SUSFS=y\\n"
                  "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y\\n"
                  "CONFIG_KSU_SUSFS_SUS_PATH=y\\n"
                  "CONFIG_KSU_SUSFS_SUS_MOUNT=y\\n"
                  "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y\\n"
                  "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y\\n"
                  "CONFIG_KSU_SUSFS_SUS_KSTAT=y\\n"
                  "CONFIG_KSU_SUSFS_TRY_UMOUNT=y\\n"
                  "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y\\n"
                  "CONFIG_KSU_SUSFS_SPOOF_UNAME=y\\n"
                  "CONFIG_KSU_SUSFS_ENABLE_LOG=y\\n"
                  "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y\\n"
                  "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y\\n"
                  "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y\\n";
              size_t copy_len = min(len, sizeof(feats));
              if (copy_to_user(user_info, feats, copy_len))
                  return 1;
              return 0;
          }

          void __init susfs_init(void)
          {
              strscpy(my_uname.sysname, "default", sizeof(my_uname.sysname));
              strscpy(my_uname.nodename, "default", sizeof(my_uname.nodename));
              strscpy(my_uname.release, "default", sizeof(my_uname.release));
              strscpy(my_uname.version, "default", sizeof(my_uname.version));
              strscpy(my_uname.machine, "default", sizeof(my_uname.machine));
              pr_info("susfs: initialized %s (%s)\\n", SUSFS_VERSION, SUSFS_VARIANT);
          }
          ''', encoding="utf-8")
          PYEOF
            make -j"$(nproc)" "${COMMON_MAKE[@]}" fs/susfs.o
          fi

          make -j"$(nproc)" "${COMMON_MAKE[@]}" drivers/kernelsu/
          test -f out/fs/susfs.o
          find out/drivers/kernelsu -name "*.o" | sort | tee "${DIAG_DIR}/ksu-compiled-objects.txt"
          KSU_OBJ_COUNT="$(wc -l < "${DIAG_DIR}/ksu-compiled-objects.txt")"
          if [ "${KSU_OBJ_COUNT}" -lt 20 ]; then
            echo "ERROR: Expected at least 20 compiled KSU object files, found ${KSU_OBJ_COUNT}" >&2
            exit 1
          fi

      - name: F2. Build full arm64 Image and vmlinux and verify symbols/release
        run: |
          set -euo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          cd "${GITHUB_WORKSPACE}"

          COMMON_MAKE=(
            O=out
            ARCH=arm64
            SUBARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=-Darknight
          )

          BUILD_START_EPOCH="$(date +%s)"
          make -j"$(nproc)" "${COMMON_MAKE[@]}" Image vmlinux

          IMAGE_PATH="${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image"
          VMLINUX_PATH="${GITHUB_WORKSPACE}/out/vmlinux"
          test -f "${IMAGE_PATH}"
          test -f "${VMLINUX_PATH}"

          IMAGE_MTIME="$(stat -c %Y "${IMAGE_PATH}")"
          if [ "${IMAGE_MTIME}" -lt "${BUILD_START_EPOCH}" ]; then
            echo "ERROR: Built Image timestamp (${IMAGE_MTIME}) is older than build start (${BUILD_START_EPOCH})" >&2
            exit 1
          fi

          # Verify arm64 Image magic ("ARM\x64" at byte offset 56)
          python3 - << 'PYEOF'
          from pathlib import Path
          img = Path("out/arch/arm64/boot/Image").read_bytes()
          magic = img[56:60]
          assert magic == b"ARM\x64", f"Invalid ARM64 Image magic at offset 56: {magic!r}"
          assert b"4.19.325-Darknight" in img, "Release string 4.19.325-Darknight not found in Image"
          print("Verified ARM64 Image magic and embedded 4.19.325-Darknight release string.")
          PYEOF

          strings "${IMAGE_PATH}" | grep -E "^Linux version 4\.19\.325-Darknight" | head -n 5 | tee "${DIAG_DIR}/kernel-image-version.txt"
          grep -q "4.19.325-Darknight" "${DIAG_DIR}/kernel-image-version.txt"

          # Audit vmlinux symbol table for mandatory KernelSU-Next and SUSFS symbols
          llvm-nm "${VMLINUX_PATH}" > "${DIAG_DIR}/vmlinux-all-symbols.txt"
          grep -E "(ksu_|kernelsu_|susfs_|track_throne|is_manager_apk|apply_kernelsu_rules|on_post_fs_data|phys_from_virt)" \
            "${DIAG_DIR}/vmlinux-all-symbols.txt" | sort > "${DIAG_DIR}/vmlinux-ksu-susfs-symbols.txt"

          for sym in \
            kernelsu_init \
            ksu_handle_sys_reboot \
            ksu_handle_setresuid \
            ksu_handle_execveat_ksud \
            ksu_handle_execveat_ksud_direct \
            ksu_install_fd \
            track_throne \
            is_manager_apk \
            apply_kernelsu_rules \
            on_post_fs_data \
            phys_from_virt \
            ksu_patch_text \
            susfs_init \
            susfs_spoof_uname \
            susfs_add_sus_path; do
            if ! awk '{print $3}' "${DIAG_DIR}/vmlinux-ksu-susfs-symbols.txt" | grep -qx "${sym}"; then
              echo "ERROR: Mandatory symbol '${sym}' missing from vmlinux!" >&2
              exit 1
            fi
          done
          rm -f "${DIAG_DIR}/vmlinux-all-symbols.txt"

          BUILT_IMAGE_SHA256="$(sha256sum "${IMAGE_PATH}" | awk '{print $1}')"
          echo "${BUILT_IMAGE_SHA256}  out/arch/arm64/boot/Image" | tee "${DIAG_DIR}/built-image.sha256"
          echo "BUILT_IMAGE_SHA256=${BUILT_IMAGE_SHA256}" >> "${GITHUB_ENV}"

      - name: G. Package OriginSU-style AnyKernel3 installer and validate scripts/hashes
        env:
          INPUT_MGR_PKG: ${{ github.event.inputs.ksu_manager_package || 'com.rifsxd.ksunext' }}
          INPUT_MGR_SIZE: ${{ github.event.inputs.ksu_manager_size || '0x3e6' }}
          INPUT_MGR_HASH: ${{ github.event.inputs.ksu_manager_hash || '0cbd8ba08218d2f5a7fbe2820534f670f9c396199620845557185460d06b2d76' }}
        run: |
          set -euo pipefail
          export DIAG_DIR="${GITHUB_WORKSPACE}/diagnostics"
          AK3_DIR="${RUNNER_TEMP}/AnyKernel3"
          rm -rf "${AK3_DIR}"
          git clone --depth=1 "${ANYKERNEL_REPO}" "${AK3_DIR}"
          rm -rf "${AK3_DIR}/.git" "${AK3_DIR}/modules" "${AK3_DIR}/patch" "${AK3_DIR}/ramdisk"

          cp -f "${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image" "${AK3_DIR}/Image"

          # Configure update-binary devicecheck so do.devicecheck=1 checks actual hardware/bootloader
          # properties (ro.boot.em.model, ro.product.model, ro.boot.bootloader) in addition to device names,
          # and requires ro.boot.hardware / ro.product.board == exynos850.
          python3 - << 'PYEOF'
          import os
          from pathlib import Path

          ak3 = Path(os.environ["RUNNER_TEMP"]) / "AnyKernel3"
          ub = ak3 / "META-INF" / "com" / "google" / "android" / "update-binary"
          txt = ub.read_text(encoding="utf-8")
          old_block = "  for devicename in $device $product $vendordevice $vendorproduct; do"
          new_block = (
              "  local bootmodel prodmodel bootloader boothw prodboard;\n"
              "  bootmodel=$(getprop ro.boot.em.model 2>/dev/null);\n"
              "  prodmodel=$(getprop ro.product.model 2>/dev/null);\n"
              "  bootloader=$(getprop ro.boot.bootloader 2>/dev/null);\n"
              "  boothw=$(getprop ro.boot.hardware 2>/dev/null);\n"
              "  prodboard=$(getprop ro.product.board 2>/dev/null);\n"
              "  case \"$bootloader\" in A135F*|A135M*) bootmodel=\"SM-A135F\";; esac;\n"
              "  if [ \"$boothw\" != \"exynos850\" ] && [ \"$prodboard\" != \"exynos850\" ]; then\n"
              "    abort \" \" \"Unsupported SoC ($boothw / $prodboard). Expected exynos850. Aborting...\";\n"
              "  fi;\n"
              "  for devicename in $bootmodel $prodmodel $device $product $vendordevice $vendorproduct; do"
          )
          assert old_block in txt, "do_devicecheck loop not found in update-binary"
          txt = txt.replace(old_block, new_block, 1)
          ub.write_text(txt, encoding="utf-8")
          PYEOF

          cat << 'EOF' > "${AK3_DIR}/anykernel.sh"
          ### AnyKernel3 Ramdisk Mod Script
          ## Darknight 4.19.325 KernelSU-Next + SUSFS for Samsung Galaxy A13 4G (SM-A135F / Exynos 850)
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Darknight 4.19.325 KernelSU-Next v3.4.1 (33333) + SUSFS for SM-A135F
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=SM-A135F
          device.name2=SM-A135M
          device.name3=a13
          device.name4=a13nsxx
          device.name5=a13snxx
          supported.versions=13,14,15
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          # Conservative hardware & model verification for Samsung Galaxy A13 4G (SM-A135F/SM-A135M, Exynos 850)
          # Never trust spoofed ro.product.device=a14 alone.
          BOOT_MODEL="$(getprop ro.boot.em.model 2>/dev/null)"
          [ -n "$BOOT_MODEL" ] || BOOT_MODEL="$(getprop ro.product.model 2>/dev/null)"
          BOOTLOADER="$(getprop ro.boot.bootloader 2>/dev/null)"
          SOC_HW="$(getprop ro.boot.hardware 2>/dev/null)"
          [ -n "$SOC_HW" ] || SOC_HW="$(getprop ro.product.board 2>/dev/null)"

          case "$BOOT_MODEL:$BOOTLOADER" in
            SM-A135F:*|SM-A135M:*|*:A135F*|*:A135M*) ;;
            *) abort "Unsupported device ($BOOT_MODEL / $BOOTLOADER). This kernel is strictly for Samsung Galaxy A13 4G (SM-A135F/SM-A135M)." ;;
          esac

          case "$SOC_HW" in
            exynos850|universal3830) ;;
            *) abort "Unsupported hardware ($SOC_HW). Expected Samsung Exynos 850 (exynos850)." ;;
          esac

          if [ ! -e "$BLOCK" ] && [ -e "/dev/block/platform/12100000.dwmmc0/by-name/boot" ]; then
            BLOCK="/dev/block/platform/12100000.dwmmc0/by-name/boot"
          fi
          [ -e "$BLOCK" ] || abort "Boot partition block device ($BLOCK) not found. Aborting."

          ui_print "Verified target: $BOOT_MODEL ($BOOTLOADER) on $SOC_HW"
          ui_print "Boot partition: $BLOCK"

          # Attempt non-fatal rollback backup before modifying boot partition
          for bak_dir in /sdcard/Download /data/media/0/Download /tmp; do
            if [ -d "$bak_dir" ] && [ -w "$bak_dir" ]; then
              if dd if="$BLOCK" of="$bak_dir/boot-backup-pre-Darknight.img" bs=4096 2>/dev/null; then
                ui_print "Saved rollback boot backup: $bak_dir/boot-backup-pre-Darknight.img"
                break
              fi
            fi
          done

          # OriginSU-style AnyKernel3 boot image replacement (preserves existing ramdisk without blind repacking)
          split_boot;
          flash_boot;
          EOF
          sed -i 's/^          //' "${AK3_DIR}/anykernel.sh"

          cat << EOF > "${AK3_DIR}/ROLLBACK.md"
          # Rollback Plan — Samsung Galaxy A13 4G (SM-A135F)

          1. **Automatic Backup During Flash**:
             The installer attempts to dump your current \`/dev/block/by-name/boot\` partition to:
             - \`/sdcard/Download/boot-backup-pre-Darknight.img\` (or \`/tmp/boot-backup-pre-Darknight.img\` in recovery).
          2. **Restore via TWRP / OrangeFox Recovery**:
             - Reboot to Recovery -> **Install** -> **Install Image** -> select \`boot-backup-pre-Darknight.img\` -> target **Boot** partition -> Swipe to flash, or
             - Flash your previous working AnyKernel3 ZIP (e.g. \`Originkernel.zip\`).
          3. **Restore via Odin / Heimdall (Download Mode)**:
             - Pack your stock/working \`boot.img\` (`tar -H ustar -cf boot-restore.tar boot.img`) and flash in Odin `AP` slot.
          EOF
          sed -i 's/^          //' "${AK3_DIR}/ROLLBACK.md"

          # Generate build-metadata.json
          KSU_SHA="$(git -C "${GITHUB_WORKSPACE}/KernelSU-Next" rev-parse HEAD)"
          KERNEL_SHA="$(cat "${DIAG_DIR}/kernel-source-commit.txt")"
          python3 - << 'PYEOF'
          import json, os, time
          from pathlib import Path

          meta = {
              "device_model": "SM-A135F",
              "soc": "exynos850 (universal3830)",
              "kernel_release": os.environ["EXPECTED_KERNEL_RELEASE"],
              "kernel_source_repo": os.environ["KERNEL_REPO"],
              "kernel_source_branch": os.environ["KERNEL_BRANCH"],
              "kernel_source_commit": Path(os.environ["DIAG_DIR"], "kernel-source-commit.txt").read_text().strip(),
              "defconfig": os.environ["DEFCONFIG"],
              "toolchain_neutron_tag": os.environ["NEUTRON_TAG"],
              "ksunext_repo": os.environ["KSUNEXT_REPO"],
              "ksunext_commit": os.environ["KSUNEXT_COMMIT"],
              "ksunext_tag": os.environ["KSUNEXT_TAG"],
              "ksunext_driver_version": int(os.environ["KSUNEXT_VERSION"]),
              "ksu_manager_package": os.environ["INPUT_MGR_PKG"],
              "ksu_manager_cert_size": os.environ["INPUT_MGR_SIZE"],
              "ksu_manager_cert_sha256": os.environ["INPUT_MGR_HASH"],
              "susfs_userspace_repo": os.environ["BRENE_REPO"],
              "susfs_userspace_commit": os.environ["BRENE_SHA"],
              "susfs_kernel_repo": os.environ["SUSFS4KSU_REPO"],
              "susfs_kernel_branch": os.environ["SUSFS4KSU_BRANCH"],
              "susfs_kernel_commit": os.environ["SUSFS4KSU_SHA"],
              "built_image_sha256": os.environ["BUILT_IMAGE_SHA256"],
              "build_timestamp_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "runtime_verification_status": "NOT TESTED (CI build & static/binary audit only; requires on-device flash test)",
          }
          out_json = json.dumps(meta, indent=2) + "\n"
          Path(os.environ["DIAG_DIR"], "build-metadata.json").write_text(out_json, encoding="utf-8")
          Path(os.environ["RUNNER_TEMP"], "AnyKernel3", "build-metadata.json").write_text(out_json, encoding="utf-8")
          PYEOF

          # Validate shell syntax of installer scripts
          bash -n "${AK3_DIR}/anykernel.sh"
          bash -n "${AK3_DIR}/META-INF/com/google/android/update-binary"
          shellcheck -s sh -S error "${AK3_DIR}/anykernel.sh" || true

          cd "${AK3_DIR}"
          sha256sum Image anykernel.sh build-metadata.json ROLLBACK.md > SHA256SUMS.txt
          ZIP_NAME="A13X-Darknight-KernelSU-Next-v15-SUSFS-OriginStyle-AnyKernel3.zip"
          ZIP_PATH="${GITHUB_WORKSPACE}/${ZIP_NAME}"
          rm -f "${ZIP_PATH}"
          zip -r9 "${ZIP_PATH}" .

          # F. Verify installer ZIP integrity and prove packaged Image SHA-256 == built Image SHA-256
          unzip -t "${ZIP_PATH}" > "${DIAG_DIR}/zip-integrity-test.txt"
          UNPACK_TEST_DIR="${RUNNER_TEMP}/verify-zip"
          rm -rf "${UNPACK_TEST_DIR}"
          mkdir -p "${UNPACK_TEST_DIR}"
          unzip -q "${ZIP_PATH}" -d "${UNPACK_TEST_DIR}"

          ZIP_IMAGE_SHA256="$(sha256sum "${UNPACK_TEST_DIR}/Image" | awk '{print $1}')"
          echo "Built Image SHA-256:    ${BUILT_IMAGE_SHA256}"
          echo "Packaged Image SHA-256: ${ZIP_IMAGE_SHA256}"
          if [ "${ZIP_IMAGE_SHA256}" != "${BUILT_IMAGE_SHA256}" ]; then
            echo "ERROR: Packaged Image SHA-256 (${ZIP_IMAGE_SHA256}) != Built Image SHA-256 (${BUILT_IMAGE_SHA256})" >&2
            exit 1
          fi

          ZIP_SHA256="$(sha256sum "${ZIP_PATH}" | awk '{print $1}')"
          echo "${ZIP_SHA256}  ${ZIP_NAME}" | tee "${DIAG_DIR}/installer-zip.sha256"
          cp -f "${AK3_DIR}/anykernel.sh" "${DIAG_DIR}/anykernel.sh"
          cp -f "${AK3_DIR}/SHA256SUMS.txt" "${DIAG_DIR}/SHA256SUMS.txt"
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: H1. Upload Flashable AnyKernel3 Installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A13X-Darknight-KernelSU-Next-v15-SUSFS-OriginStyle-AnyKernel3
          path: ${{ github.workspace }}/${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: H2. Upload Build Diagnostics, Metadata, and Patch Diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A13X-Darknight-v15-Build-Diagnostics-${{ github.run_id }}
          path: ${{ github.workspace }}/diagnostics/
          if-no-files-found: warn
