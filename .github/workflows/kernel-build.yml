name: A13 KernelSU-Next v3.4.1 (33333) SUSFS Build - MAX ARAF (seccomp + SUSFS prctl port + diagnostics)

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next-v3.4.1

permissions:
  contents: read

concurrency:
  group: a13-ksun-susfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      DEFCONFIG: exynos850-a13nsxx_defconfig
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_TAG: v3.4.1
      KSU_EXPECTED_COMMIT_SHORT: 8f902ae
      KSU_EXPECTED_VERSION: "33333"
      KSU_NEXT_EXPECTED_SIZE: "0x3e6"
      KSU_NEXT_EXPECTED_HASH: 79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7
      KERNEL_LOCALVERSION: "-MAX-ARAF"
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19
      CROSS_COMPILE: aarch64-linux-gnu-
      LLVM: "1"
      LLVM_IAS: "1"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git patch \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libelf-dev libncurses-dev libssl-dev python3 python-is-python3 \
            rsync dwarves zstd lz4 zip unzip xz-utils

      - name: Restore Android Clang archive cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/clang-r450784e.tar.gz
          key: a13-clang-r450784e-android14-release-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Download Android Clang r450784e
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/clang-r450784e.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r450784e.tar.gz' \
            -o "$ARCHIVE"
          test -s "$ARCHIVE"

      - name: Save Android Clang archive cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/clang-r450784e.tar.gz
          key: a13-clang-r450784e-android14-release-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Extract and verify Android Clang
        shell: bash
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang-r450784e"
          mkdir -p "$CLANG_DIR"
          tar -xzf "$RUNNER_TEMP/clang-r450784e.tar.gz" -C "$CLANG_DIR"
          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version
          "$CLANG_DIR/bin/ld.lld" --version

      - name: Verify target kernel source
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f "arch/arm64/configs/$DEFCONFIG"
          KERNEL_VERSION="$(make -s kernelversion)"
          echo "Target kernel version: $KERNEL_VERSION"
          if [ "$KERNEL_VERSION" != "4.19.325" ]; then
            echo "Expected Linux 4.19.325, got $KERNEL_VERSION" >&2
            exit 1
          fi

      - name: Integrate official KernelSU-Next v3.4.1 (33333)
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "ERROR at line $LINENO: $BASH_COMMAND (exit=$rc)" >&2; exit "$rc"' ERR

          rm -rf KernelSU-Next
          # Full history is required: official KernelSU-Next derives KSU_VERSION
          # from 30000 + git rev-list --count HEAD. A depth=1 clone gives a false version.
          git clone "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next fetch --tags --force origin
          git -C KernelSU-Next checkout --detach "$KSU_TAG"

          
          ACTUAL_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          ACTUAL_COMMIT_SHORT="${ACTUAL_COMMIT:0:${#KSU_EXPECTED_COMMIT_SHORT}}"
          ACTUAL_TAG="$(git -C KernelSU-Next describe --tags --exact-match HEAD)"
          echo "Official KernelSU-Next tag: $ACTUAL_TAG"
          echo "Official KernelSU-Next commit: $ACTUAL_COMMIT"
          echo "Verified commit prefix: $ACTUAL_COMMIT_SHORT"
          test "$ACTUAL_TAG" = "$KSU_TAG"
          if [ "$ACTUAL_COMMIT_SHORT" != "$KSU_EXPECTED_COMMIT_SHORT" ]; then
            echo "ERROR: Commit does not match expected v3.4.1 commit." >&2
            echo "Expected prefix: $KSU_EXPECTED_COMMIT_SHORT" >&2
            echo "Actual commit: $ACTUAL_COMMIT" >&2
            exit 1
          fi

          test -s KernelSU-Next/kernel/Kconfig
          test -s KernelSU-Next/kernel/Kbuild
          test -s KernelSU-Next/kernel/core/init.c
          test -s KernelSU-Next/kernel/hook/setuid_hook.c

          KSU_KBUILD="KernelSU-Next/kernel/Kbuild"
          grep -Fq "KSU_NEXT_MANAGER_SIZE := ${KSU_NEXT_EXPECTED_SIZE}" "$KSU_KBUILD"
          grep -Fq "KSU_NEXT_MANAGER_HASH := ${KSU_NEXT_EXPECTED_HASH}" "$KSU_KBUILD"

          # The official v3.4.1 source does not carry the SUSFS Kconfig symbols
          # from the old third-party branch. Define those kernel-side options here
          # so the existing Linux 4.19 SUSFS patch can still be configured.
          python3 - <<'PYKCONFIG'
          from pathlib import Path

          path = Path("KernelSU-Next/kernel/Kconfig")
          data = path.read_text()
          block = '''config KSU_SUSFS
          	bool "SUSFS support"
          	depends on KSU
          	default y

          config KSU_SUSFS_HAS_MAGIC_MOUNT
          	bool "SUSFS magic mount support"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_PATH
          	bool "SUSFS path hiding"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_SUS_MOUNT
          	bool "SUSFS mount hiding"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          	bool "SUSFS automatically hide KernelSU mounts"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default n

          config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          	bool "SUSFS automatically hide bind mounts"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default n

          config KSU_SUSFS_SUS_KSTAT
          	bool "SUSFS stat spoofing"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_SUS_OVERLAYFS
          	bool "SUSFS overlayfs support"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_TRY_UMOUNT
          	bool "SUSFS try umount"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          	bool "SUSFS automatic try umount for bind mounts"
          	depends on KSU_SUSFS_TRY_UMOUNT
          	default n

          config KSU_SUSFS_SPOOF_UNAME
          	bool "SUSFS uname spoofing"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "SUSFS cmdline/bootconfig spoofing"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_OPEN_REDIRECT
          	bool "SUSFS open redirect"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_SUS_SU
          	bool "SUSFS sus su support"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_ENABLE_LOG
          	bool "SUSFS logging"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Hide KernelSU/SUSFS symbols"
          	depends on KSU_SUSFS
          	default n
          '''
          if "config KSU_SUSFS\n" not in data:
              pos = data.rfind("endmenu")
              if pos < 0:
                  raise SystemExit("Cannot add SUSFS options: endmenu missing in official Kconfig")
              data = data[:pos] + block + "\n" + data[pos:]
              path.write_text(data)
          required = [
              "config KSU_SUSFS\n",
              "config KSU_SUSFS_SUS_PATH\n",
              "config KSU_SUSFS_SUS_KSTAT\n",
              "config KSU_SUSFS_SUS_OVERLAYFS\n",
              "config KSU_SUSFS_SPOOF_UNAME\n",
              "config KSU_SUSFS_OPEN_REDIRECT\n",
          ]
          final = path.read_text()
          for item in required:
              if item not in final:
                  raise SystemExit(f"Missing official-tag SUSFS Kconfig option: {item.strip()}")
          PYKCONFIG

          rm -rf drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            python3 - <<'PYDRIVERKCONFIG'
          from pathlib import Path
          p = Path('drivers/Kconfig')
          s = p.read_text()
          marker = 'endmenu'
          i = s.rfind(marker)
          if i < 0:
              raise SystemExit('Could not find final endmenu in drivers/Kconfig')
          s = s[:i] + 'source "drivers/kernelsu/Kconfig"\n\n' + s[i:]
          p.write_text(s)
          PYDRIVERKCONFIG

          test -L drivers/kernelsu
          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "Integrated official KernelSU-Next ${KSU_TAG} (${ACTUAL_COMMIT}); SUSFS kernel options added separately."


      - name: Backport Linux 4.19 SELinux compatibility while preserving v3.4.1 Manager 33333
        shell: bash
        env:
          # Pinned upstream compatibility implementation. This does NOT change
          # KSU_TAG, KSU_EXPECTED_VERSION, Kbuild, or Manager signature metadata.
          KSU_SELINUX_COMPAT_REF: 3c6dca5ca3f4f225c62d464aae3fa59bd1aaa371
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "ERROR at line $LINENO: $BASH_COMMAND (exit=$rc)" >&2; exit "$rc"' ERR

          KSU_DIR="$GITHUB_WORKSPACE/KernelSU-Next/kernel/selinux"
          test -s "$KSU_DIR/rules.c"
          test -s "$KSU_DIR/sepolicy.c"
          test -s "$GITHUB_WORKSPACE/KernelSU-Next/kernel/Kbuild"
          test -s "$GITHUB_WORKSPACE/KernelSU-Next/kernel/selinux/selinux.h"
          test -s "$GITHUB_WORKSPACE/security/selinux/include/security.h"
          test -s "$GITHUB_WORKSPACE/security/selinux/ss/policydb.h"

          mkdir -p "$RUNNER_TEMP/ksu-selinux-compat"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_SELINUX_COMPAT_REF}/kernel/selinux/rules.c" \
            -o "$RUNNER_TEMP/ksu-selinux-compat/rules.c"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_SELINUX_COMPAT_REF}/kernel/selinux/sepolicy.c" \
            -o "$RUNNER_TEMP/ksu-selinux-compat/sepolicy.c"
          test -s "$RUNNER_TEMP/ksu-selinux-compat/rules.c"
          test -s "$RUNNER_TEMP/ksu-selinux-compat/sepolicy.c"

          cp "$KSU_DIR/rules.c" "$RUNNER_TEMP/ksu-selinux-compat/v3.4.1-rules.c"
          cp "$KSU_DIR/sepolicy.c" "$RUNNER_TEMP/ksu-selinux-compat/v3.4.1-sepolicy.c"
          cp "$KSU_DIR/selinux.h" "$RUNNER_TEMP/ksu-selinux-compat/v3.4.1-selinux.h"
          cp "$KSU_DIR/rules.c" "$GITHUB_WORKSPACE/selinux-compat-original-v3.4.1-rules.c"
          cp "$KSU_DIR/sepolicy.c" "$GITHUB_WORKSPACE/selinux-compat-original-v3.4.1-sepolicy.c"
          cp "$GITHUB_WORKSPACE/KernelSU-Next/kernel/Kbuild" "$RUNNER_TEMP/ksu-selinux-compat/v3.4.1-Kbuild"

          python3 - <<'PYSELINUX'
          from pathlib import Path
          import hashlib, re, sys

          temp = Path(__import__('os').environ['RUNNER_TEMP']) / 'ksu-selinux-compat'
          ksu = Path('KernelSU-Next/kernel/selinux')
          original_rules = (temp / 'v3.4.1-rules.c').read_text()
          compat_rules = (temp / 'rules.c').read_text()
          compat_sepolicy = (temp / 'sepolicy.c').read_text()
          target_security = Path('security/selinux/include/security.h').read_text()
          target_policydb = Path('security/selinux/ss/policydb.h').read_text()
          kbuild = Path('KernelSU-Next/kernel/Kbuild').read_text()
          selinux_header = (temp / 'v3.4.1-selinux.h').read_text()

          def tokens(source):
              return set(re.findall(r'\bKSU_SEPOLICY_(?:CMD|SUBCMD)_[A-Z0-9_]+\b', source))

          # Keep the v3.4.1 Manager command protocol intact. The compatibility
          # implementation must implement every command the pinned driver had.
          manager_tokens = tokens(original_rules)
          compat_tokens = tokens(compat_rules)
          missing = sorted(manager_tokens - compat_tokens)
          if not manager_tokens:
              raise SystemExit('Cannot find v3.4.1 SELinux command protocol in original rules.c')
          if missing:
              raise SystemExit('SELinux compatibility source lacks v3.4.1 Manager commands: ' + ', '.join(missing))

          # Verify that this target exposes the old SELinux state and policydb
          # structures before altering either implementation file.
          state_match = re.search(r'struct\s+selinux_state\s*\{(.*?)\n\};', target_security, re.S)
          if not state_match or not re.search(r'\bss\b', state_match.group(1)):
              raise SystemExit('Target security.h does not expose selinux_state.ss; refusing compatibility patch')
          if re.search(r'\bpolicy_mutex\b|\bstruct\s+selinux_policy\s*\*\s*policy\b', state_match.group(1)):
              raise SystemExit('Target appears to use modern selinux_state.policy internals, not expected 4.19 state')
          if 'struct flex_array' not in target_policydb and 'flex_array' not in target_policydb:
              raise SystemExit('Target policydb.h does not expose the expected legacy flex_array layout')
          if 'get_policydb(void)' not in compat_rules or 'selinux_state.ss' not in compat_rules:
              raise SystemExit('Pinned compatibility rules.c is missing legacy selinux_state.ss access')
          if 'KSU_SUPPORT_ADD_TYPE' not in compat_sepolicy:
              raise SystemExit('Pinned compatibility sepolicy.c is missing expected policydb implementation')
          # The pinned source implements legacy kernels as the #else branch
          # of the >= 5.7 path; it does not use a separate explicit #if < 5.7.
          # Validate the branch and the actual Linux 4.19 legacy API instead
          # of requiring one exact preprocessor spelling.
          filename_trans_match = re.search(
              r'static\s+bool\s+add_filename_trans\s*\([^;]*?\)\s*\{(.*?)\n\}',
              compat_sepolicy,
              re.S,
          )
          if not filename_trans_match:
              raise SystemExit('Cannot isolate add_filename_trans() in pinned sepolicy.c')
          filename_trans_body = filename_trans_match.group(1)
          has_modern_branch = re.search(
              r'#if\s+LINUX_VERSION_CODE\s*>=\s*KERNEL_VERSION\(5,\s*7,\s*0\)',
              filename_trans_body,
          )
          has_legacy_else = re.search(r'#else\s*//\s*<\s*5\.7\.0\b', filename_trans_body)
          has_legacy_key = re.search(r'\bstruct\s+filename_trans\s+key\b', filename_trans_body)
          has_legacy_table = re.search(r'\bfilename_trans_ttypes\b', filename_trans_body)
          has_legacy_insert = re.search(
              r'hashtab_insert\s*\(\s*db->filename_trans\s*,\s*new_key\s*,\s*trans\s*\)',
              filename_trans_body,
          )
          if not all((has_modern_branch, has_legacy_else, has_legacy_key, has_legacy_table, has_legacy_insert)):
              raise SystemExit(
                  'Pinned sepolicy.c lacks the expected Linux 4.19 filename-transition fallback '
                  '(>=5.7 selector, legacy #else, struct filename_trans, filename_trans_ttypes, '
                  'or 3-argument hashtab_insert)'
              )
          if 'KSU_NEXT_MANAGER_SIZE := 0x3e6' not in kbuild:
              raise SystemExit('v3.4.1 Manager size metadata changed unexpectedly')
          if 'KSU_NEXT_MANAGER_HASH := 79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7' not in kbuild:
              raise SystemExit('v3.4.1 Manager signature hash changed unexpectedly')
          if not re.search(r'^\s*#define\s+KERNEL_SU_DOMAIN\s+"ksu"', selinux_header, re.M):
              raise SystemExit('v3.4.1 KERNEL_SU_DOMAIN="ksu" was not preserved')

          # Force the compatibility selector for this Linux 4.19 build only.
          # Do not change Kbuild, Manager metadata, UAPI, or any other driver file.
          marker = '#include "selinux.h"'
          if compat_rules.count(marker) != 1:
              raise SystemExit('Cannot find unique selinux.h include in compatibility rules.c')
          compat_rules = compat_rules.replace(
              marker,
              marker + '\n#ifndef KSU_COMPAT_USE_SELINUX_STATE\n#define KSU_COMPAT_USE_SELINUX_STATE 1\n#endif',
              1,
          )
          if '#define KSU_COMPAT_USE_SELINUX_STATE 1' not in compat_rules:
              raise SystemExit('Failed to enable the Linux 4.19 selinux_state.ss selector')

          # Confirm all expected legacy API guards are present before replacing files.
          if 'flex_array_get_ptr' not in compat_sepolicy or 'flex_array_put_ptr' not in compat_sepolicy:
              raise SystemExit('Legacy avtab flex_array compatibility code is missing')
          if 'filename_trans' not in compat_sepolicy:
              raise SystemExit('Legacy filename transition code is missing')

          (ksu / 'rules.c').write_text(compat_rules)
          (ksu / 'sepolicy.c').write_text(compat_sepolicy)

          report = [
              'KernelSU-Next SELinux compatibility report',
              'Target: Samsung Galaxy A13 SM-A135F / Exynos850 / Linux 4.19.325',
              'Driver/Kbuild/Manager identity: official KernelSU-Next v3.4.1; expected Manager build 33333',
              f'Compatibility source commit: {__import__("os").environ["KSU_SELINUX_COMPAT_REF"]}',
              'Changed files: KernelSU-Next/kernel/selinux/rules.c and sepolicy.c only',
              'Preserved: v3.4.1 Kbuild, Manager size/hash, selinux.h, UAPI, and all non-SELinux driver files',
              'Compatibility selector: KSU_COMPAT_USE_SELINUX_STATE=1 (target kernel provides selinux_state.ss)',
              'Manager SELinux protocol tokens: ' + ', '.join(sorted(manager_tokens)),
              'Original rules.c SHA256: ' + hashlib.sha256(original_rules.encode()).hexdigest(),
              'Compatibility rules.c SHA256: ' + hashlib.sha256(compat_rules.encode()).hexdigest(),
              'Compatibility sepolicy.c SHA256: ' + hashlib.sha256(compat_sepolicy.encode()).hexdigest(),
              'NOTE: static/source preflight only; successful compile is still required.',
          ]
          Path('selinux-compatibility-report.log').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
          PYSELINUX

          git diff --no-index -- "$RUNNER_TEMP/ksu-selinux-compat/v3.4.1-rules.c" "$KSU_DIR/rules.c" > selinux-rules-compat.diff || test "$?" -eq 1
          git diff --no-index -- "$RUNNER_TEMP/ksu-selinux-compat/v3.4.1-sepolicy.c" "$KSU_DIR/sepolicy.c" > selinux-sepolicy-compat.diff || test "$?" -eq 1
          echo "SELinux compatibility sources staged; official driver tag remains ${KSU_TAG} / Manager ${KSU_EXPECTED_VERSION}."

      - name: Adapt official KernelSU-Next file wrapper for Samsung 4.19 VFS API
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("KernelSU-Next/kernel/infra/file_wrapper.c")
          header_path = Path("include/linux/fs.h")
          if not source_path.is_file() or not header_path.is_file():
              raise SystemExit("KernelSU-Next file_wrapper.c or kernel fs.h is missing")

          source = source_path.read_text()
          header = header_path.read_text()
          match = re.search(
              r"struct file_operations\s*\{(.*?)\}\s*(?:__randomize_layout)?\s*;",
              header,
              flags=re.S,
          )
          if not match:
              raise SystemExit("Could not inspect struct file_operations in include/linux/fs.h")
          fops = match.group(1)

          def has_member(name):
              return re.search(r"\(\s*\*\s*" + re.escape(name) + r"\s*\)", fops) is not None

          changed = []

          # Some Samsung 4.19 trees omit iopoll despite the nominal kernel version.
          if not has_member("iopoll"):
              pattern = re.compile(
                  r"#if LINUX_VERSION_CODE >= KERNEL_VERSION\(6, 1, 0\)\s*\n"
                  r"static int ksu_wrapper_iopoll\(.*?\n#endif\s*\n",
                  flags=re.S,
              )
              source, count = pattern.subn("", source, count=1)
              if count != 1:
                  raise SystemExit("Could not isolate the official iopoll wrapper block")
              source, count = re.subn(
                  r"^[ \t]*p->ops\.iopoll\s*=\s*fp->f_op->iopoll\s*\?\s*"
                  r"ksu_wrapper_iopoll\s*:\s*NULL;[ \t]*\n",
                  "",
                  source,
                  count=1,
                  flags=re.M,
              )
              if count != 1:
                  raise SystemExit("Could not remove the unavailable iopoll assignment")
              changed.append("omitted iopoll (not present in target file_operations)")

          # The target 4.19 tree exposes clone/dedupe callbacks instead of remap_file_range.
          if not has_member("remap_file_range"):
              if not has_member("clone_file_range") or not has_member("dedupe_file_range"):
                  raise SystemExit(
                      "Target fs.h has no remap_file_range and does not expose both "
                      "clone_file_range/dedupe_file_range; refusing an unsafe compatibility edit"
                  )

              start_marker = "// no REMAP_FILE_DEDUP: use file_in"
              end_marker = "static int ksu_wrapper_fadvise("
              start = source.find(start_marker)
              end = source.find(end_marker, start + 1) if start >= 0 else -1
              if start < 0 or end < 0:
                  if "ksu_wrapper_clone_file_range" not in source or "ksu_wrapper_dedupe_file_range" not in source:
                      raise SystemExit("Could not locate official remap wrapper block for 4.19 adaptation")
              else:
                  legacy_wrappers = r'''static int ksu_wrapper_clone_file_range(struct file *file_in, loff_t pos_in,
                                               struct file *file_out, loff_t pos_out,
                                               u64 len)
          {
              struct ksu_file_wrapper *data = file_in->private_data;
              struct file *orig = data->orig;
              if (!orig->f_op->clone_file_range) {
                  return -EOPNOTSUPP;
              }
              return orig->f_op->clone_file_range(orig, pos_in, file_out, pos_out, len);
          }

          static int ksu_wrapper_dedupe_file_range(struct file *file_in, loff_t pos_in,
                                                  struct file *file_out, loff_t pos_out,
                                                  u64 len)
          {
              struct ksu_file_wrapper *data = file_out->private_data;
              struct file *orig = data->orig;
              if (!orig->f_op->dedupe_file_range) {
                  return -EOPNOTSUPP;
              }
              return orig->f_op->dedupe_file_range(file_in, pos_in, orig, pos_out, len);
          }

                  '''
                  source = source[:start] + legacy_wrappers + source[end:]

              assignment = re.compile(
                  r"^[ \t]*p->ops\.remap_file_range\s*=\s*\n"
