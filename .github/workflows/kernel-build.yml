          from pathlib import Path

          # 1) Linux 4.19 Samsung source has no include/uapi/linux/mount.h.
          # linux/fs.h already includes uapi/linux/fs.h, which defines MS_PRIVATE/MS_REC.
          mount_path = Path("KernelSU-Next/kernel/infra/su_mount_ns.c")
