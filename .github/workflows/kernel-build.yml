name: A13 KernelSU-Next SUSFS 4.19 Build

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next-v3.4.1

permissions:
  contents: read

concurrency:
  group: a13-ksun-susfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      DEFCONFIG: exynos850-a13nsxx_defconfig
      KSU_REPO: https://github.com/SuleMareVientu/KernelSU-Next.git
      KSU_BRANCH: next-susfs-4.19
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19
      CROSS_COMPILE: aarch64-linux-gnu-
      LLVM: "1"
      LLVM_IAS: "1"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git patch \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libelf-dev libncurses-dev libssl-dev python3 python-is-python3 \
            rsync dwarves zstd lz4 zip unzip xz-utils

      - name: Install Android Clang r450784e
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang-r450784e"
          mkdir -p "$CLANG_DIR"
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784e.tar.gz' \
            -o "$RUNNER_TEMP/clang-r450784e.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang-r450784e.tar.gz" -C "$CLANG_DIR"
          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version
          "$CLANG_DIR/bin/ld.lld" --version

      - name: Verify target kernel source
        run: |
          set -euo pipefail
          test -f Makefile
          test -f "arch/arm64/configs/$DEFCONFIG"
          KERNEL_VERSION="$(make -s kernelversion)"
          echo "Target kernel version: $KERNEL_VERSION"
          if [ "$KERNEL_VERSION" != "4.19.325" ]; then
            echo "Expected Linux 4.19.325, got $KERNEL_VERSION" >&2
            exit 1
          fi

      - name: Integrate Linux 4.19-compatible KernelSU-Next source
        run: |
          set -euo pipefail
          rm -rf KernelSU-Next
          git clone --single-branch --branch "$KSU_BRANCH" \
            "$KSU_REPO" KernelSU-Next

          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile
          test -f KernelSU-Next/kernel/ksu.c

          # This source tree carries the expected KernelSU-Next Manager signature.
          grep -Fq \
            '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7' \
            KernelSU-Next/kernel/Makefile || {
              echo "Manager v3.4.1 signature hash not found in selected KernelSU source" >&2
              exit 1
            }

          # Remove only the old integration link/directory in the working tree.
          if [ -L drivers/kernelsu ] || [ -d drivers/kernelsu ]; then
            rm -rf drivers/kernelsu
          fi
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          python3 - <<'PYKCONFIG'
          from pathlib import Path
          path = Path("drivers/Kconfig")
          data = path.read_text()
          source_line = 'source "drivers/kernelsu/Kconfig"'
          if source_line not in data:
              marker = "endmenu"
              index = data.rfind(marker)
              if index < 0:
                  raise SystemExit("Could not find final endmenu in drivers/Kconfig")
              data = data[:index] + source_line + "\n" + data[index:]
              path.write_text(data)
          PYKCONFIG

          echo "KernelSU-Next branch: $KSU_BRANCH"
          echo "KernelSU-Next commit: $(git -C KernelSU-Next rev-parse --short HEAD)"
          echo "KernelSU-Next commit count: $(git -C KernelSU-Next rev-list --count HEAD)"

      - name: Fetch SUSFS kernel-4.19 sources
        run: |
          set -euo pipefail
          rm -rf SUSFS
          git clone --depth=1 --single-branch --branch "$SUSFS_BRANCH" \
            "$SUSFS_REPO" SUSFS

          test -f SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          test -f SUSFS/kernel_patches/fs/susfs.c
          test -f SUSFS/kernel_patches/include/linux/susfs.h
          test -f SUSFS/kernel_patches/include/linux/susfs_def.h

          install -m 0644 SUSFS/kernel_patches/fs/susfs.c fs/susfs.c
          install -m 0644 SUSFS/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          install -m 0644 SUSFS/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

          # SUSFS 4.19 patches are applied only after a successful dry-run.
          PATCH_FILE="SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
          if grep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile \
             && grep -Fq 'susfs_task_state' include/linux/sched.h \
             && grep -Fq 'susfs_mnt_id_backup' include/linux/mount.h \
             && grep -Fq 'CONFIG_KSU_SUSFS_SUS_PATH' fs/dcache.c; then
            echo "SUSFS kernel patch markers already present; skipping duplicate application."
          else
            if grep -Fq 'susfs_task_state' include/linux/sched.h \
               || grep -Fq 'susfs_mnt_id_backup' include/linux/mount.h \
               || grep -Fq 'CONFIG_KSU_SUSFS_SUS_PATH' fs/dcache.c; then
              echo "Partial SUSFS patch detected. Refusing to apply on top of a partial patch." >&2
              exit 1
            fi
            patch --batch --forward --dry-run -p1 < "$PATCH_FILE"
            patch --batch --forward -p1 < "$PATCH_FILE"
          fi

          grep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h
          echo "SUSFS kernel-4.19 patch and source files verified."

      - name: Configure kernel and KernelSU-Next
        run: |
          set -euo pipefail
          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" "$DEFCONFIG"

          # Keep the user's requested local version and ensure required dependencies.
          scripts/config --file .config --enable KSU
          scripts/config --file .config --enable OVERLAY_FS
          scripts/config --file .config --enable KPROBES
          scripts/config --file .config --enable KPROBE_EVENTS
          scripts/config --file .config --enable EXT4_FS
          scripts/config --file .config --enable KSU_SUSFS
          scripts/config --file .config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          scripts/config --file .config --set-str LOCALVERSION '-MAX-ARAF'
          scripts/config --file .config --disable LOCALVERSION_AUTO

          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" olddefconfig

          for option in \
            CONFIG_KSU=y \
            CONFIG_OVERLAY_FS=y \
            CONFIG_KPROBES=y \
            CONFIG_KPROBE_EVENTS=y \
            CONFIG_EXT4_FS=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y; do
            if ! grep -qx "$option" .config; then
              echo "Required kernel config is missing: $option" >&2
              exit 1
            fi
          done

          grep -q '^CONFIG_LOCALVERSION="-MAX-ARAF"$' .config
          echo "KernelSU-Next, SUSFS and required kernel configs verified."

      - name: Generate SELinux headers
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" scripts 2>&1 | tee scripts-build.log

          test -x scripts/selinux/genheaders/genheaders
          scripts/selinux/genheaders/genheaders \
            security/selinux/flask.h security/selinux/av_permissions.h
          test -s security/selinux/flask.h
          test -s security/selinux/av_permissions.h
          echo "SELinux headers generated successfully."

      - name: Preflight compile KernelSU-Next
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" drivers/kernelsu/ \
            2>&1 | tee ksu-preflight.log

      - name: Build kernel Image.gz and DTBs
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" Image.gz dtbs \
            2>&1 | tee kernel-build.log
          test -s arch/arm64/boot/Image.gz

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-SUSFS-MAX-ARAF-${{ github.run_number }}
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/
            .config
            ksu-preflight.log
            kernel-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-SUSFS-diagnostics-${{ github.run_number }}
          path: |
            scripts-build.log
            ksu-preflight.log
            kernel-build.log
            .config
            SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          if-no-files-found: warn
          retention-days: 7
