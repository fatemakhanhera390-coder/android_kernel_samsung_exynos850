                  raise SystemExit('No task_pgrp API and no verified legacy signal->pids layout in target headers')
              helper = (
                  '/* KSU_NEXT_419_TASK_PGRP_COMPAT */\n'
                  'static inline struct pid *ksu_legacy_task_pgrp(struct task_struct *task)\n'
                  '{ return task->signal->pids[PIDTYPE_PGID]; }\n'
              )
              if 'ksu_legacy_task_pgrp' not in s:
                  s = s.replace('static int do_set_init_pgrp(', helper + '\nstatic int do_set_init_pgrp(', 1)
              s = re.sub(r'\btask_pgrp\s*\(', 'ksu_legacy_task_pgrp(', s)
              print('dispatch.c: added verified legacy task_pgrp helper')

          if not re.search(r'\btask_session\s*\(', sched_headers):
              if not re.search(r'\bstruct\s+pid\s*\*\s*pids\s*\[\s*PIDTYPE_MAX\s*\]', sched_headers):
                  raise SystemExit('No task_session API and no verified legacy signal->pids layout in target headers')
              helper = (
                  '/* KSU_NEXT_419_TASK_SESSION_COMPAT */\n'
                  'static inline struct pid *ksu_legacy_task_session(struct task_struct *task)\n'
                  '{ return task->signal->pids[PIDTYPE_SID]; }\n'
              )
              if 'ksu_legacy_task_session' not in s:
                  s = s.replace('static int do_set_init_pgrp(', helper + '\nstatic int do_set_init_pgrp(', 1)
              s = re.sub(r'\btask_session\s*\(', 'ksu_legacy_task_session(', s)
              print('dispatch.c: added verified legacy task_session helper')

          # Declarations may be hidden by a downstream header variant even though
          # the actual kernel symbols exist. Add externs only if all headers omit them.
          if not re.search(r'\btasklist_lock\b', sched_headers):
              s = s.replace('#include <linux/spinlock.h>', '#include <linux/spinlock.h>\nextern rwlock_t tasklist_lock;', 1)
          if not re.search(r'\binit_task\b', sched_headers):
              s = s.replace('#include <linux/spinlock.h>', '#include <linux/spinlock.h>\nextern struct task_struct init_task;', 1)
          p.write_text(s)
          print('dispatch.c: added legacy task/pid includes and API checks')

          # 5) v3.4.1's SELinux-hide optional feature relies on fields absent from
          # SELinux's Linux 4.19 selinux_state (status_lock/status_page/policy).
          # Keep all five public entry points, but make this OPTIONAL hiding feature
          # a no-op on <5.0. Core SELinux rule application and Manager ABI are separate.
          p = Path('KernelSU-Next/kernel/feature/selinux_hide.c')
          if not p.is_file():
              raise SystemExit('Required source missing: KernelSU-Next/kernel/feature/selinux_hide.c')
          s = p.read_text()
          marker = '/* KSU_NEXT_419_SELINUX_HIDE_STUB */'
          if marker not in s:
              stub = '''#include <linux/version.h>
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)
          /* KSU_NEXT_419_SELINUX_HIDE_STUB */
          #include "selinux_hide.h"
          void ksu_selinux_hide_init(void) {}
          void ksu_selinux_hide_exit(void) {}
          void ksu_selinux_hide_drop_backup_if_unused(void) {}
          void ksu_selinux_hide_handle_second_stage(void) {}
          void ksu_selinux_hide_handle_post_fs_data(void) {}
          #else
          '''
              s = stub + s + '\n#endif /* Linux 4.19: SELinux-hide implementation is not API-compatible */\n'
          required_stubs = (
              'void ksu_selinux_hide_init(void)',
              'void ksu_selinux_hide_exit(void)',
              'void ksu_selinux_hide_drop_backup_if_unused(void)',
              'void ksu_selinux_hide_handle_second_stage(void)',
              'void ksu_selinux_hide_handle_post_fs_data(void)',
          )
          if marker not in s or not s.rstrip().endswith('#endif /* Linux 4.19: SELinux-hide implementation is not API-compatible */'):
              raise SystemExit('selinux_hide.c: compatibility guard failed verification')
          for item in required_stubs:
              if item not in s:
                  raise SystemExit(f'selinux_hide.c: missing compatibility stub {item}')
          p.write_text(s)
          print('selinux_hide.c: added Linux 4.19 no-op stubs for optional SELinux-hide feature')

          # Ensure core identity has not been edited during compatibility work.
          kbuild = Path('KernelSU-Next/kernel/Kbuild').read_text()
          if 'KSU_NEXT_MANAGER_SIZE := 0x3e6' not in kbuild:
              raise SystemExit('Manager size changed during 4.19 compatibility patch')
          if 'KSU_NEXT_MANAGER_HASH := 79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7' not in kbuild:
              raise SystemExit('Manager signature hash changed during 4.19 compatibility patch')
          print('Verified: official v3.4.1 Manager signature metadata is unchanged.')
          Path('ksu-linux-419-api-compatibility.log').write_text(
              'Target: Samsung Galaxy A13 SM-A135F / Linux 4.19.325\n'
              'Manager/driver: official KernelSU-Next v3.4.1, build 33333\n'
              'Removed unavailable compat/kernel_compat.h includes from the pinned SELinux backport; '
              'the 4.19 path is explicitly selected by the preceding step.\n'
              'SULog min/max header mapped to linux/kernel.h.\n'
              'task_work_add() checked against target task_work.h; TWA_RESUME replaced only for bool-notify API.\n'
              'dispatch.c includes legacy task/pid declarations and checks target helper availability.\n'
              'Optional SELinux-hide implementation disabled on Linux <5.0 because its required selinux_state fields '
              'are absent; public entry points retained as no-op stubs.\n'
              'KSU_NEXT_MANAGER_SIZE and KSU_NEXT_MANAGER_HASH verified unchanged.\n'
          )
          PYKSU419

      - name: Apply SUSFS with conservative compatibility mode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf SUSFS
          git clone --depth=1 --single-branch --branch "$SUSFS_BRANCH" "$SUSFS_REPO" SUSFS

          PATCH_FILE="SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
          test -s "$PATCH_FILE"
          test -s SUSFS/kernel_patches/fs/susfs.c
          test -s SUSFS/kernel_patches/include/linux/susfs.h
          test -s SUSFS/kernel_patches/include/linux/susfs_def.h

          install -m 0644 SUSFS/kernel_patches/fs/susfs.c fs/susfs.c
          install -m 0644 SUSFS/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          install -m 0644 SUSFS/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

          python3 - <<'PYPATCH'
          from pathlib import Path

          source = Path("SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch")
          target = Path("susfs-kernel-4.19-adapted.patch")
          skip_files = {"fs/namespace.c", "include/linux/mount.h"}
          skip_hunks = {
              "fs/dcache.c": {2189},
              "fs/proc/task_mmu.c": {20},
              "include/linux/sched.h": {1509},
              "kernel/sys.c": {1240},
          }
          skipped_files = set()
          skipped_hunks = {name: 0 for name in skip_hunks}
          current_file = ""
          skip_file = False
          skip_hunk = False
          output = []

          for line in source.read_text().splitlines(keepends=True):
              if line.startswith("diff --git "):
                  current_file = line.split(" b/", 1)[1].strip()
                  skip_file = current_file in skip_files
                  skip_hunk = False
                  if skip_file:
                      skipped_files.add(current_file)
                  else:
                      output.append(line)
                  continue

              if skip_file:
                  continue

              if line.startswith("@@ "):
                  skip_hunk = False
                  fields = line.split()
                  old_token = fields[1] if len(fields) > 1 else ""
                  try:
                      old_start = int(old_token.split(",", 1)[0].lstrip("-"))
                  except ValueError:
                      old_start = -1

                  if old_start in skip_hunks.get(current_file, set()):
                      skipped_hunks[current_file] += 1
                      skip_hunk = True
                      continue
                  output.append(line)
                  continue

              if not skip_hunk:
                  output.append(line)

          if skipped_files != skip_files:
              raise SystemExit(f"Patch layout changed; skipped file sections {skipped_files}, expected {skip_files}")
          for name, count in skipped_hunks.items():
              if count != 1:
                  raise SystemExit(f"Patch layout changed for {name}: skipped {count} hunks, expected exactly 1")

          target.write_text("".join(output))
          print("Prepared conservative SUSFS patch; omitted known incompatible hooks.")
          print(f"Omitted file sections: {', '.join(sorted(skipped_files))}")
          for name, count in skipped_hunks.items():
              print(f"Omitted {name} hunk(s): {count}")
          PYPATCH

          if ! patch --batch --forward --fuzz=2 -p1 \
              --dry-run < susfs-kernel-4.19-adapted.patch > susfs-patch-dry-run.log 2>&1; then
            cat susfs-patch-dry-run.log
            echo "Compatible SUSFS hunks failed dry-run; kernel source was not patched by this step." >&2
            exit 1
          fi
          cat susfs-patch-dry-run.log
          patch --batch --forward --fuzz=2 -p1 \
            < susfs-kernel-4.19-adapted.patch 2>&1 | tee susfs-patch.log

          python3 - <<'PYSUSFS'
          from pathlib import Path
          import re

          def read(name):
              p = Path(name)
              if not p.is_file():
                  raise SystemExit(f"Required source missing: {name}")
              return p.read_text()

          def write(name, content):
              Path(name).write_text(content)

          name = "fs/dcache.c"
          s = read(name)
          if "#include <linux/susfs_def.h>" not in s:
              anchor = "#include <linux/list_lru.h>"
              if anchor not in s:
                  raise SystemExit("dcache.c: include anchor not found")
              s = s.replace(
                  anchor,
                  anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n#include <linux/susfs_def.h>\n#endif",
                  1,
              )
          fn = re.search(r"struct dentry \*__d_lookup_rcu\b.*?\n\}", s, flags=re.S)
          if not fn:
              raise SystemExit("dcache.c: __d_lookup_rcu() not found")
          body = fn.group(0)
          marker = "TASK_STRUCT_NON_ROOT_USER_APP_PROC"
          if marker not in body:
              anchor = re.search(
                  r"if \(dentry_cmp\(dentry, str, hashlen_len\(hashlen\)\) != 0\)\s*\n\s*continue;\s*\n",
                  body,
              )
              if not anchor:
                  raise SystemExit("dcache.c: dentry_cmp() insertion anchor not found")
              check = (
                  "\t\t#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\t\tif (dentry->d_inode && unlikely(dentry->d_inode->i_state & INODE_STATE_SUS_PATH) && "
                  "likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC)) {\n"
                  "\t\t\tcontinue;\n"
                  "\t\t}\n"
                  "\t\t#endif\n"
              )
              body = body[:anchor.end()] + check + body[anchor.end():]
              s = s[:fn.start()] + body + s[fn.end():]
          write(name, s)

          name = "fs/proc/task_mmu.c"
          s = read(name)
          if "#include <linux/susfs_def.h>" not in s:
              anchor = "#include <linux/mm_inline.h>"
              if anchor in s:
                  s = s.replace(anchor, anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif", 1)
              else:
                  anchor = "#include <asm/elf.h>"
                  if anchor not in s:
                      raise SystemExit("task_mmu.c: no known include anchor found")
                  s = s.replace(anchor, "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n" + anchor, 1)
          write(name, s)

          name = "kernel/sys.c"
          s = read(name)
          marker = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
          start = s.find(marker)
          if start < 0:
              raise SystemExit("sys.c: newuname syscall anchor not found")
          old_uname = s.find("#ifdef __ARCH_WANT_SYS_OLD_UNAME", start)
          if old_uname < 0:
              old_uname = len(s)
          body = s[start:old_uname]
          if "susfs_spoof_uname(&tmp);" not in body:
              if "extern void susfs_spoof_uname(struct new_utsname *tmp);" not in s:
                  prototype = "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern void susfs_spoof_uname(struct new_utsname *tmp);\n#endif\n\n"
                  s = s[:start] + prototype + s[start:]
                  start = s.find(marker)
                  old_uname = s.find("#ifdef __ARCH_WANT_SYS_OLD_UNAME", start)
                  if old_uname < 0:
                      old_uname = len(s)
                  body = s[start:old_uname]
              up = re.search(r"^[ \t]*up_read\(&uts_sem\);", body, flags=re.M)
              if not up:
                  raise SystemExit("sys.c: up_read(&uts_sem) anchor not found in newuname")
              call = "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif\n"
              body = body[:up.start()] + call + body[up.start():]
              s = s[:start] + body + s[old_uname:]
          write(name, s)

          for marker_file, marker in {
              "fs/Makefile": "obj-$(CONFIG_KSU_SUSFS) += susfs.o",
              "fs/dcache.c": "TASK_STRUCT_NON_ROOT_USER_APP_PROC",
              "fs/proc/task_mmu.c": "#include <linux/susfs_def.h>",
              "kernel/sys.c": "susfs_spoof_uname(&tmp);",
              "include/linux/sched.h": "susfs_task_state",
          }.items():
              if marker not in read(marker_file):
                  raise SystemExit(f"SUSFS verification failed: {marker_file}: {marker}")

          if "susfs_mnt_id_backup" in read("include/linux/mount.h"):
              raise SystemExit("Mount-ID field unexpectedly present in conservative mode")
          if list(Path(".").rglob("*.rej")):
              raise SystemExit("Unresolved patch reject files remain")

          Path("susfs-compatibility.log").write_text(
              "SUSFS kernel-side conservative mode: selected hunks applied; mount-ID spoofing/namespace features omitted; KSU prctl command protocol audited separately.\n"
          )
          print("SUSFS compatible hunks applied and manual anchors verified.")
          PYSUSFS

      - name: Port SUSFS v4.19 prctl command interface into official KernelSU-Next v3.4.1
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "ERROR at line %s (exit=%s)\\n" "$LINENO" "$rc" >&2; exit "$rc"' ERR
          python3 - <<'PYSUSFSPORT'
          from pathlib import Path
          import re

          patch_path = Path("SUSFS/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch")
          susfs_header = Path("include/linux/susfs.h")
          susfs_defs = Path("include/linux/susfs_def.h")
          sys_path = Path("kernel/sys.c")
          kbuild_path = Path("KernelSU-Next/kernel/Kbuild")
          for path in (patch_path, susfs_header, susfs_defs, sys_path, kbuild_path):
              if not path.is_file():
                  raise SystemExit(f"Required SUSFS prctl port source missing: {path}")

          patch_lines = patch_path.read_text().splitlines()
          begin = None
          for i in range(len(patch_lines) - 1):
              if patch_lines[i].strip() == "+#ifdef CONFIG_KSU_SUSFS" and re.match(r"^\+\s*if\s*\(\s*current_uid_val\s*==\s*0\s*\)\s*\{", patch_lines[i + 1]):
                  begin = i
                  break
          if begin is None:
              raise SystemExit("Could not locate the SUSFS prctl dispatch block in the pinned SUSFS 4.19 patch")
          finish = None
          for i in range(begin + 2, len(patch_lines)):
              if re.match(r"^\+\s*#endif\s*//\s*#ifdef\s+CONFIG_KSU_SUSFS\b", patch_lines[i].strip()):
                  finish = i
                  break
          if finish is None:
              raise SystemExit("SUSFS prctl dispatch block has no matching CONFIG_KSU_SUSFS end marker")
          fragment_lines = []
          for line in patch_lines[begin:finish + 1]:
              if not line.startswith("+") or line.startswith("+++"):
                  raise SystemExit("SUSFS prctl command block contains patch context/deletion; refusing unsafe extraction")
              fragment_lines.append(line[1:])
          fragment = "\n".join(fragment_lines)
          required_commands = (
              "CMD_SUSFS_ADD_SUS_PATH",
              "CMD_SUSFS_SHOW_ENABLED_FEATURES",
              "CMD_SUSFS_SHOW_VERSION",
              "CMD_SUSFS_SHOW_VARIANT",
              "CMD_SUSFS_ADD_OPEN_REDIRECT",
              "CMD_SUSFS_SET_UNAME",
          )
          for command in required_commands:
              if command not in fragment or command not in susfs_defs.read_text():
                  raise SystemExit(f"SUSFS command/header mismatch; missing {command}")
          fragment = fragment.replace("ksu_access_ok(", "ksu_susfs_access_ok(")

          # Preserve the command block's legacy switch semantics in a standalone function:
          # recognized cases that break out of the switch return success; unknown commands fail closed.
          def matching_brace(text, open_pos):
              depth = 0
              state = "code"
              i = open_pos
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""
                  if state == "line_comment":
                      if ch == "\n": state = "code"
                  elif state == "block_comment":
                      if ch == "*" and nxt == "/": state = "code"; i += 1
                  elif state in ("string", "char"):
                      if ch == "\\": i += 1
                      elif (state == "string" and ch == '"') or (state == "char" and ch == "'"):
                          state = "code"
                  else:
                      if ch == "/" and nxt == "/": state = "line_comment"; i += 1
                      elif ch == "/" and nxt == "*": state = "block_comment"; i += 1
                      elif ch == '"': state = "string"
                      elif ch == "'": state = "char"
                      elif ch == "{": depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0: return i
                  i += 1
              raise SystemExit("Unbalanced braces in extracted SUSFS command block")

          sw = re.search(r"\bswitch\s*\(\s*arg2\s*\)\s*\{", fragment)
          if not sw:
              raise SystemExit("Extracted SUSFS block lacks switch(arg2); refusing incomplete port")
          sw_open = fragment.find("{", sw.start(), sw.end())
          sw_close = matching_brace(fragment, sw_open)
          switch_body = fragment[sw_open + 1:sw_close]
          default = re.search(r"(?m)^\s*default\s*:", switch_body)
          if default:
              rest = switch_body[default.end():]
              next_label = re.search(r"(?m)^\s*(?:case\b|default\s*:)", rest)
              default_end = default.end() + (next_label.start() if next_label else len(rest))
              default_segment = switch_body[default.end():default_end]
              if "return -ENOTTY;" not in default_segment:
                  terminal = re.search(r"\b(?:break\s*;|return\s+[^;]+;)", default_segment)
                  if not terminal:
                      raise SystemExit("Cannot make the existing SUSFS default case fail closed safely")
                  abs_start = default.end() + terminal.start()
                  abs_end = default.end() + terminal.end()
                  switch_body = switch_body[:abs_start] + "return -ENOTTY;" + switch_body[abs_end:]
          else:
              switch_body += "\n                default: return -ENOTTY;\n            "
          fragment = fragment[:sw_open + 1] + switch_body + fragment[sw_close:]
          sw = re.search(r"\bswitch\s*\(\s*arg2\s*\)\s*\{", fragment)
          sw_open = fragment.find("{", sw.start(), sw.end())
          sw_close = matching_brace(fragment, sw_open)
          # Ensure switch is the last statement inside the root-UID guard before inserting success.
          tail = fragment[sw_close + 1:]
          if not re.match(r"\s*\}\s*#endif\b", tail):
              raise SystemExit("SUSFS command block layout differs after switch(arg2); refusing to guess success semantics")
          fragment = fragment[:sw_close + 1] + "\n                return 0;" + fragment[sw_close + 1:]

          handler_path = Path("KernelSU-Next/kernel/feature/susfs_compat.c")
          handler_marker = "KSU_NEXT_SUSFS_PRCTL_COMPAT"
          if not handler_path.exists():
              prelude = r'''/* KSU_NEXT_SUSFS_PRCTL_COMPAT
           * Version-matched SUSFS prctl command bridge for KernelSU-Next v3.4.1.
           * The legacy SUSFS patch's command block is ported, not blindly applied.
           */
          #include <linux/cred.h>
          #include <linux/errno.h>
          #include <linux/printk.h>
          #include <linux/susfs.h>
          #include <linux/susfs_def.h>
          #include <linux/types.h>
          #include <linux/uaccess.h>
          #include <linux/version.h>

          static bool ksu_susfs_access_ok(const void __user *addr, size_t size)
          {
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)
              return access_ok(VERIFY_READ, addr, size) || access_ok(VERIFY_WRITE, addr, size);
          #else
              return access_ok(addr, size);
          #endif
          }

          int ksu_susfs_handle_prctl(unsigned long arg2, unsigned long arg3,
                                     unsigned long arg4, unsigned long arg5)
          {
              uid_t current_uid_val = current_uid().val;
              (void)arg4;
              pr_info_ratelimited("KernelSU-Next: SUSFS prctl dispatcher reached\n");
          '''
              postlude = r'''
              return -ENOTTY;
          }
          '''
              handler_path.write_text(prelude + "\n" + fragment + "\n" + postlude)
          else:
              raise SystemExit("susfs_compat.c already exists before port generation; clean checkout expected, refusing unsafe regeneration")

          handler = handler_path.read_text()
          for command in required_commands:
              if command not in handler:
                  raise SystemExit(f"Generated SUSFS prctl bridge missing command {command}")
          if "ksu_access_ok(" in handler:
              raise SystemExit("Legacy ksu_access_ok call remains in the v3.4.1 port")
          if "return -ENOTTY;" not in handler or "current_uid_val == 0" not in handler:
              raise SystemExit("Generated SUSFS command bridge lacks unknown-command or root-UID guard")

          # Link helper into the existing built-in KernelSU-Next composite object only when SUSFS is enabled.
          kbuild = kbuild_path.read_text()
          kbuild_marker = "KSU_NEXT_SUSFS_PRCTL_COMPAT_KBUILD"
          if kbuild_marker not in kbuild:
              anchor = "kernelsu-objs += feature/selinux_hide.o"
              if kbuild.count(anchor) != 1:
                  raise SystemExit("Could not find unique KernelSU-Next Kbuild feature anchor")
              addition = (anchor + "\n\n# " + kbuild_marker + "\n"
                          "ifeq ($(CONFIG_KSU_SUSFS),y)\n"
                          "kernelsu-objs += feature/susfs_compat.o\n"
                          "endif\n")
              kbuild = kbuild.replace(anchor, addition, 1)
              kbuild_path.write_text(kbuild)
          if "feature/susfs_compat.o" not in kbuild_path.read_text():
              raise SystemExit("SUSFS prctl bridge is not linked by KernelSU-Next Kbuild")

          # Hook the reserved KernelSU/SUSFS prctl option in the real Linux 4.19 prctl syscall.
          sys_source = sys_path.read_text()
          dispatch_marker = "KSU_NEXT_SUSFS_PRCTL_DISPATCH"
          if dispatch_marker not in sys_source:
              func = sys_source.find("SYSCALL_DEFINE5(prctl")
              if func < 0:
                  raise SystemExit("Could not find SYSCALL_DEFINE5(prctl) in kernel/sys.c")
              switch = re.search(r"\bswitch\s*\(\s*option\s*\)", sys_source[func:])
              if not switch:
                  raise SystemExit("Could not find prctl option switch in kernel/sys.c")
              switch_pos = func + switch.start()
              prototype = ("#ifdef CONFIG_KSU_SUSFS\n"
                           "extern int ksu_susfs_handle_prctl(unsigned long arg2, unsigned long arg3, "
                           "unsigned long arg4, unsigned long arg5);\n"
                           "#endif\n\n")
              if "extern int ksu_susfs_handle_prctl(" not in sys_source:
                  sys_source = sys_source[:func] + prototype + sys_source[func:]
                  func = sys_source.find("SYSCALL_DEFINE5(prctl")
                  switch = re.search(r"\bswitch\s*\(\s*option\s*\)", sys_source[func:])
                  switch_pos = func + switch.start()
              dispatch = r'''#ifdef CONFIG_KSU_SUSFS
              /* KSU_NEXT_SUSFS_PRCTL_DISPATCH: KERNEL_SU_OPTION 0xDEADBEEF */
              if ((unsigned int)option == 0xDEADBEEFU)
                  return ksu_susfs_handle_prctl(arg2, arg3, arg4, arg5);
          #endif

          '''
              sys_source = sys_source[:switch_pos] + dispatch + sys_source[switch_pos:]
              sys_path.write_text(sys_source)
          verify_sys = sys_path.read_text()
          if verify_sys.count(dispatch_marker) != 1 or "return ksu_susfs_handle_prctl(arg2, arg3, arg4, arg5);" not in verify_sys:
              raise SystemExit("kernel/sys.c SUSFS prctl dispatch failed verification")

          report = [
              "SUSFS prctl command bridge port",
              "KernelSU-Next: official v3.4.1 (driver 33333) retained; no alternate KSU source substituted.",
              "Port source: KernelSU-Next-compatible extraction of SUSFS kernel-4.19 10_enable_susfs_for_ksu.patch command block.",
              "Dispatcher: kernel/sys.c SYSCALL_DEFINE5(prctl), KERNEL_SU_OPTION 0xDEADBEEF only.",
              "Authorization: SUSFS command block only acts for current_uid().val == 0.",
              "Unknown SUSFS command returns -ENOTTY; command errors are returned through arg5 per SUSFS protocol.",
              "Features compiled only under existing CONFIG_KSU_SUSFS_* flags; disabled mount/try_umount/sus_su features stay disabled.",
              "Source patch and Kbuild integration verified; compile and device-runtime validation still required.",
          ]
          Path("ksu-susfs-prctl-port.log").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PYSUSFSPORT

      - name: Verify SUSFS userspace prctl command interface
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PYSUSFSAUDIT'
          from pathlib import Path
          import re
          kernel_sys = Path("kernel/sys.c").read_text()
          handler = Path("KernelSU-Next/kernel/feature/susfs_compat.c").read_text()
          kbuild = Path("KernelSU-Next/kernel/Kbuild").read_text()
          required = (
              "CMD_SUSFS_ADD_SUS_PATH",
              "CMD_SUSFS_SHOW_ENABLED_FEATURES",
              "CMD_SUSFS_SHOW_VERSION",
              "CMD_SUSFS_SHOW_VARIANT",
              "CMD_SUSFS_ADD_OPEN_REDIRECT",
              "CMD_SUSFS_SET_UNAME",
          )
          for token in required:
              if token not in handler:
                  raise SystemExit(f"SUSFS command bridge missing required command: {token}")
          checks = {
              "Linux prctl syscall calls the bridge": "KSU_NEXT_SUSFS_PRCTL_DISPATCH" in kernel_sys and "return ksu_susfs_handle_prctl(arg2, arg3, arg4, arg5);" in kernel_sys,
              "KernelSU-Next Kbuild links the bridge": "feature/susfs_compat.o" in kbuild,
              "Unknown commands fail closed": "return -ENOTTY;" in handler,
              "Root UID guard is present": "current_uid_val == 0" in handler,
          }
          failed = [name for name, ok in checks.items() if not ok]
          report = ["SUSFS prctl command-interface audit", "Target: KernelSU-Next v3.4.1 / driver 33333 / Linux 4.19.325"]
          report += [f"{'PASS' if ok else 'FAIL'}: {name}" for name, ok in checks.items()]
          report += ["Command tokens verified: " + ", ".join(required),
                     "Static source checks do not prove successful object compilation or live device execution."]
          Path("ksu-susfs-command-audit.log").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          if failed:
              raise SystemExit("SUSFS prctl interface verification failed: " + "; ".join(failed))
          PYSUSFSAUDIT

      - name: Align official v3.4.1 setuid hook with SUSFS task state
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "ERROR at line $LINENO: $BASH_COMMAND (exit=$rc)" >&2; exit "$rc"' ERR
          python3 - <<'PYSUSPATH'
          from pathlib import Path
          import re

          source_path = Path("drivers/kernelsu/hook/setuid_hook.c")
          defs_path = Path("include/linux/susfs_def.h")
          sched_path = Path("include/linux/sched.h")
          for path in (source_path, defs_path, sched_path):
              if not path.is_file():
                  raise SystemExit(f"Required SUS_PATH file missing: {path}")

          source = source_path.read_text()
          defs = defs_path.read_text()
          sched = sched_path.read_text()
          if "TASK_STRUCT_NON_ROOT_USER_APP_PROC" not in defs:
              raise SystemExit("SUSFS task-state flag is absent from susfs_def.h")
          if "susfs_task_state" not in sched:
              raise SystemExit("susfs_task_state field is absent from include/linux/sched.h")

          include = "#include <linux/susfs_def.h>"
          if include not in source:
              anchor = "#include <linux/uidgid.h>"
              if anchor not in source:
                  raise SystemExit("setuid_hook.c: include anchor not found")
              source = source.replace(anchor, anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n" + include + "\n#endif", 1)

          task_code = r'''    #ifdef CONFIG_KSU_SUSFS_SUS_PATH
              /* Mark non-root Android application UIDs for SUSFS path filtering. */
              if (new_uid != (uid_t)-1) {
                  uid_t appid = new_uid % 100000;
                  if (appid >= 10000 && appid <= 19999 &&
                      !ksu_is_allow_uid_for_current(new_uid)) {
                      current->susfs_task_state |= TASK_STRUCT_NON_ROOT_USER_APP_PROC;
                  } else {
                      current->susfs_task_state &= ~TASK_STRUCT_NON_ROOT_USER_APP_PROC;
                  }
              }
          #endif
          '''
          if "current->susfs_task_state |= TASK_STRUCT_NON_ROOT_USER_APP_PROC;" not in source:
              anchor_re = re.compile(
                  r'(?m)^[ \t]*pr_info\("handle_setresuid from %d to %d\\n", old_uid, new_uid\);[ \t]*$'
              )
              m = anchor_re.search(source)
              if not m:
                  raise SystemExit("Could not locate official v3.4.1 ksu_handle_setresuid() insertion anchor")
              source = source[:m.end()] + "\n" + task_code + source[m.end():]

          source_path.write_text(source)
          verify = source_path.read_text()
          if include not in verify or "current->susfs_task_state |= TASK_STRUCT_NON_ROOT_USER_APP_PROC;" not in verify:
              raise SystemExit("Official v3.4.1 SUS_PATH setuid hook verification failed")
          if "ksu_handle_setresuid" not in verify:
              raise SystemExit("Official v3.4.1 setuid handler was not found")
          print("Official v3.4.1 setuid hook aligned with SUSFS task-state marker.")
          PYSUSPATH

          grep -Fq 'TASK_STRUCT_NON_ROOT_USER_APP_PROC' drivers/kernelsu/hook/setuid_hook.c
          echo "Official v3.4.1 SUS_PATH source alignment verified."

      - name: Fix KernelSU-Next driver-install seccomp path (NULL seccomp_data + Linux 4.19 C89-safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "ERROR at line %s (exit=%s)\\n" "$LINENO" "$rc" >&2; exit "$rc"' ERR
          python3 - <<'PYKSUSECCOMP'
          from pathlib import Path
          import re

          seccomp_path = Path("kernel/seccomp.c")
          supercall_path = Path("KernelSU-Next/kernel/supercall/supercall.c")
          uapi_candidates = (
              Path("KernelSU-Next/uapi/supercall.h"),
              Path("KernelSU-Next/kernel/uapi/supercall.h"),
          )
          for path in (seccomp_path, supercall_path):
              if not path.is_file():
                  raise SystemExit(f"Required source missing: {path}")
          uapi_path = next((path for path in uapi_candidates if path.is_file()), None)
          if uapi_path is None:
              raise SystemExit("KernelSU-Next v3.4.1 UAPI header missing; searched: " + ", ".join(map(str, uapi_candidates)))

          uapi = uapi_path.read_text()
          supercall = supercall_path.read_text()
          def has_define(source, name, value):
              return re.search(r"(?m)^\s*#\s*define\s+" + re.escape(name) + r"\s+" + re.escape(value) + r"(?:\s|$)", source, re.I) is not None
          if not has_define(uapi, "KSU_INSTALL_MAGIC1", "0xDEADBEEF"):
              raise SystemExit(f"Unexpected/missing KSU_INSTALL_MAGIC1 in {uapi_path}; refusing patch")
          if not has_define(uapi, "KSU_INSTALL_MAGIC2", "0xCAFEBABE"):
              raise SystemExit(f"Unexpected/missing KSU_INSTALL_MAGIC2 in {uapi_path}; refusing patch")
          flat = re.sub(r"\s+", " ", supercall)
          if not re.search(r"magic1\s*==\s*KSU_INSTALL_MAGIC1\s*&&\s*magic2\s*==\s*KSU_INSTALL_MAGIC2", flat):
              raise SystemExit("Pinned KernelSU-Next v3.4.1 magic handshake differs; refusing patch")
          if not re.search(r"register_kprobe\s*\(\s*&reboot_kp\s*\)", flat):
              raise SystemExit("Pinned KernelSU-Next reboot kprobe registration differs; refusing patch")

          source = seccomp_path.read_text()
          marker = "KSU_NEXT_DRIVER_INSTALL_SECCOMP_ALLOW"
          signature = re.compile(
              r"static int __seccomp_filter\(int this_syscall, const struct seccomp_data \*sd,\s*"
              r"const bool recheck_after_trace\)\s*\{"
          )
          matches = list(signature.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one __seccomp_filter() function, found {len(matches)}")
          fn_start = matches[0].start()
          fn_body_start = matches[0].end()
          fn_end = source.find("\n}", fn_body_start)
          if fn_end < 0:
              raise SystemExit("Could not locate __seccomp_filter() end")
          body = source[fn_start:fn_end + 2]
          if marker not in body:
              decls = re.compile(
                  r"(u32 filter_ret,\s*action;\s*"
                  r"struct seccomp_filter \*match = NULL;\s*"
                  r"int data;\s*)"
              )
              decl_matches = list(decls.finditer(body))
              if len(decl_matches) != 1:
                  raise SystemExit(f"Expected one supported Linux 4.19 C declaration block, found {len(decl_matches)}")
              if "populate_seccomp_data(" not in source[:fn_start]:
                  raise SystemExit("populate_seccomp_data() helper not found before __seccomp_filter(); refusing NULL-data patch")
              add_decl = '\n#ifdef CONFIG_KSU\n\tstruct seccomp_data ksu_seccomp_data;\n#endif\n'
              insert_decl_at = fn_start + decl_matches[0].end()
              # Keep all local declarations before the first executable statement (Linux 4.19 C89 mode).
              source = source[:insert_decl_at] + add_decl + source[insert_decl_at:]
              matches = list(signature.finditer(source))
              fn_start = matches[0].start()
              fn_body_start = matches[0].end()
              fn_end = source.find("\n}", fn_body_start)
              body = source[fn_start:fn_end + 2]
              decl_matches = list(decls.finditer(body))
              if len(decl_matches) != 1:
                  raise SystemExit("Could not re-locate declaration block after adding NULL-data local")
              insertion = r'''
          #ifdef CONFIG_KSU
              /* KSU_NEXT_DRIVER_INSTALL_SECCOMP_ALLOW
               * v3.4.1 installs its driver FD through reboot(2) with this exact
               * four-argument tuple. Some Linux 4.19 call paths pass sd == NULL;
               * reconstruct it only for reboot so the request can be checked.
               * No other reboot tuple or syscall bypasses the installed BPF filter.
               */
              if (this_syscall == __NR_reboot) {
                  const struct seccomp_data *ksu_sd;
                  ksu_sd = sd;
                  if (!ksu_sd) {
                      populate_seccomp_data(&ksu_seccomp_data);
                      ksu_sd = &ksu_seccomp_data;
                  }
                  if (ksu_sd->nr == __NR_reboot &&
                      (u32)ksu_sd->args[0] == 0xDEADBEEF &&
                      (u32)ksu_sd->args[1] == 0xCAFEBABE &&
                      (u32)ksu_sd->args[2] == 0 && ksu_sd->args[3] != 0) {
                      pr_info_ratelimited("KernelSU-Next: seccomp allowed exact driver-install handshake\n");
                      return 0;
                  }
              }
          #endif

          '''.lstrip('\n')
              decl_pos = body.find("struct seccomp_data ksu_seccomp_data;")
              if decl_pos < 0:
                  raise SystemExit("Missing local seccomp_data declaration before insertion")
              endif_pos = body.find("#endif", decl_pos)
              if endif_pos < 0:
                  raise SystemExit("Missing #endif for local seccomp_data declaration")
              insertion_point = fn_start + endif_pos + len("#endif")
              source = source[:insertion_point] + '\n' + insertion + source[insertion_point:]
              seccomp_path.write_text(source)

          verify = seccomp_path.read_text()
          matches = list(signature.finditer(verify))
          if len(matches) != 1:
              raise SystemExit("Could not verify unique __seccomp_filter() after patch")
          fn_start = matches[0].start()
          fn_body_start = matches[0].end()
          fn_end = verify.find("\n}", fn_body_start)
          body = verify[fn_start:fn_end + 2]
          if body.count(marker) != 1:
              raise SystemExit("The driver-install seccomp marker must appear exactly once inside __seccomp_filter()")
          if "struct seccomp_data ksu_seccomp_data;" not in body:
              raise SystemExit("Missing C89-safe local seccomp_data storage")
          for required in (
              "if (this_syscall == __NR_reboot)",
              "if (!ksu_sd)",
              "populate_seccomp_data(&ksu_seccomp_data);",
              "ksu_sd = &ksu_seccomp_data;",
              "ksu_sd->nr == __NR_reboot",
              "(u32)ksu_sd->args[0] == 0xDEADBEEF",
              "(u32)ksu_sd->args[1] == 0xCAFEBABE",
              "(u32)ksu_sd->args[2] == 0 && ksu_sd->args[3] != 0",
              "KernelSU-Next: seccomp allowed exact driver-install handshake",
              "return 0;",
          ):
              if required not in body:
                  raise SystemExit(f"Seccomp NULL-data patch verification failed: {required}")
          decl_pos = body.find("int data;")
          extra_decl_pos = body.find("struct seccomp_data ksu_seccomp_data;")
          stmt_pos = body.find("if (this_syscall == __NR_reboot)")
          if min(decl_pos, extra_decl_pos, stmt_pos) < 0 or not decl_pos < extra_decl_pos < stmt_pos:
              raise SystemExit("C89 declaration ordering verification failed")
          if "if (sd && this_syscall == __NR_reboot" in body:
              raise SystemExit("Old NULL-blind seccomp condition remains")

          report = [
              "KernelSU-Next v3.4.1 (driver 33333) driver-install seccomp compatibility patch",
              f"UAPI header checked: {uapi_path}",
              "Verified the pinned v3.4.1 reboot-kprobe handshake and install magic values.",
              "Handles both a supplied seccomp_data pointer and sd == NULL via populate_seccomp_data().",
              "Only __NR_reboot with args[0]=0xDEADBEEF, args[1]=0xCAFEBABE, args[2]=0, and non-null args[3] bypasses BPF filtering.",
              "C89 declaration order checked; runtime marker: KernelSU-Next: seccomp allowed exact driver-install handshake",
              "Source verification only. Kernel log after boot must confirm actual request path; root access remains an on-device test.",
          ]
          Path("ksu-driver-seccomp-fix.log").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PYKSUSECCOMP

      - name: Configure kernel and KernelSU-Next SUSFS
        shell: bash
        run: |
          set -Eeuo pipefail
          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" "$DEFCONFIG"

          scripts/config --file .config --enable KSU
          # KernelSU-Next v3.4.1 uses syscall-table resolution and syscall tracepoints.
          scripts/config --file .config --enable DEBUG_KERNEL
          scripts/config --file .config --enable KALLSYMS
          scripts/config --file .config --enable KALLSYMS_ALL
          scripts/config --file .config --enable TRACEPOINTS
          scripts/config --file .config --enable SECCOMP
          scripts/config --file .config --enable SECCOMP_FILTER
          scripts/config --file .config --enable OVERLAY_FS
          scripts/config --file .config --enable KPROBES
          scripts/config --file .config --enable KPROBE_EVENTS
          # v3.4.1 legacy hook manager redirects registered syscalls through sys_enter tracepoints.
          scripts/config --file .config --enable HAVE_SYSCALL_TRACEPOINTS 2>/dev/null || true
          scripts/config --file .config --enable EXT4_FS
          scripts/config --file .config --enable KSU_SUSFS
          scripts/config --file .config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          scripts/config --file .config --enable KSU_SUSFS_SUS_PATH
          scripts/config --file .config --disable KSU_SUSFS_SUS_MOUNT
          scripts/config --file .config --disable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          scripts/config --file .config --disable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          scripts/config --file .config --enable KSU_SUSFS_SUS_KSTAT
          scripts/config --file .config --enable KSU_SUSFS_SUS_OVERLAYFS
          scripts/config --file .config --disable KSU_SUSFS_TRY_UMOUNT
          scripts/config --file .config --disable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          scripts/config --file .config --enable KSU_SUSFS_SPOOF_UNAME
          scripts/config --file .config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --file .config --enable KSU_SUSFS_OPEN_REDIRECT
          scripts/config --file .config --disable KSU_SUSFS_SUS_SU
          scripts/config --file .config --enable KSU_SUSFS_ENABLE_LOG
          scripts/config --file .config --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          scripts/config --file .config --set-str LOCALVERSION ''
          scripts/config --file .config --disable LOCALVERSION_AUTO

          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" olddefconfig

          if grep -q '^CONFIG_KSU_SUSFS_SUS_SU=y' .config; then
            echo "KSU_SUSFS_SUS_SU must remain disabled with official KernelSU-Next v3.4.1 on this 4.19 tree." >&2
            exit 1
          fi

          KERNELRELEASE="$(make -s ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" kernelrelease)"
          echo "Configured kernel release: $KERNELRELEASE"
          echo "Requested localversion: $KERNEL_LOCALVERSION"
          case "$KERNELRELEASE" in
            *MAX-ARAF*) ;;
            *) echo "MAX-ARAF is missing from kernel release: $KERNELRELEASE" >&2; exit 1 ;;
          esac

          for option in \
            CONFIG_KSU=y \
            CONFIG_KPROBES=y \
            CONFIG_KALLSYMS=y \
            CONFIG_DEBUG_KERNEL=y \
            CONFIG_KALLSYMS_ALL=y \
            CONFIG_SECCOMP=y \
            CONFIG_SECCOMP_FILTER=y \
            CONFIG_HAVE_SYSCALL_TRACEPOINTS=y \
            CONFIG_KPROBE_EVENTS=y \
            CONFIG_EXT4_FS=y \
            CONFIG_OVERLAY_FS=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y; do
            if ! grep -qx "$option" .config; then
              echo "Required kernel config is missing: $option" >&2
              exit 1
            fi
          done

          for option in \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            CONFIG_KSU_SUSFS_TRY_UMOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT; do
            if grep -qx "$option=y" .config; then
              echo "Unexpected namespace-dependent feature enabled: $option" >&2
              exit 1
            fi
          done

          grep -q '^CONFIG_LOCALVERSION=""$' .config
          echo "KernelSU and conservative SUSFS kernel-side configs verified; see ksu-susfs-command-audit.log for userspace protocol status."

      - name: Generate SELinux headers
        shell: bash
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" \
            scripts 2>&1 | tee scripts-build.log
          test -x scripts/selinux/genheaders/genheaders
          scripts/selinux/genheaders/genheaders \
            security/selinux/flask.h security/selinux/av_permissions.h
          test -s security/selinux/flask.h
          test -s security/selinux/av_permissions.h
          echo "SELinux headers generated successfully."

      - name: Resolve Linux 4.19 final-link compatibility symbols
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY419LINK'
          from pathlib import Path
          import re

          # KernelSU-Next v3.4.1 uses mount helpers that are not exported by
          # this Samsung 4.19 tree. Keep the feature entry points but make
          # these optional operations fail safely instead of creating
          # unresolved references at final link time.
          def replace_extern_with_fallback(path, symbol, marker):
              if not path.is_file():
                  raise SystemExit(f"Missing source: {path}")
              text = path.read_text()
              # Remove a fallback injected by an older workflow at the wrong
              # location (e.g. immediately after the includes). This prevents
              # a function-like macro from rewriting its own extern prototype.
              text = re.sub(
                  rf"^[ \t]*/\* {re.escape(marker)}:[^\n]*\*/[ \t]*\n"
                  rf"^[ \t]*#define {symbol}\(\.\.\.\) \(-EOPNOTSUPP\)[ \t]*\n?",
                  "",
                  text,
                  flags=re.M,
              )
              if marker not in text:
                  pattern = rf"extern\s+int\s+{re.escape(symbol)}\s*\([^;]+;[ \t]*"
                  replacement = (
                      f"/* {marker}: {symbol} is not exported on this 4.19 tree. */\n"
                      f"#define {symbol}(...) (-EOPNOTSUPP)\n"
                  )
                  text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
                  if count != 1:
                      raise SystemExit(f"Could not replace extern {symbol} declaration in {path}")
              # Strictly verify that no original extern declaration remains.
              if marker not in text or re.search(rf"extern\s+int\s+{re.escape(symbol)}\s*\(", text):
                  raise SystemExit(f"Invalid {symbol} fallback placement in {path}")
              path.write_text(text)
              lines = text.splitlines()
              marker_line = next(i for i, line in enumerate(lines) if marker in line)
              if marker_line + 1 >= len(lines) or not re.fullmatch(
                  rf"#define {re.escape(symbol)}\(\.\.\.\) \(-EOPNOTSUPP\)",
                  lines[marker_line + 1].strip(),
              ):
                  raise SystemExit(f"{symbol} fallback macro is not directly after its marker in {path}")

          replace_extern_with_fallback(
              Path("KernelSU-Next/kernel/infra/su_mount_ns.c"),
              "path_mount",
              "KSU_NEXT_419_PATH_MOUNT_FALLBACK",
          )
          replace_extern_with_fallback(
              Path("KernelSU-Next/kernel/feature/kernel_umount.c"),
              "path_umount",
              "KSU_NEXT_419_PATH_UMOUNT_FALLBACK",
          )

          # SUSFS's optional SUS_SU toggles call symbols not provided by the
          # official v3.4.1 driver. The Configure step disables this optional
          # feature, so compile those call sites out.
          susfs = Path("fs/susfs.c")
          if not susfs.is_file():
              raise SystemExit("fs/susfs.c missing after SUSFS patch")
          lines = susfs.read_text().splitlines()
          out = []
          wrapped = 0
          for line in lines:
              if re.search(r'\bksu_susfs_(?:disable|enable)_sus_su\s*\(', line):
                  if line.lstrip().startswith(("void ksu_susfs_", "int ksu_susfs_", "bool ksu_susfs_")):
                      out.append(line)
                      continue
                  out.extend([
                      "#ifdef CONFIG_KSU_SUSFS_SUS_SU",
                      line,
                      "#endif /* CONFIG_KSU_SUSFS_SUS_SU */",
                  ])
                  wrapped += 1
              else:
                  out.append(line)
          if wrapped:
              susfs.write_text("\n".join(out) + "\n")
          # Calls must be guarded; do not silently proceed if the source layout differs.
          verify = susfs.read_text()
          if "ksu_susfs_disable_sus_su(" in verify or "ksu_susfs_enable_sus_su(" in verify:
              # Every call must be in a CONFIG_KSU_SUSFS_SUS_SU guarded region.
              active = []
              guarded = False
              for line in verify.splitlines():
                  if line.strip() == "#ifdef CONFIG_KSU_SUSFS_SUS_SU":
                      guarded = True
                  if re.search(r'\bksu_susfs_(?:disable|enable)_sus_su\s*\(', line) and not line.lstrip().startswith(("void ksu_susfs_", "int ksu_susfs_", "bool ksu_susfs_")) and not guarded:
                      raise SystemExit("Found an unguarded SUS_SU call in fs/susfs.c")
                  if line.strip() == "#endif /* CONFIG_KSU_SUSFS_SUS_SU */":
                      guarded = False

          Path("linux-419-link-compatibility.log").write_text(
              "Linux 4.19 final-link compatibility:\n"
              "- path_mount/path_umount calls mapped to safe -EOPNOTSUPP fallback because symbols are not exported\n"
              "- optional SUS_SU call sites guarded by CONFIG_KSU_SUSFS_SUS_SU\n"
              "- official KernelSU-Next v3.4.1 and Manager metadata left unchanged\n"
          )
          print("Linux 4.19 final-link compatibility checks passed.")
          PY419LINK

      - name: Preflight compile all KernelSU-Next and SUSFS touched C units; collect all Clang errors
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "ERROR at line %s (exit=%s)\n" "$LINENO" "$rc" >&2; exit "$rc"' ERR

          # Fail fast only on source-layout/patch integrity. The compiler phase below
          # uses make -k so independent object errors are collected in one run.
          python3 - <<'PREFLIGHTSEC'
          from pathlib import Path
          import re

          source = Path("kernel/seccomp.c").read_text()
          signature = re.compile(
              r"static int __seccomp_filter\(int this_syscall, const struct seccomp_data \*sd,\s*"
              r"const bool recheck_after_trace\)\s*\{"
          )
          matches = list(signature.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f"Expected unique __seccomp_filter(), got {len(matches)}")
          start = matches[0].start()
          body_start = matches[0].end()
          end = source.find("\n}", body_start)
          if end < 0:
              raise SystemExit("Could not locate __seccomp_filter() end")
          body = source[start:end + 2]
          marker = "KSU_NEXT_DRIVER_INSTALL_SECCOMP_ALLOW"
          if body.count(marker) != 1:
              raise SystemExit("Seccomp marker must appear exactly once inside __seccomp_filter()")
          if "struct seccomp_data ksu_seccomp_data;" not in body or "populate_seccomp_data(&ksu_seccomp_data);" not in body:
              raise SystemExit("NULL seccomp_data handling is missing")
          if "if (!ksu_sd)" not in body or "ksu_sd = &ksu_seccomp_data;" not in body:
              raise SystemExit("Seccomp NULL-data fallback is incomplete")
          decl_end = body.find("struct seccomp_data ksu_seccomp_data;")
          stmt_pos = body.find("if (this_syscall == __NR_reboot)")
          if decl_end < 0 or stmt_pos < 0 or decl_end > stmt_pos:
              raise SystemExit("C89 declaration-order check failed")
          expected = (
              "ksu_sd->nr == __NR_reboot",
              "(u32)ksu_sd->args[0] == 0xDEADBEEF",
              "(u32)ksu_sd->args[1] == 0xCAFEBABE",
              "(u32)ksu_sd->args[2] == 0 && ksu_sd->args[3] != 0",
              "KernelSU-Next: seccomp allowed exact driver-install handshake",
          )
          for item in expected:
              if item not in body:
                  raise SystemExit(f"Seccomp source validation failed: {item}")
          if "if (sd && this_syscall == __NR_reboot" in body:
              raise SystemExit("Old NULL-blind seccomp condition remains")
          print("Seccomp preflight source check passed: NULL/non-NULL data paths, exact handshake tuple, C89 declarations and runtime marker.")
          PREFLIGHTSEC

          # Compile each C translation unit touched by KSU/SUSFS compatibility edits.
          # -k continues with independent targets after errors; -ferror-limit=0 asks Clang
          # to report all diagnostics within each translation unit.
          set +e
          make -k -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" \
            KCFLAGS="-ferror-limit=0" \
            drivers/kernelsu/ \
            fs/exec.o fs/open.o fs/read_write.o fs/stat.o fs/statfs.o fs/dcache.o \
            fs/namei.o fs/notify/fdinfo.o fs/overlayfs/inode.o fs/overlayfs/readdir.o \
            fs/overlayfs/super.o fs/proc/cmdline.o fs/proc/fd.o fs/proc/task_mmu.o \
            fs/proc_namespace.o fs/readdir.o fs/susfs.o \
            kernel/kallsyms.o kernel/sys.o kernel/reboot.o kernel/seccomp.o kernel/task_work.o \
            2>&1 | tee ksu-preflight.log
          build_rc=${PIPESTATUS[0]}
          set -e

          python3 - <<'PYERRORSUMMARY'
          from pathlib import Path
          import re

          log = Path("ksu-preflight.log").read_text(errors="replace").splitlines()
          pattern = re.compile(r"(^|\s)(fatal )?error:|undefined reference|No rule to make target|Error [0-9]+")
          hits = [i for i, line in enumerate(log) if pattern.search(line)]
          keep = set()
          for i in hits:
              keep.update(range(max(0, i - 2), min(len(log), i + 3)))
          summary = [f"Matched {len(hits)} compiler/linker/make diagnostic lines."]
          if not hits:
              summary.append("No compiler or make error markers were found in the preflight log.")
          previous = -2
          for i in sorted(keep):
              if i > previous + 1:
                  summary.append("...")
              summary.append(f"{i + 1}: {log[i]}")
              previous = i
          Path("ksu-preflight-error-summary.log").write_text("\n".join(summary) + "\n")
          print(summary[0])
          PYERRORSUMMARY

          echo "Preflight make exit code: $build_rc"
          if [ "$build_rc" -ne 0 ]; then
            echo "Preflight failed; complete build output and contextual diagnostic summary will be uploaded." >&2
            exit "$build_rc"
          fi

          grep -Fq -- "-- KernelSU-Next version: ${KSU_EXPECTED_VERSION}" ksu-preflight.log || {
            echo "Wrong driver version: expected ${KSU_EXPECTED_VERSION} from official ${KSU_TAG}." >&2
            exit 1
          }
          grep -Fq -- "-- KernelSU-Next tag: ${KSU_TAG}" ksu-preflight.log
          grep -Fq -- "-- KernelSU-Next Manager signature size: ${KSU_NEXT_EXPECTED_SIZE}" ksu-preflight.log
          grep -Fq -- "-- KernelSU-Next Manager signature hash: ${KSU_NEXT_EXPECTED_HASH}" ksu-preflight.log
          echo "All touched KernelSU-Next/SUSFS compatibility objects compiled; v3.4.1 driver 33333 and Manager metadata verified."

      - name: Build kernel Image and DTBs; collect complete diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "ERROR at line %s (exit=%s)\n" "$LINENO" "$rc" >&2; exit "$rc"' ERR

          # -k keeps building independent prerequisites after one target fails.
          set +e
          make -k -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" \
            Image Image.gz dtbs 2>&1 | tee kernel-build.log
          build_rc=${PIPESTATUS[0]}
          set -e

          python3 - <<'PYBUILDSUMMARY'
          from pathlib import Path
          import re

          log = Path("kernel-build.log").read_text(errors="replace").splitlines()
          pattern = re.compile(r"(^|\s)(fatal )?error:|undefined reference|No rule to make target|Error [0-9]+")
          hits = [i for i, line in enumerate(log) if pattern.search(line)]
          keep = set()
          for i in hits:
              keep.update(range(max(0, i - 2), min(len(log), i + 3)))
          summary = [f"Matched {len(hits)} compiler/linker/make diagnostic lines."]
          if not hits:
              summary.append("No compiler, linker, or make error markers were found in the kernel build log.")
          previous = -2
          for i in sorted(keep):
              if i > previous + 1:
                  summary.append("...")
              summary.append(f"{i + 1}: {log[i]}")
              previous = i
          Path("kernel-build-error-summary.log").write_text("\n".join(summary) + "\n")
          print(summary[0])
          PYBUILDSUMMARY

          echo "Full kernel make exit code: $build_rc"
          if [ "$build_rc" -ne 0 ]; then
            echo "Kernel build failed; all collected diagnostics will be uploaded." >&2
            exit "$build_rc"
          fi

          test -s arch/arm64/boot/Image
          test -s arch/arm64/boot/Image.gz
          find arch/arm64/boot/dts -type f -name '*.dtb' -print -quit | grep -q .
          find arch/arm64/boot/dts -type f -name '*.dtbo' -print -quit | grep -q .

          grep -aFq 'Linux version 4.19.325' arch/arm64/boot/Image
          grep -aFq 'MAX-ARAF' arch/arm64/boot/Image
          # Source-to-binary marker checks prove the seccomp exception and driver messages
          # were linked into Image; only on-device logs prove that the code path executes.
          strings -a arch/arm64/boot/Image > kernel-image-strings.txt
          grep -Fq 'KernelSU-Next: seccomp allowed exact driver-install handshake' kernel-image-strings.txt || {
            echo 'The patched seccomp handshake marker is absent from the final Image.' >&2; exit 1;
          }
          grep -Fq 'reboot kprobe registered successfully' kernel-image-strings.txt || {
            echo 'KernelSU-Next reboot-kprobe success marker missing from Image.' >&2; exit 1;
          }
          grep -Fq 'reboot kprobe failed' kernel-image-strings.txt || {
            echo 'KernelSU-Next reboot-kprobe failure diagnostic missing from Image.' >&2; exit 1;
          }
          echo 'Kernel image contains seccomp handshake and KernelSU reboot-kprobe runtime diagnostic strings.'
          grep -Fq 'KernelSU-Next: SUSFS prctl dispatcher reached' kernel-image-strings.txt || {
            echo 'SUSFS prctl dispatcher marker is absent from the final Image.' >&2; exit 1;
          }
          KERNELRELEASE="$(make -s ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" kernelrelease)"
          case "$KERNELRELEASE" in
            *MAX-ARAF*) echo "Verified final kernel release: $KERNELRELEASE" ;;
            *) echo "Final kernel release is missing MAX-ARAF: $KERNELRELEASE" >&2; exit 1 ;;
          esac

          echo "Kernel Image, Image.gz, device-tree outputs, KSU seccomp marker, and reboot-kprobe diagnostics verified."

      - name: Package non-flashable kernel build artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/A13-KernelSU-Next-SUSFS-MAX-ARAF-${GITHUB_RUN_NUMBER}-BUILD-ARTIFACTS.zip"
          STAGE="$RUNNER_TEMP/a13-kernel-artifacts"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/dts"

          cp arch/arm64/boot/Image "$STAGE/"
          cp arch/arm64/boot/Image.gz "$STAGE/"
          find arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp --parents '{}' "$STAGE/dts/" \;

          make -s ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" \
            kernelrelease > "$STAGE/kernel-release.txt"
          cp .config "$STAGE/kernel.config"
          for f in ksu-driver-seccomp-fix.log ksu-susfs-command-audit.log ksu-susfs-prctl-port.log kernel-image-strings.txt \
                   ksu-preflight.log ksu-preflight-error-summary.log \
                   kernel-build.log kernel-build-error-summary.log \
                   susfs-patch.log susfs-compatibility.log \
                   linux-419-link-compatibility.log selinux-compatibility-report.log; do
            [ ! -s "$f" ] || cp "$f" "$STAGE/"
          done
          KSU_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          SUSFS_COMMIT="$(git -C SUSFS rev-parse HEAD)"
          KERNEL_SHA="$(sha256sum arch/arm64/boot/Image | awk '{print $1}')"
          IMAGE_GZ_SHA="$(sha256sum arch/arm64/boot/Image.gz | awk '{print $1}')"
          CLANG_VERSION="$(clang --version | head -n 1)"
          {
            echo "Kernel repository commit: $(git rev-parse HEAD)"
            echo "Kernel source version: $(make -s kernelversion)"
            echo "Kernel release: $(cat "$STAGE/kernel-release.txt")"
            echo "KernelSU-Next tag: $KSU_TAG"
            echo "KernelSU-Next commit: $KSU_COMMIT"
            echo "KernelSU-Next driver version expected: $KSU_EXPECTED_VERSION"
            echo "Manager metadata expected size: $KSU_NEXT_EXPECTED_SIZE"
            echo "Manager metadata expected hash: $KSU_NEXT_EXPECTED_HASH"
            echo "SUSFS branch: $SUSFS_BRANCH"
            echo "SUSFS commit: $SUSFS_COMMIT"
            echo "Clang: $CLANG_VERSION"
            echo "Image SHA256: $KERNEL_SHA"
            echo "Image.gz SHA256: $IMAGE_GZ_SHA"
            echo "Boot image: not included; this bundle is not flashable"
            echo "SUSFS command interface: see ksu-susfs-command-audit.log; source presence is not runtime support"
            echo "Runtime root validation: not possible in GitHub build; test su -c id only after a verified boot image is assembled"
          } > "$STAGE/build-manifest.txt"
          printf '%s\n' \
            'Build artifacts only. This ZIP is NOT a TWRP-flashable package.' \
            'Do not flash Image or Image.gz directly.' \
            'A device-verified boot-image packaging method is required before flashing.' \
            > "$STAGE/FLASHING-WARNING.txt"

          cd "$STAGE"
          zip -qr "$OUTPUT" .
          unzip -t "$OUTPUT"
          echo "Created non-flashable artifact bundle: $OUTPUT"

      - name: Upload kernel build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-SUSFS-MAX-ARAF-${{ github.run_number }}-BUILD-ARTIFACTS
          path: A13-KernelSU-Next-SUSFS-MAX-ARAF-${{ github.run_number }}-BUILD-ARTIFACTS.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-SUSFS-diagnostics-${{ github.run_number }}
          path: |
            susfs-patch.log
            susfs-patch-dry-run.log
            susfs-compatibility.log
            selinux-compatibility-report.log
            ksu-linux-419-api-compatibility.log
            ksu-driver-seccomp-fix.log
            ksu-susfs-command-audit.log
            ksu-legacy-hook-integration.log
            linux-419-link-compatibility.log
            KernelSU-Next/kernel/supercall/dispatch.c
            KernelSU-Next/kernel/supercall/supercall.c
            KernelSU-Next/kernel/sulog/event.c
            KernelSU-Next/kernel/feature/selinux_hide.c
            KernelSU-Next/kernel/feature/susfs_compat.c
            ksu-susfs-prctl-port.log
            SUSFS/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
            selinux-rules-compat.diff
            selinux-sepolicy-compat.diff
            scripts-build.log
            ksu-preflight.log
            ksu-preflight-error-summary.log
            kernel-build-error-summary.log
            fs/susfs.c
            include/linux/susfs.h
            include/linux/susfs_def.h
            selinux-compat-original-v3.4.1-rules.c
            selinux-compat-original-v3.4.1-sepolicy.c
            KernelSU-Next/kernel/selinux/rules.c
            KernelSU-Next/kernel/selinux/sepolicy.c
            kernel-build.log
            .config
            SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch
            susfs-kernel-4.19-adapted.patch
            KernelSU-Next/kernel/Kbuild
            KernelSU-Next/kernel/infra/su_mount_ns.c
            KernelSU-Next/kernel/infra/seccomp_cache.c
            KernelSU-Next/kernel/manager/pkg_observer.c
            KernelSU-Next/kernel/policy/app_profile.c
            include/linux/seccomp.h
            kernel/seccomp.c
            ksu-susfs-command-audit.log
            kernel-image-strings.txt
            build-manifest.txt
            include/linux/task_work.h
            kernel/task_work.c
            include/linux/fsnotify_backend.h
            drivers/kernelsu/hook/setuid_hook.c
            fs/dcache.c
            include/linux/sched.h
            include/linux/susfs_def.h
          if-no-files-found: warn
          retention-days: 7
