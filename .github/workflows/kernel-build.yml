
name: A13 KernelSU Next Build

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next-v3.4.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex \
            git libelf-dev libncurses-dev libssl-dev \
            lld llvm clang python3 python-is-python3 \
            rsync dwarves

      - name: Integrate KernelSU Next v3.4.1
        run: |
          curl -fL \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.4.1/kernel/setup.sh \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh v3.4.1

      - name: Patch KernelSU Next for Linux 4.19
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("drivers/kernelsu/infra/file_wrapper.c")
          if not path.is_file():
              raise SystemExit(f"Missing source file: {path}")

          s = path.read_text()

          def replace_once(pattern, replacement, label, flags=0):
              global s
              updated, count = re.subn(
                  pattern, replacement, s, count=1, flags=flags
              )
              if count != 1:
                  raise SystemExit(
                      f"Patch stopped at {label}: matches={count}"
                  )
              s = updated

          # Remove the iopoll wrapper for this older kernel API.
          replace_once(
              r'#if LINUX_VERSION_CODE >= '
              r'KERNEL_VERSION\(6, 1, 0\)\s+'
              r'static int ksu_wrapper_iopoll\b'
              r'.*?#endif\s*',
              '',
              'iopoll wrapper',
              re.S,
          )

          replace_once(
              r'^[ \t]*p->ops\.iopoll = '
              r'fp->f_op->iopoll \? '
              r'ksu_wrapper_iopoll : NULL;\n',
              '',
              'iopoll assignment',
              re.M,
          )

          # Use the clone/dedupe operations available in this tree.
          replace_once(
              r'// no REMAP_FILE_DEDUP: use file_in.*?'
              r'(?=static int ksu_wrapper_fadvise)',
              '''static int ksu_wrapper_clone_file_range(
              struct file *file_in, loff_t pos_in,
              struct file *file_out, loff_t pos_out, u64 len)
          {
              struct ksu_file_wrapper *data = file_in->private_data;
              struct file *orig = data->orig;
              return orig->f_op->clone_file_range(
                  orig, pos_in, file_out, pos_out, len);
          }

          static int ksu_wrapper_dedupe_file_range(
              struct file *file_in, loff_t pos_in,
              struct file *file_out, loff_t pos_out, u64 len)
          {
              struct ksu_file_wrapper *data = file_out->private_data;
              struct file *orig = data->orig;
              return orig->f_op->dedupe_file_range(
                  file_in, pos_in, orig, pos_out, len);
          }

          ''',
              'legacy file-range wrappers',
              re.S,
          )

          replace_once(
              r'^[ \t]*p->ops\.remap_file_range =\n'
              r'[ \t]*fp->f_op->remap_file_range \? '
              r'ksu_wrapper_remap_file_range : NULL;\n',
              '''    p->ops.clone_file_range =
                  fp->f_op->clone_file_range
                      ? ksu_wrapper_clone_file_range : NULL;
              p->ops.dedupe_file_range =
                  fp->f_op->dedupe_file_range
                      ? ksu_wrapper_dedupe_file_range : NULL;
          ''',
              'file-range assignments',
              re.M,
          )

          forbidden = (
              'ksu_wrapper_iopoll',
              'p->ops.iopoll',
              'fp->f_op->iopoll',
              'ksu_wrapper_remap_file_range',
              'p->ops.remap_file_range',
              'fp->f_op->remap_file_range',
          )
          remaining = [item for item in forbidden if item in s]
          if remaining:
              raise SystemExit(f"Verification failed: {remaining}")

          path.write_text(s)
          print("file_wrapper compatibility patch applied.")
          PY

      - name: Patch missing ARM64 seccomp macro
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/kernelsu/infra/seccomp_cache.c")
          source = path.read_text()

          if "SECCOMP_ARCH_NATIVE_NR" not in source:
              raise SystemExit("Expected seccomp macro use was not found.")

          marker = "#include <linux/seccomp.h>"
          fallback = """
          #ifndef SECCOMP_ARCH_NATIVE_NR
          #define SECCOMP_ARCH_NATIVE_NR NR_syscalls
          #endif
          """

          if "#ifndef SECCOMP_ARCH_NATIVE_NR" not in source:
              if marker not in source:
                  raise SystemExit("Could not find seccomp include.")

              source = source.replace(
                  marker, marker + "\n" + fallback, 1
              )
              path.write_text(source)

          print("Seccomp compatibility fallback verified.")
          PY

      - name: Configure kernel
        run: |
          make ARCH=arm64 exynos850-a13nsxx_defconfig

          grep -q '^CONFIG_KSU=y' .config
          grep -q '^CONFIG_KPROBES=y' .config
          grep -q '^CONFIG_KPROBE_EVENTS=y' .config
          grep -q '^CONFIG_EXT4_FS=y' .config

          echo "KernelSU and required config options verified."

      
      - name: Preflight compile KernelSU objects
        run: |
          set -e

          test -f drivers/kernelsu/Kbuild
          test -f drivers/kernelsu/infra/file_wrapper.c
          test -f drivers/kernelsu/infra/seccomp_cache.c

          make -j2 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            drivers/kernelsu/kernelsu.o


      - name: Build kernel
        run: |
          make -j2 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            Image.gz dtbs

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-v3.4.1
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/
            .config
          if-no-files-found: error
          retention-days: 7
