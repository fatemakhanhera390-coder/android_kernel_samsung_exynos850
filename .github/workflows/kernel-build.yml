name: A13 KernelSU-Next SUSFS Build - MAX ARAF

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next-v3.4.1

permissions:
  contents: read

concurrency:
  group: a13-ksun-susfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      DEFCONFIG: exynos850-a13nsxx_defconfig
      KSU_REPO: https://github.com/SuleMareVientu/KernelSU-Next.git
      KSU_BRANCH: next-susfs-4.19
      KSU_NEXT_EXPECTED_SIZE: "0x3e6"
      KSU_NEXT_EXPECTED_HASH: 79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19
      CROSS_COMPILE: aarch64-linux-gnu-
      LLVM: "1"
      LLVM_IAS: "1"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git patch \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libelf-dev libncurses-dev libssl-dev python3 python-is-python3 \
            rsync dwarves zstd lz4 zip unzip xz-utils

      - name: Restore Android Clang archive cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/clang-r450784e.tar.gz
          key: a13-clang-r450784e-android14-release-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Download Android Clang r450784e
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/clang-r450784e.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r450784e.tar.gz' \
            -o "$ARCHIVE"
          test -s "$ARCHIVE"

      - name: Save Android Clang archive cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/clang-r450784e.tar.gz
          key: a13-clang-r450784e-android14-release-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Extract and verify Android Clang
        shell: bash
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang-r450784e"
          mkdir -p "$CLANG_DIR"
          tar -xzf "$RUNNER_TEMP/clang-r450784e.tar.gz" -C "$CLANG_DIR"
          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version
          "$CLANG_DIR/bin/ld.lld" --version

      - name: Verify target kernel source
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f "arch/arm64/configs/$DEFCONFIG"
          KERNEL_VERSION="$(make -s kernelversion)"
          echo "Target kernel version: $KERNEL_VERSION"
          if [ "$KERNEL_VERSION" != "4.19.325" ]; then
            echo "Expected Linux 4.19.325, got $KERNEL_VERSION" >&2
            exit 1
          fi

      - name: Integrate KernelSU-Next SUSFS-compatible source
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "ERROR at line $LINENO: $BASH_COMMAND (exit=$rc)" >&2; exit "$rc"' ERR

          rm -rf KernelSU-Next
          git clone --depth=1 --single-branch --branch "$KSU_BRANCH" "$KSU_REPO" KernelSU-Next

          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile
          test -f KernelSU-Next/kernel/ksu.c

          KSU_MAKEFILE="KernelSU-Next/kernel/Makefile"
          grep -Fq 'KSU_NEXT_EXPECTED_SIZE' "$KSU_MAKEFILE"
          grep -Fq 'KSU_NEXT_EXPECTED_HASH' "$KSU_MAKEFILE"
          if ! grep -Fq '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7' "$KSU_MAKEFILE"; then
            echo "The selected KernelSU-Next source does not contain the expected Manager signing hash." >&2
            echo "Selected source: $KSU_REPO ($KSU_BRANCH)" >&2
            exit 1
          fi

          rm -rf drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/Kconfig')
          s = p.read_text()
          marker = 'endmenu'
          i = s.rfind(marker)
          if i < 0:
              raise SystemExit('Could not find final endmenu in drivers/Kconfig')
          s = s[:i] + 'source "drivers/kernelsu/Kconfig"\n\n' + s[i:]
          p.write_text(s)
          PY

          test -L drivers/kernelsu
          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "KernelSU-Next commit: $(git -C KernelSU-Next rev-parse --short HEAD)"
          echo "KernelSU-Next branch: $(git -C KernelSU-Next branch --show-current)"
          echo "Manager signature compatibility: v3.4.1 target (size ${KSU_NEXT_EXPECTED_SIZE}, hash ${KSU_NEXT_EXPECTED_HASH})"
          echo "Kernel driver source remains the 4.19 SUSFS-compatible branch: ${KSU_BRANCH}"

      - name: Apply SUSFS with conservative compatibility mode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf SUSFS
          git clone --depth=1 --single-branch --branch "$SUSFS_BRANCH" "$SUSFS_REPO" SUSFS

          PATCH_FILE="SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
          test -s "$PATCH_FILE"
          test -s SUSFS/kernel_patches/fs/susfs.c
          test -s SUSFS/kernel_patches/include/linux/susfs.h
          test -s SUSFS/kernel_patches/include/linux/susfs_def.h

          install -m 0644 SUSFS/kernel_patches/fs/susfs.c fs/susfs.c
          install -m 0644 SUSFS/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          install -m 0644 SUSFS/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

          python3 - <<'PYPATCH'
          from pathlib import Path

          source = Path("SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch")
          target = Path("susfs-kernel-4.19-adapted.patch")
          skip_files = {"fs/namespace.c", "include/linux/mount.h"}
          skip_hunks = {
              "fs/dcache.c": {2189},
              "fs/proc/task_mmu.c": {20},
              "include/linux/sched.h": {1509},
              "kernel/sys.c": {1240},
          }
          skipped_files = set()
          skipped_hunks = {name: 0 for name in skip_hunks}
          current_file = ""
          skip_file = False
          skip_hunk = False
          output = []

          for line in source.read_text().splitlines(keepends=True):
              if line.startswith("diff --git "):
                  current_file = line.split(" b/", 1)[1].strip()
                  skip_file = current_file in skip_files
                  skip_hunk = False
                  if skip_file:
                      skipped_files.add(current_file)
                  else:
                      output.append(line)
                  continue

              if skip_file:
                  continue

              if line.startswith("@@ "):
                  skip_hunk = False
                  fields = line.split()
                  old_token = fields[1] if len(fields) > 1 else ""
                  try:
                      old_start = int(old_token.split(",", 1)[0].lstrip("-"))
                  except ValueError:
                      old_start = -1

                  if old_start in skip_hunks.get(current_file, set()):
                      skipped_hunks[current_file] += 1
                      skip_hunk = True
                      continue
                  output.append(line)
                  continue

              if not skip_hunk:
                  output.append(line)

          if skipped_files != skip_files:
              raise SystemExit(f"Patch layout changed; skipped file sections {skipped_files}, expected {skip_files}")
          for name, count in skipped_hunks.items():
              if count != 1:
                  raise SystemExit(f"Patch layout changed for {name}: skipped {count} hunks, expected exactly 1")

          target.write_text("".join(output))
          print("Prepared conservative SUSFS patch; omitted known incompatible hooks.")
          print(f"Omitted file sections: {', '.join(sorted(skipped_files))}")
          for name, count in skipped_hunks.items():
              print(f"Omitted {name} hunk(s): {count}")
          PYPATCH

          if ! patch --batch --forward --fuzz=2 -p1 \
              --dry-run < susfs-kernel-4.19-adapted.patch > susfs-patch-dry-run.log 2>&1; then
            cat susfs-patch-dry-run.log
            echo "Compatible SUSFS hunks failed dry-run; kernel source was not patched by this step." >&2
            exit 1
          fi
          cat susfs-patch-dry-run.log
          patch --batch --forward --fuzz=2 -p1 \
            < susfs-kernel-4.19-adapted.patch 2>&1 | tee susfs-patch.log

          python3 - <<'PYSUSFS'
          from pathlib import Path
          import re

          def read(name):
              p = Path(name)
              if not p.is_file():
                  raise SystemExit(f"Required source missing: {name}")
              return p.read_text()

          def write(name, content):
              Path(name).write_text(content)

          name = "fs/dcache.c"
          s = read(name)
          if "#include <linux/susfs_def.h>" not in s:
              anchor = "#include <linux/list_lru.h>"
              if anchor not in s:
                  raise SystemExit("dcache.c: include anchor not found")
              s = s.replace(
                  anchor,
                  anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n#include <linux/susfs_def.h>\n#endif",
                  1,
              )
          fn = re.search(r"struct dentry \*__d_lookup_rcu\b.*?\n\}", s, flags=re.S)
          if not fn:
              raise SystemExit("dcache.c: __d_lookup_rcu() not found")
          body = fn.group(0)
          marker = "TASK_STRUCT_NON_ROOT_USER_APP_PROC"
          if marker not in body:
              anchor = re.search(
                  r"if \(dentry_cmp\(dentry, str, hashlen_len\(hashlen\)\) != 0\)\s*\n\s*continue;\s*\n",
                  body,
              )
              if not anchor:
                  raise SystemExit("dcache.c: dentry_cmp() insertion anchor not found")
              check = (
                  "\t\t#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\t\tif (dentry->d_inode && unlikely(dentry->d_inode->i_state & INODE_STATE_SUS_PATH) && "
                  "likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC)) {\n"
                  "\t\t\tcontinue;\n"
                  "\t\t}\n"
                  "\t\t#endif\n"
              )
              body = body[:anchor.end()] + check + body[anchor.end():]
              s = s[:fn.start()] + body + s[fn.end():]
          write(name, s)

          name = "fs/proc/task_mmu.c"
          s = read(name)
          if "#include <linux/susfs_def.h>" not in s:
              anchor = "#include <linux/mm_inline.h>"
              if anchor in s:
                  s = s.replace(anchor, anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif", 1)
              else:
                  anchor = "#include <asm/elf.h>"
                  if anchor not in s:
                      raise SystemExit("task_mmu.c: no known include anchor found")
                  s = s.replace(anchor, "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n" + anchor, 1)
          write(name, s)

          name = "kernel/sys.c"
          s = read(name)
          marker = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
          start = s.find(marker)
          if start < 0:
              raise SystemExit("sys.c: newuname syscall anchor not found")
          old_uname = s.find("#ifdef __ARCH_WANT_SYS_OLD_UNAME", start)
          if old_uname < 0:
              old_uname = len(s)
          body = s[start:old_uname]
          if "susfs_spoof_uname(&tmp);" not in body:
              if "extern void susfs_spoof_uname(struct new_utsname *tmp);" not in s:
                  prototype = "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern void susfs_spoof_uname(struct new_utsname *tmp);\n#endif\n\n"
                  s = s[:start] + prototype + s[start:]
                  start = s.find(marker)
                  old_uname = s.find("#ifdef __ARCH_WANT_SYS_OLD_UNAME", start)
                  if old_uname < 0:
                      old_uname = len(s)
                  body = s[start:old_uname]
              up = re.search(r"^[ \t]*up_read\(&uts_sem\);", body, flags=re.M)
              if not up:
                  raise SystemExit("sys.c: up_read(&uts_sem) anchor not found in newuname")
              call = "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif\n"
              body = body[:up.start()] + call + body[up.start():]
              s = s[:start] + body + s[old_uname:]
          write(name, s)

          for marker_file, marker in {
              "fs/Makefile": "obj-$(CONFIG_KSU_SUSFS) += susfs.o",
              "fs/dcache.c": "TASK_STRUCT_NON_ROOT_USER_APP_PROC",
              "fs/proc/task_mmu.c": "#include <linux/susfs_def.h>",
              "kernel/sys.c": "susfs_spoof_uname(&tmp);",
              "include/linux/sched.h": "susfs_task_state",
          }.items():
              if marker not in read(marker_file):
                  raise SystemExit(f"SUSFS verification failed: {marker_file}: {marker}")

          if "susfs_mnt_id_backup" in read("include/linux/mount.h"):
              raise SystemExit("Mount-ID field unexpectedly present in conservative mode")
          if list(Path(".").rglob("*.rej")):
              raise SystemExit("Unresolved patch reject files remain")

          Path("susfs-compatibility.log").write_text(
              "SUSFS conservative mode: selected kernel patch hunks applied; mount-ID spoofing and namespace-dependent features omitted.\n"
          )
          print("SUSFS compatible hunks applied and manual anchors verified.")
          PYSUSFS

      - name: Align KernelSU SUS_PATH marker with SUSFS task state
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "ERROR at line $LINENO: $BASH_COMMAND (exit=$rc)" >&2; exit "$rc"' ERR
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("drivers/kernelsu/core_hook.c")
          susfs_defs = Path("include/linux/susfs_def.h")
          sched_header = Path("include/linux/sched.h")

          for path in (source_path, susfs_defs, sched_header):
              if not path.is_file():
                  raise SystemExit(f"Required SUS_PATH source/header missing: {path}")

          source = source_path.read_text()
          defs = susfs_defs.read_text()
          sched = sched_header.read_text()

          if "TASK_STRUCT_NON_ROOT_USER_APP_PROC" not in defs:
              raise SystemExit("SUSFS task-state flag is absent from susfs_def.h")
          if "susfs_task_state" not in sched:
              raise SystemExit("SUSFS task-state field is absent from include/linux/sched.h")
          if "#include <linux/susfs.h>" not in source:
              raise SystemExit("KernelSU core_hook.c no longer includes linux/susfs.h")

          # The selected KernelSU branch marks a user_struct KABI reserve, while
          # this SUSFS 4.19 patch consumes task_struct->susfs_task_state. Align
          # the actual setuid hook instead of weakening the CI check.
          func_match = re.search(
              r"\bint\s+ksu_handle_setuid\s*\(.*?\n\}", source, flags=re.S
          )
          if not func_match:
              raise SystemExit("Could not locate the complete ksu_handle_setuid() function")

          func = func_match.group(0)
          old_marker = re.compile(
              r"new->user->android_kabi_reserved2\s*\|=\s*"
              r"USER_STRUCT_KABI2_NON_ROOT_USER_APP_PROFILE\s*;"
          )
          task_marker = "current->susfs_task_state |= TASK_STRUCT_NON_ROOT_USER_APP_PROC;"

          if task_marker not in func:
              if not old_marker.search(func):
                  raise SystemExit(
                      "Neither the expected user_struct marker nor the SUSFS task marker "
                      "was found in ksu_handle_setuid(); refusing an unsafe automatic edit."
                  )
              func, count = old_marker.subn(task_marker, func, count=1)
              if count != 1:
                  raise SystemExit("Failed to replace the old SUS_PATH marker exactly once")
              source = source[:func_match.start()] + func + source[func_match.end():]

          if "USER_STRUCT_KABI2_NON_ROOT_USER_APP_PROFILE" in source:
              raise SystemExit("Obsolete USER_STRUCT_KABI2 marker remains in core_hook.c")

          source_path.write_text(source)
          verify = source_path.read_text()
          m = re.search(r"\bint\s+ksu_handle_setuid\s*\(.*?\n\}", verify, flags=re.S)
          if not m or task_marker not in m.group(0):
              raise SystemExit("SUS_PATH task marker verification failed inside ksu_handle_setuid()")

          print("KernelSU SUS_PATH marker aligned with SUSFS task_struct state.")
          PY

          grep -Fq 'TASK_STRUCT_NON_ROOT_USER_APP_PROC' drivers/kernelsu/core_hook.c
          ! grep -Fq 'USER_STRUCT_KABI2_NON_ROOT_USER_APP_PROFILE' drivers/kernelsu/core_hook.c
          echo "SUS_PATH source alignment verified."

      - name: Configure kernel and KernelSU-Next SUSFS
        shell: bash
        run: |
          set -Eeuo pipefail
          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" "$DEFCONFIG"

          scripts/config --file .config --enable KSU
          scripts/config --file .config --enable OVERLAY_FS
          scripts/config --file .config --enable KPROBES
          scripts/config --file .config --enable KPROBE_EVENTS
          scripts/config --file .config --enable EXT4_FS
          scripts/config --file .config --enable KSU_SUSFS
          scripts/config --file .config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          scripts/config --file .config --enable KSU_SUSFS_SUS_PATH
          scripts/config --file .config --disable KSU_SUSFS_SUS_MOUNT
          scripts/config --file .config --disable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          scripts/config --file .config --disable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          scripts/config --file .config --enable KSU_SUSFS_SUS_KSTAT
          scripts/config --file .config --enable KSU_SUSFS_SUS_OVERLAYFS
          scripts/config --file .config --disable KSU_SUSFS_TRY_UMOUNT
          scripts/config --file .config --disable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          scripts/config --file .config --enable KSU_SUSFS_SPOOF_UNAME
          scripts/config --file .config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --file .config --enable KSU_SUSFS_OPEN_REDIRECT
          scripts/config --file .config --enable KSU_SUSFS_SUS_SU
          scripts/config --file .config --enable KSU_SUSFS_ENABLE_LOG
          scripts/config --file .config --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          scripts/config --file .config --set-str LOCALVERSION '-MAX-ARAF'
          scripts/config --file .config --disable LOCALVERSION_AUTO

          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" olddefconfig

          KERNELRELEASE="$(make -s ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" CROSS_COMPILE="$CROSS_COMPILE" kernelrelease)"
          echo "Configured kernel release: $KERNELRELEASE"
          case "$KERNELRELEASE" in
            *MAX-ARAF*) ;;
            *) echo "MAX-ARAF is missing from kernel release: $KERNELRELEASE" >&2; exit 1 ;;
          esac

          for option in \
            CONFIG_KSU=y \
            CONFIG_KPROBES=y \
            CONFIG_KPROBE_EVENTS=y \
            CONFIG_EXT4_FS=y \
            CONFIG_OVERLAY_FS=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y; do
            if ! grep -qx "$option" .config; then
              echo "Required kernel config is missing: $option" >&2
              exit 1
            fi
          done

          for option in \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            CONFIG_KSU_SUSFS_TRY_UMOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT; do
            if grep -qx "$option=y" .config; then
              echo "Unexpected namespace-dependent feature enabled: $option" >&2
              exit 1
            fi
          done

          grep -q '^CONFIG_LOCALVERSION="-MAX-ARAF"$' .config
          echo "KernelSU and conservative SUSFS feature configs verified."

      - name: Generate SELinux headers
        shell: bash
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" scripts 2>&1 | tee scripts-build.log
          test -x scripts/selinux/genheaders/genheaders
          scripts/selinux/genheaders/genheaders \
            security/selinux/flask.h security/selinux/av_permissions.h
          test -s security/selinux/flask.h
          test -s security/selinux/av_permissions.h
          echo "SELinux headers generated successfully."

      - name: Preflight compile KernelSU-Next and SUSFS
        shell: bash
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" drivers/kernelsu/ \
            2>&1 | tee ksu-preflight.log
          echo "KernelSU/SUSFS preflight compile completed."
          grep -E -- 'KernelSU(-Next)? version:|Manager signature hash|Manager signature size|SUSFS_VERSION' \
            ksu-preflight.log || true
          grep -Fq -- "-- KernelSU-Next Manager signature size: ${KSU_NEXT_EXPECTED_SIZE}" ksu-preflight.log
          grep -Fq -- "-- KernelSU-Next Manager signature hash: ${KSU_NEXT_EXPECTED_HASH}" ksu-preflight.log
          echo "KernelSU-Next Manager signing compatibility verified in compiler output."

      - name: Build kernel Image and DTBs
        shell: bash
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" Image Image.gz dtbs \
            2>&1 | tee kernel-build.log

          test -s arch/arm64/boot/Image
          test -s arch/arm64/boot/Image.gz
          find arch/arm64/boot/dts -type f -name '*.dtb' -print -quit | grep -q .
          find arch/arm64/boot/dts -type f -name '*.dtbo' -print -quit | grep -q .

          grep -aFq 'Linux version 4.19.325' arch/arm64/boot/Image
          grep -aFq 'MAX-ARAF' arch/arm64/boot/Image
          KERNELRELEASE="$(make -s ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" CROSS_COMPILE="$CROSS_COMPILE" kernelrelease)"
          case "$KERNELRELEASE" in
            *MAX-ARAF*) echo "Verified final kernel release: $KERNELRELEASE" ;;
            *) echo "Final kernel release is missing MAX-ARAF: $KERNELRELEASE" >&2; exit 1 ;;
          esac

          echo "Kernel Image, Image.gz and device-tree outputs verified."

      - name: Package non-flashable kernel build artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/A13-KernelSU-Next-SUSFS-MAX-ARAF-${GITHUB_RUN_NUMBER}-BUILD-ARTIFACTS.zip"
          STAGE="$RUNNER_TEMP/a13-kernel-artifacts"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/dts"

          cp arch/arm64/boot/Image "$STAGE/"
          cp arch/arm64/boot/Image.gz "$STAGE/"
          find arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp --parents '{}' "$STAGE/dts/" \;

          make -s ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" kernelrelease > "$STAGE/kernel-release.txt"
          printf '%s\n' \
            'Build artifacts only. This ZIP is NOT a TWRP-flashable package.' \
            'Do not flash Image or Image.gz directly.' \
            'A device-verified boot-image packaging method is required before flashing.' \
            > "$STAGE/FLASHING-WARNING.txt"

          cd "$STAGE"
          zip -qr "$OUTPUT" .
          unzip -t "$OUTPUT"
          echo "Created non-flashable artifact bundle: $OUTPUT"

      - name: Upload kernel build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-SUSFS-MAX-ARAF-${{ github.run_number }}-BUILD-ARTIFACTS
          path: A13-KernelSU-Next-SUSFS-MAX-ARAF-${{ github.run_number }}-BUILD-ARTIFACTS.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-SUSFS-diagnostics-${{ github.run_number }}
          path: |
            susfs-patch.log
            susfs-patch-dry-run.log
            susfs-compatibility.log
            scripts-build.log
            ksu-preflight.log
            kernel-build.log
            .config
            SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch
            susfs-kernel-4.19-adapted.patch
            KernelSU-Next/kernel/Makefile
            drivers/kernelsu/core_hook.c
            fs/dcache.c
            include/linux/sched.h
            include/linux/susfs_def.h
          if-no-files-found: warn
          retention-days: 7
