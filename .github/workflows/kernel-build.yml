
name: A13 KernelSU Next Build

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next-v3.4.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex \
            git libelf-dev libncurses-dev libssl-dev \
            lld llvm clang python3 python-is-python3 \
            rsync dwarves

      - name: Integrate KernelSU Next v3.4.1
        run: |
          set -e
          curl -fL \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.4.1/kernel/setup.sh \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh v3.4.1

      - name: Patch KernelSU Next file wrapper for Linux 4.19
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("drivers/kernelsu/infra/file_wrapper.c")
          if not path.is_file():
              raise SystemExit(f"Missing source file: {path}")

          s = path.read_text()

          def replace_once(pattern, replacement, label, flags=0):
              global s
              updated, count = re.subn(
                  pattern, replacement, s, count=1, flags=flags
              )
              if count != 1:
                  raise SystemExit(
                      f"Patch stopped at {label}: matches={count}"
                  )
              s = updated

          # Linux 4.19 file_operations has no iopoll member.
          replace_once(
              r'#if LINUX_VERSION_CODE >= '
              r'KERNEL_VERSION\(6, 1, 0\)\s+'
              r'static int ksu_wrapper_iopoll\b'
              r'.*?#endif\s*',
              '',
              'iopoll wrapper',
              re.S,
          )

          replace_once(
              r'^[ \t]*p->ops\.iopoll = '
              r'fp->f_op->iopoll \? '
              r'ksu_wrapper_iopoll : NULL;\n',
              '',
              'iopoll assignment',
              re.M,
          )

          # Use clone/dedupe callbacks available in this kernel tree.
          replace_once(
              r'// no REMAP_FILE_DEDUP: use file_in.*?'
              r'(?=static int ksu_wrapper_fadvise)',
              '''static int ksu_wrapper_clone_file_range(
              struct file *file_in, loff_t pos_in,
              struct file *file_out, loff_t pos_out, u64 len)
          {
              struct ksu_file_wrapper *data = file_in->private_data;
              struct file *orig = data->orig;
              return orig->f_op->clone_file_range(
                  orig, pos_in, file_out, pos_out, len);
          }

          static int ksu_wrapper_dedupe_file_range(
              struct file *file_in, loff_t pos_in,
              struct file *file_out, loff_t pos_out, u64 len)
          {
              struct ksu_file_wrapper *data = file_out->private_data;
              struct file *orig = data->orig;
              return orig->f_op->dedupe_file_range(
                  file_in, pos_in, orig, pos_out, len);
          }

          ''',
              'legacy file-range wrappers',
              re.S,
          )

          replace_once(
              r'^[ \t]*p->ops\.remap_file_range =\n'
              r'[ \t]*fp->f_op->remap_file_range \? '
              r'ksu_wrapper_remap_file_range : NULL;\n',
              '''    p->ops.clone_file_range =
                  fp->f_op->clone_file_range
                      ? ksu_wrapper_clone_file_range : NULL;
              p->ops.dedupe_file_range =
                  fp->f_op->dedupe_file_range
                      ? ksu_wrapper_dedupe_file_range : NULL;
          ''',
              'file-range assignments',
              re.M,
          )

          forbidden = (
              'ksu_wrapper_iopoll',
              'p->ops.iopoll',
              'fp->f_op->iopoll',
              'ksu_wrapper_remap_file_range',
              'p->ops.remap_file_range',
              'fp->f_op->remap_file_range',
          )
          remaining = [item for item in forbidden if item in s]
          if remaining:
              raise SystemExit(f"Verification failed: {remaining}")

          path.write_text(s)
          print("file_wrapper compatibility patch applied.")
          PY

      - name: Patch missing ARM64 seccomp macro
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/kernelsu/infra/seccomp_cache.c")
          if not path.is_file():
              raise SystemExit(f"Missing source file: {path}")

          source = path.read_text()
          if "SECCOMP_ARCH_NATIVE_NR" not in source:
              raise SystemExit("Expected seccomp macro use was not found.")

          marker = "#include <linux/seccomp.h>"
          fallback = """
          #ifndef SECCOMP_ARCH_NATIVE_NR
          #define SECCOMP_ARCH_NATIVE_NR NR_syscalls
          #endif
          """

          if "#ifndef SECCOMP_ARCH_NATIVE_NR" not in source:
              if marker not in source:
                  raise SystemExit("Could not find seccomp include.")
              source = source.replace(
                  marker, marker + "\n" + fallback, 1
              )
              path.write_text(source)

          print("Seccomp compatibility fallback verified.")
          PY

      - name: Patch mount namespace for Linux 4.19
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("drivers/kernelsu/infra/su_mount_ns.c")
          if not path.is_file():
              raise SystemExit(f"Missing source file: {path}")

          s = path.read_text()

          # Remove the mount UAPI header absent from this kernel tree.
          s, count = re.subn(
              r'(?m)^#include[ \t]*<uapi/linux/mount\.h>[ \t]*\n',
              '',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit(
                  "Could not remove missing mount UAPI header."
              )

          # The existing linux/fs.h supplies MS_PRIVATE and MS_REC.
          # Add uaccess declarations for the Linux 4.19 set_fs API.
          if "#include <linux/uaccess.h>" not in s:
              marker = "#include <linux/syscalls.h>"
              if marker not in s:
                  raise SystemExit(
                      "Could not find syscalls include marker."
                  )
              s = s.replace(
                  marker, marker + "\n#include <linux/uaccess.h>", 1
              )

          # path_mount() is not available in this kernel version.
          decl_pattern = (
              r'extern int path_mount\s*\(\s*'
              r'const char \*dev_name,\s*'
              r'struct path \*path,\s*'
              r'const char \*type_page,\s*'
              r'unsigned long flags,\s*'
              r'void \*data_page\s*\);'
          )
          s, count = re.subn(decl_pattern, '', s, count=1)
          if count != 1:
              raise SystemExit(
                  "Could not remove path_mount declaration."
              )

          # Replace the individual mount namespace function with the
          # legacy ksys_mount interface available in Linux 4.19.
          function_pattern = (
              r'static void ksu_mnt_ns_individual\(void\)\s*'
              r'\{.*?\n\}'
          )

          function_replacement = '''static void ksu_mnt_ns_individual(void)
          {
              long ret;
              mm_segment_t old_fs;
              int pm_ret;

              ret = ksys_unshare(CLONE_NEWNS);
              if (ret) {
                  pr_warn("call ksys_unshare failed: %ld\\n", ret);
                  return;
              }

              /* Linux 4.19 mount API: make this process root private. */
              old_fs = get_fs();
              set_fs(KERNEL_DS);
              pm_ret = ksys_mount(
                  NULL, (char __user *)"/", NULL,
                  MS_PRIVATE | MS_REC, NULL);
              set_fs(old_fs);

              if (pm_ret < 0) {
                  pr_err("failed to make root private, err: %d\\n", pm_ret);
              }
          }'''

          s, count = re.subn(
              function_pattern,
              lambda _match: function_replacement,
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(
                  "Could not patch mount namespace function."
              )

          forbidden = ("path_mount(", "uapi/linux/mount.h")
          remaining = [item for item in forbidden if item in s]
          if remaining:
              raise SystemExit(
                  f"Mount patch verification failed: {remaining}"
              )

          if (
              "ksys_mount(" not in s
              or "set_fs(KERNEL_DS)" not in s
          ):
              raise SystemExit(
                  "Linux 4.19 mount API verification failed."
              )

          path.write_text(s)
          print("Mount namespace compatibility patch applied.")
          PY

      
      - name: Patch KernelSU package observer for Linux 4.19
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("drivers/kernelsu/manager/pkg_observer.c")

          if not path.is_file():
              raise SystemExit(f"Missing source file: {path}")

          s = path.read_text()

          # Linux 4.19 task_work_add() expects a bool notify argument.
          if "TWA_RESUME" in s:
              s, count = re.subn(
                  r'\bTWA_RESUME\b',
                  'true',
                  s,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not patch TWA_RESUME.")

          # Adapt the observer callback to the Linux 4.19 fsnotify API.
          pattern = (
              r'static int ksu_handle_inode_event\(.*?'
              r'static const struct fsnotify_ops ksu_ops = '
              r'\{.*?\};'
          )

          replacement = r'''static int ksu_handle_event(
              struct fsnotify_group *group,
              struct inode *inode,
              u32 mask,
              const void *data,
              int data_type,
              const unsigned char *file_name,
              u32 cookie,
              struct fsnotify_iter_info *iter_info)
          {
              if (!file_name)
                  return 0;

              if (mask & FS_ISDIR)
                  return 0;

              if (!strcmp((const char *)file_name, "packages.list")) {
                  pr_info("packages.list detected: %u\n", mask);
                  ksu_defer_track_throne();
              }

              return 0;
          }

          static const struct fsnotify_ops ksu_ops = {
              .handle_event = ksu_handle_event,
          };'''

          s, count = re.subn(
              pattern,
              lambda _match: replacement,
              s,
              count=1,
              flags=re.S,
          )

          if count != 1:
              raise SystemExit(
                  "Could not safely replace the fsnotify callback."
              )

          if "TWA_RESUME" in s:
              raise SystemExit("TWA_RESUME remains in source.")

          if ".handle_inode_event" in s:
              raise SystemExit("Modern fsnotify field remains.")

          if ".handle_event = ksu_handle_event" not in s:
              raise SystemExit("Legacy fsnotify callback not installed.")

          path.write_text(s)
          print("Linux 4.19 package observer patch applied.")
          PY


      - name: Configure kernel
        run: |
          set -e
          make ARCH=arm64 exynos850-a13nsxx_defconfig

          grep -q '^CONFIG_KSU=y' .config
          grep -q '^CONFIG_KPROBES=y' .config
          grep -q '^CONFIG_KPROBE_EVENTS=y' .config
          grep -q '^CONFIG_EXT4_FS=y' .config

          echo "KernelSU and required config options verified."

      - name: Verify KernelSU integration
        run: |
          set -e

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kbuild
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/infra/file_wrapper.c
          test -f drivers/kernelsu/infra/seccomp_cache.c
          test -f drivers/kernelsu/infra/su_mount_ns.c

          grep -Fq \
            'obj-$(CONFIG_KSU) += kernelsu/' \
            drivers/Makefile

          grep -Fq \
            'source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          grep -q '^CONFIG_KSU=y' .config

          echo "KernelSU integration verified."


      
     
      - name: Generate SELinux headers before KernelSU
        run: |
          set -euo pipefail

          # Build host-side kernel scripts, including genheaders.
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 scripts \
            2>&1 | tee selinux-genheaders-build.log

          # Verify the generator exists before running it.
          test -x scripts/selinux/genheaders/genheaders

          # Generate the headers expected by SELinux.
          scripts/selinux/genheaders/genheaders \
            security/selinux/flask.h \
            security/selinux/av_permissions.h \
            2>&1 | tee selinux-genheaders-run.log

          # Fail here with a clear message if generation failed.
          test -s security/selinux/flask.h
          test -s security/selinux/av_permissions.h

          grep -q '_SELINUX_FLASK_H_' \
            security/selinux/flask.h

          echo "SELinux headers generated successfully."
 
    



      - name: Preflight compile KernelSU directory
        run: |
          set -o pipefail
          make -j2 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            drivers/kernelsu/ 2>&1 | tee ksu-preflight.log

      - name: Build kernel
        run: |
          set -o pipefail
          make -j2 ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            Image.gz dtbs 2>&1 | tee kernel-build.log

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-v3.4.1
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/
            .config
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KSU-Build-Diagnostics
          path: |
            ksu-preflight.log
            kernel-build.log
            .config
          if-no-files-found: warn
          retention-days: 7
