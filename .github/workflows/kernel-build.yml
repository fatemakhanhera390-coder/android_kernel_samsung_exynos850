name: A13 KernelSU-Next v3.4.1 (33333) SUSFS Build - MAX ARAF

on:
  workflow_dispatch:
  push:
    branches:
      - ksu-next-v3.4.1

permissions:
  contents: read

concurrency:
  group: a13-ksun-susfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      DEFCONFIG: exynos850-a13nsxx_defconfig
      KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next.git
      KSU_TAG: v3.4.1
      KSU_EXPECTED_COMMIT_SHORT: 8f902ae
      KSU_EXPECTED_VERSION: "33333"
      KSU_NEXT_EXPECTED_SIZE: "0x3e6"
      KSU_NEXT_EXPECTED_HASH: 79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7
      KERNEL_LOCALVERSION: "-MAX-ARAF"
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
      SUSFS_BRANCH: kernel-4.19
      CROSS_COMPILE: aarch64-linux-gnu-
      LLVM: "1"
      LLVM_IAS: "1"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git patch \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libelf-dev libncurses-dev libssl-dev python3 python-is-python3 \
            rsync dwarves zstd lz4 zip unzip xz-utils

      - name: Restore Android Clang archive cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/clang-r450784e.tar.gz
          key: a13-clang-r450784e-android14-release-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Download Android Clang r450784e
        if: steps.clang-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/clang-r450784e.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r450784e.tar.gz' \
            -o "$ARCHIVE"
          test -s "$ARCHIVE"

      - name: Save Android Clang archive cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/clang-r450784e.tar.gz
          key: a13-clang-r450784e-android14-release-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Extract and verify Android Clang
        shell: bash
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang-r450784e"
          mkdir -p "$CLANG_DIR"
          tar -xzf "$RUNNER_TEMP/clang-r450784e.tar.gz" -C "$CLANG_DIR"
          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version
          "$CLANG_DIR/bin/ld.lld" --version

      - name: Verify target kernel source
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f "arch/arm64/configs/$DEFCONFIG"
          KERNEL_VERSION="$(make -s kernelversion)"
          echo "Target kernel version: $KERNEL_VERSION"
          if [ "$KERNEL_VERSION" != "4.19.325" ]; then
            echo "Expected Linux 4.19.325, got $KERNEL_VERSION" >&2
            exit 1
          fi

      - name: Integrate official KernelSU-Next v3.4.1 (33333)
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "ERROR at line $LINENO: $BASH_COMMAND (exit=$rc)" >&2; exit "$rc"' ERR

          rm -rf KernelSU-Next
          # Full history is required: official KernelSU-Next derives KSU_VERSION
          # from 30000 + git rev-list --count HEAD. A depth=1 clone gives a false version.
          git clone "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next fetch --tags --force origin
          git -C KernelSU-Next checkout --detach "$KSU_TAG"

          
          ACTUAL_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          ACTUAL_COMMIT_SHORT="${ACTUAL_COMMIT:0:${#KSU_EXPECTED_COMMIT_SHORT}}"
          ACTUAL_TAG="$(git -C KernelSU-Next describe --tags --exact-match HEAD)"
          echo "Official KernelSU-Next tag: $ACTUAL_TAG"
          echo "Official KernelSU-Next commit: $ACTUAL_COMMIT"
          echo "Verified commit prefix: $ACTUAL_COMMIT_SHORT"
          test "$ACTUAL_TAG" = "$KSU_TAG"
          if [ "$ACTUAL_COMMIT_SHORT" != "$KSU_EXPECTED_COMMIT_SHORT" ]; then
            echo "ERROR: Commit does not match expected v3.4.1 commit." >&2
            echo "Expected prefix: $KSU_EXPECTED_COMMIT_SHORT" >&2
            echo "Actual commit: $ACTUAL_COMMIT" >&2
            exit 1
          fi

          test -s KernelSU-Next/kernel/Kconfig
          test -s KernelSU-Next/kernel/Kbuild
          test -s KernelSU-Next/kernel/core/init.c
          test -s KernelSU-Next/kernel/hook/setuid_hook.c

          KSU_KBUILD="KernelSU-Next/kernel/Kbuild"
          grep -Fq "KSU_NEXT_MANAGER_SIZE := ${KSU_NEXT_EXPECTED_SIZE}" "$KSU_KBUILD"
          grep -Fq "KSU_NEXT_MANAGER_HASH := ${KSU_NEXT_EXPECTED_HASH}" "$KSU_KBUILD"

          # The official v3.4.1 source does not carry the SUSFS Kconfig symbols
          # from the old third-party branch. Define those kernel-side options here
          # so the existing Linux 4.19 SUSFS patch can still be configured.
          python3 - <<'PYKCONFIG'
          from pathlib import Path

          path = Path("KernelSU-Next/kernel/Kconfig")
          data = path.read_text()
          block = '''config KSU_SUSFS
          	bool "SUSFS support"
          	depends on KSU
          	default y

          config KSU_SUSFS_HAS_MAGIC_MOUNT
          	bool "SUSFS magic mount support"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_PATH
          	bool "SUSFS path hiding"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_SUS_MOUNT
          	bool "SUSFS mount hiding"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          	bool "SUSFS automatically hide KernelSU mounts"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default n

          config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          	bool "SUSFS automatically hide bind mounts"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default n

          config KSU_SUSFS_SUS_KSTAT
          	bool "SUSFS stat spoofing"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_SUS_OVERLAYFS
          	bool "SUSFS overlayfs support"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_TRY_UMOUNT
          	bool "SUSFS try umount"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          	bool "SUSFS automatic try umount for bind mounts"
          	depends on KSU_SUSFS_TRY_UMOUNT
          	default n

          config KSU_SUSFS_SPOOF_UNAME
          	bool "SUSFS uname spoofing"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "SUSFS cmdline/bootconfig spoofing"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_OPEN_REDIRECT
          	bool "SUSFS open redirect"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_SUS_SU
          	bool "SUSFS sus su support"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_ENABLE_LOG
          	bool "SUSFS logging"
          	depends on KSU_SUSFS
          	default n

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Hide KernelSU/SUSFS symbols"
          	depends on KSU_SUSFS
          	default n
          '''
          if "config KSU_SUSFS\n" not in data:
              pos = data.rfind("endmenu")
              if pos < 0:
                  raise SystemExit("Cannot add SUSFS options: endmenu missing in official Kconfig")
              data = data[:pos] + block + "\n" + data[pos:]
              path.write_text(data)
          required = [
              "config KSU_SUSFS\n",
              "config KSU_SUSFS_SUS_PATH\n",
              "config KSU_SUSFS_SUS_KSTAT\n",
              "config KSU_SUSFS_SUS_OVERLAYFS\n",
              "config KSU_SUSFS_SPOOF_UNAME\n",
              "config KSU_SUSFS_OPEN_REDIRECT\n",
          ]
          final = path.read_text()
          for item in required:
              if item not in final:
                  raise SystemExit(f"Missing official-tag SUSFS Kconfig option: {item.strip()}")
          PYKCONFIG

          rm -rf drivers/kernelsu
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            python3 - <<'PYDRIVERKCONFIG'
          from pathlib import Path
          p = Path('drivers/Kconfig')
          s = p.read_text()
          marker = 'endmenu'
          i = s.rfind(marker)
          if i < 0:
              raise SystemExit('Could not find final endmenu in drivers/Kconfig')
          s = s[:i] + 'source "drivers/kernelsu/Kconfig"\n\n' + s[i:]
          p.write_text(s)
          PYDRIVERKCONFIG

          test -L drivers/kernelsu
          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "Integrated official KernelSU-Next ${KSU_TAG} (${ACTUAL_COMMIT}); SUSFS kernel options added separately."


      - name: Adapt official KernelSU-Next file wrapper for Samsung 4.19 VFS API
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("KernelSU-Next/kernel/infra/file_wrapper.c")
          header_path = Path("include/linux/fs.h")
          if not source_path.is_file() or not header_path.is_file():
              raise SystemExit("KernelSU-Next file_wrapper.c or kernel fs.h is missing")

          source = source_path.read_text()
          header = header_path.read_text()
          match = re.search(
              r"struct file_operations\s*\{(.*?)\}\s*(?:__randomize_layout)?\s*;",
              header,
              flags=re.S,
          )
          if not match:
              raise SystemExit("Could not inspect struct file_operations in include/linux/fs.h")
          fops = match.group(1)

          def has_member(name):
              return re.search(r"\(\s*\*\s*" + re.escape(name) + r"\s*\)", fops) is not None

          changed = []

          # Some Samsung 4.19 trees omit iopoll despite the nominal kernel version.
          if not has_member("iopoll"):
              pattern = re.compile(
                  r"#if LINUX_VERSION_CODE >= KERNEL_VERSION\(6, 1, 0\)\s*\n"
                  r"static int ksu_wrapper_iopoll\(.*?\n#endif\s*\n",
                  flags=re.S,
              )
              source, count = pattern.subn("", source, count=1)
              if count != 1:
                  raise SystemExit("Could not isolate the official iopoll wrapper block")
              source, count = re.subn(
                  r"^[ \t]*p->ops\.iopoll\s*=\s*fp->f_op->iopoll\s*\?\s*"
                  r"ksu_wrapper_iopoll\s*:\s*NULL;[ \t]*\n",
                  "",
                  source,
                  count=1,
                  flags=re.M,
              )
              if count != 1:
                  raise SystemExit("Could not remove the unavailable iopoll assignment")
              changed.append("omitted iopoll (not present in target file_operations)")

          # The target 4.19 tree exposes clone/dedupe callbacks instead of remap_file_range.
          if not has_member("remap_file_range"):
              if not has_member("clone_file_range") or not has_member("dedupe_file_range"):
                  raise SystemExit(
                      "Target fs.h has no remap_file_range and does not expose both "
                      "clone_file_range/dedupe_file_range; refusing an unsafe compatibility edit"
                  )

              start_marker = "// no REMAP_FILE_DEDUP: use file_in"
              end_marker = "static int ksu_wrapper_fadvise("
              start = source.find(start_marker)
              end = source.find(end_marker, start + 1) if start >= 0 else -1
              if start < 0 or end < 0:
                  if "ksu_wrapper_clone_file_range" not in source or "ksu_wrapper_dedupe_file_range" not in source:
                      raise SystemExit("Could not locate official remap wrapper block for 4.19 adaptation")
              else:
                  legacy_wrappers = r'''static int ksu_wrapper_clone_file_range(struct file *file_in, loff_t pos_in,
                                               struct file *file_out, loff_t pos_out,
                                               u64 len)
          {
              struct ksu_file_wrapper *data = file_in->private_data;
              struct file *orig = data->orig;
              if (!orig->f_op->clone_file_range) {
                  return -EOPNOTSUPP;
              }
              return orig->f_op->clone_file_range(orig, pos_in, file_out, pos_out, len);
          }

          static int ksu_wrapper_dedupe_file_range(struct file *file_in, loff_t pos_in,
                                                  struct file *file_out, loff_t pos_out,
                                                  u64 len)
          {
              struct ksu_file_wrapper *data = file_out->private_data;
              struct file *orig = data->orig;
              if (!orig->f_op->dedupe_file_range) {
                  return -EOPNOTSUPP;
              }
              return orig->f_op->dedupe_file_range(file_in, pos_in, orig, pos_out, len);
          }

                  '''
                  source = source[:start] + legacy_wrappers + source[end:]

              assignment = re.compile(
                  r"^[ \t]*p->ops\.remap_file_range\s*=\s*\n"
                  r"[ \t]*fp->f_op->remap_file_range\s*\?\s*"
                  r"ksu_wrapper_remap_file_range\s*:\s*NULL;[ \t]*\n",
                  flags=re.M,
              )
              source, count = assignment.subn(
                  "    p->ops.clone_file_range =\n"
                  "        fp->f_op->clone_file_range ? ksu_wrapper_clone_file_range : NULL;\n"
                  "    p->ops.dedupe_file_range =\n"
                  "        fp->f_op->dedupe_file_range ? ksu_wrapper_dedupe_file_range : NULL;\n",
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not replace remap_file_range assignment with 4.19 callbacks")
              changed.append("mapped remap callback to 4.19 clone/dedupe callbacks")

          if "p->ops.iopoll" in source or "fp->f_op->iopoll" in source:
              if not has_member("iopoll"):
                  raise SystemExit("Unavailable iopoll member remains in KernelSU-Next file_wrapper.c")
          if "REMAP_FILE_DEDUP" in source or "fp->f_op->remap_file_range" in source:
              if not has_member("remap_file_range"):
                  raise SystemExit("Unavailable remap_file_range API remains after adaptation")
          for required in (
              "static int ksu_wrapper_clone_file_range",
              "static int ksu_wrapper_dedupe_file_range",
              "p->ops.clone_file_range",
              "p->ops.dedupe_file_range",
          ):
              if not has_member("remap_file_range") and required not in source:
                  raise SystemExit(f"4.19 file-wrapper verification failed: {required}")

          source_path.write_text(source)
          print("KernelSU-Next file-wrapper API adaptation verified:")
          for item in changed:
              print(f" - {item}")
          if not changed:
              print(" - no changes needed; target fs.h already exposes required callbacks")
          PY



      - name: Adapt official KernelSU-Next mount namespace and seccomp cache for Linux 4.19
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Linux 4.19 Samsung source has no include/uapi/linux/mount.h.
          # linux/fs.h already includes uapi/linux/fs.h, which defines MS_PRIVATE/MS_REC.
          mount_path = Path("KernelSU-Next/kernel/infra/su_mount_ns.c")
          mount_source = mount_path.read_text()
          missing_header = "#include <uapi/linux/mount.h>"
          if missing_header in mount_source:
              mount_source = mount_source.replace(missing_header + "\n", "", 1)
              mount_path.write_text(mount_source)
              print("Removed unavailable uapi/linux/mount.h include from su_mount_ns.c")
          if missing_header in mount_path.read_text():
              raise SystemExit("su_mount_ns.c still includes the unavailable uapi/linux/mount.h")
          if "#include <linux/fs.h>" not in mount_path.read_text():
              raise SystemExit("su_mount_ns.c must retain linux/fs.h for Linux 4.19 mount flags")

          uapi_fs = Path("include/uapi/linux/fs.h").read_text()
          for macro in ("MS_PRIVATE", "MS_REC"):
              if macro not in uapi_fs:
                  raise SystemExit(f"Target kernel lacks expected legacy mount flag: {macro}")

          # 2) Older kernels do not implement the SECCOMP_ARCH_NATIVE_NR cache
          # ABI/struct layout expected by the official v3.4.1 seccomp-cache helper.
          # Provide no-op helpers when that kernel API is absent; never overlay an
          # incompatible modern struct seccomp_filter layout onto Linux 4.19.
          seccomp_path = Path("KernelSU-Next/kernel/infra/seccomp_cache.c")
          seccomp_source = seccomp_path.read_text()
          begin_marker = "/* KSU_NEXT_419_SECCOMP_CACHE_COMPAT_BEGIN */"
          end_marker = "/* KSU_NEXT_419_SECCOMP_CACHE_COMPAT_END */"
          if begin_marker not in seccomp_source:
              include_marker = '#include "infra/seccomp_cache.h"'
              if seccomp_source.count(include_marker) != 1:
                  raise SystemExit("Could not find unique seccomp_cache.h include in seccomp_cache.c")
              compat = '''
          /* KSU_NEXT_419_SECCOMP_CACHE_COMPAT_BEGIN */
          #if !defined(SECCOMP_ARCH_NATIVE_NR)
          /* Linux 4.19 has no seccomp decision-cache bitmap to update. */
          void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr)
          {
              (void)filter;
              (void)nr;
          }

          void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr)
          {
              (void)filter;
              (void)nr;
          }
          #else
          /* KSU_NEXT_419_SECCOMP_CACHE_COMPAT_END */
          '''
              seccomp_source = seccomp_source.replace(include_marker, include_marker + "\n" + compat, 1)
              seccomp_source = seccomp_source.rstrip() + "\n#endif /* !defined(SECCOMP_ARCH_NATIVE_NR) fallback */\n"
              seccomp_path.write_text(seccomp_source)

          verify = seccomp_path.read_text()
          if begin_marker not in verify or end_marker not in verify:
              raise SystemExit("seccomp_cache.c compatibility guard was not written")
          if "#if !defined(SECCOMP_ARCH_NATIVE_NR)" not in verify:
              raise SystemExit("seccomp_cache.c legacy seccomp-cache fallback is missing")
          if not verify.rstrip().endswith("#endif /* !defined(SECCOMP_ARCH_NATIVE_NR) fallback */"):
              raise SystemExit("seccomp_cache.c compatibility guard is not closed at EOF")
          print("Official KernelSU-Next Linux 4.19 mount/seccomp compatibility checks passed")
          PY

      - name: Adapt official KernelSU-Next pkg_observer for Samsung 4.19 APIs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PYKSUPKG'
          from pathlib import Path
          import re

          source_path = Path("KernelSU-Next/kernel/manager/pkg_observer.c")
          task_header_path = Path("include/linux/task_work.h")
          task_impl_path = Path("kernel/task_work.c")
          fsnotify_header_path = Path("include/linux/fsnotify_backend.h")

          for path in (source_path, task_header_path, task_impl_path, fsnotify_header_path):
              if not path.is_file():
                  raise SystemExit(f"Required compatibility source/header missing: {path}")

          source = source_path.read_text()
          task_header = task_header_path.read_text()
          task_impl = task_impl_path.read_text()
          fsnotify_header = fsnotify_header_path.read_text()
          changes = []

          # This Samsung 4.19 tree uses task_work_add(task, work, bool notify),
          # not the newer TWA_RESUME enum. true preserves notify-resume behavior.
          declaration = re.search(r"\bint\s+task_work_add\s*\(([^;]*?)\)\s*;", task_header, re.S)
          if not declaration:
              raise SystemExit("Could not parse task_work_add() declaration in include/linux/task_work.h")
          decl_text = re.sub(r"\s+", " ", declaration.group(1)).strip()
          if re.search(r"\bbool\b", decl_text):
              if "TWA_RESUME" in source:
                  if not re.search(r"if\s*\(\s*notify\s*\)\s*\{?\s*set_notify_resume\(task\)", task_impl):
                      raise SystemExit("task_work_add(bool) does not show the expected notify-resume behavior; refusing unsafe replacement")
                  source, count = re.subn(r"\bTWA_RESUME\b", "true", source)
                  if count != 1:
                      raise SystemExit(f"Expected one TWA_RESUME use in pkg_observer.c, found {count}")
                  changes.append("replaced TWA_RESUME with true for this kernel's bool notify API")
          elif "TWA_RESUME" not in task_header:
              raise SystemExit(f"Unsupported task_work_add() API: {decl_text}")

          # Detect the callback shape actually declared by this kernel instead of
          # assuming the newer KernelSU-Next fsnotify interface exists on 4.19.
          ops = re.search(r"struct\s+fsnotify_ops\s*\{(.*?)\n\s*\};", fsnotify_header, re.S)
          if not ops:
              raise SystemExit("Could not find struct fsnotify_ops in fsnotify_backend.h")
          callback = re.search(
              r"\bint\s*\(\s*\*\s*(handle_\w+)\s*\)\s*\((.*?)\)\s*;",
              ops.group(1), re.S
          )
          if not callback:
              raise SystemExit("Could not identify the integer fsnotify callback in struct fsnotify_ops")
          callback_name = callback.group(1)
          callback_args = re.sub(r"\s+", " ", callback.group(2)).strip()

          handler_pattern = re.compile(
              r"static\s+int\s+ksu_handle_inode_event\s*\(.*?\n\s*\}\s*(?=static\s+const\s+struct\s+fsnotify_ops)",
              re.S,
          )
          handler_match = handler_pattern.search(source)
          if not handler_match:
              raise SystemExit("Could not isolate ksu_handle_inode_event() in pkg_observer.c")

          if "struct fsnotify_group *" in callback_args:
              legacy_handler = r'''static int ksu_handle_inode_event(struct fsnotify_group *group,
                                  struct inode *inode, u32 mask,
                                  const void *data, int data_type,
                                  const unsigned char *file_name, u32 cookie,
                                  struct fsnotify_iter_info *iter_info)
          {
              (void)group;
              (void)inode;
              (void)data;
              (void)data_type;
              (void)cookie;
              (void)iter_info;
              if (!file_name)
                  return 0;
              if (mask & FS_ISDIR)
                  return 0;
              if (!strcmp((const char *)file_name, "packages.list")) {
                  pr_info("packages.list detected: %d\n", mask);
                  ksu_defer_track_throne();
              }
              return 0;
          }
          '''
              source = source[:handler_match.start()] + legacy_handler + source[handler_match.end():]
              changes.append("adapted fsnotify handler to legacy group callback signature")
          elif "struct fsnotify_mark *" in callback_args:
              # The parameter types of the official handler match this mark-based
              # API; only the ops member name may differ on downstream trees.
              changes.append("retained mark-based fsnotify callback signature")
          else:
              raise SystemExit(f"Unsupported fsnotify_ops callback signature: {callback_args}")

          if callback_name != "handle_inode_event":
              assignment = re.compile(r"(?m)^(\s*)\.handle_inode_event\s*=\s*ksu_handle_inode_event\s*,")
              source, count = assignment.subn(r"\1." + callback_name + " = ksu_handle_inode_event,", source, count=1)
              if count != 1:
                  raise SystemExit("Could not change the fsnotify ops member to the kernel's declared callback field")
              changes.append(f"changed fsnotify ops member to .{callback_name}")

          if "#include <linux/string.h>" not in source:
              include_anchor = "#include <linux/slab.h>"
              if include_anchor not in source:
                  raise SystemExit("Could not find a safe include anchor for linux/string.h")
              source = source.replace(include_anchor, include_anchor + "\n#include <linux/string.h>", 1)
              changes.append("added linux/string.h for strcmp")

          source_path.write_text(source)
          verify = source_path.read_text()
          if "TWA_RESUME" in verify and re.search(r"\bbool\b", decl_text):
              raise SystemExit("TWA_RESUME remains despite bool notify API")
          if re.search(r"(?m)^\s*\." + re.escape(callback_name) + r"\s*=\s*ksu_handle_inode_event,", verify) is None:
              raise SystemExit(f"fsnotify callback assignment .{callback_name} failed verification")
          if "struct fsnotify_group *" in callback_args:
              expected = "struct fsnotify_group *group"
              if expected not in verify or "const unsigned char *file_name" not in verify:
                  raise SystemExit("Legacy fsnotify callback signature failed verification")
          print("KernelSU-Next pkg_observer compatibility verified for the target kernel:")
          for change in changes:
              print(" - " + change)
          PYKSUPKG

      - name: Adapt official KernelSU-Next allowlist for Linux 4.19 task APIs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PYALLOWLIST'
          from pathlib import Path
          import re

          source_path = Path("KernelSU-Next/kernel/policy/allowlist.c")
          task_work_path = Path("include/linux/task_work.h")
          sched_task_path = Path("include/linux/sched/task.h")

          for path in (source_path, task_work_path, sched_task_path):
              if not path.is_file():
                  raise SystemExit(f"Required allowlist compatibility file missing: {path}")

          source = source_path.read_text()
          task_work_header = task_work_path.read_text()
          sched_task_header = sched_task_path.read_text()

          # Samsung Linux 4.19 declares task_work_add(task, work, bool notify),
          # where true requests the notify-resume behavior used by TWA_RESUME.
          declaration = re.search(
              r"\bint\s+task_work_add\s*\(([^;]*?)\)\s*;",
              task_work_header,
              flags=re.S,
          )
          if not declaration:
              raise SystemExit("Could not parse task_work_add() declaration from include/linux/task_work.h")
          declaration_args = re.sub(r"\s+", " ", declaration.group(1)).strip()
          legacy_bool_api = bool(re.search(r"\bbool\b", declaration_args))

          if legacy_bool_api:
              call_pattern = re.compile(
                  r"\btask_work_add\s*\(\s*tsk\s*,\s*cb\s*,\s*TWA_RESUME\s*\)"
              )
              source, replacements = call_pattern.subn("task_work_add(tsk, cb, true)", source)
              if replacements == 0 and "task_work_add(tsk, cb, true)" not in source:
                  raise SystemExit("Expected task_work_add(tsk, cb, TWA_RESUME) call not found in allowlist.c")
              if replacements > 1:
                  raise SystemExit(f"Expected at most one allowlist task_work_add replacement, found {replacements}")
              print("Adapted allowlist task_work_add() to legacy bool notify API (true).")
          elif "TWA_RESUME" not in task_work_header:
              raise SystemExit(
                  "Unsupported task_work_add() API: neither legacy bool notify nor TWA_RESUME was detected"
              )

          # This kernel declares put_task_struct() in linux/sched/task.h, which
          # allowlist.c did not include; add the proper declaration header.
          declaration_pattern = re.compile(
              r"\bput_task_struct\s*\(\s*struct\s+task_struct\s*\*"
          )
          if not declaration_pattern.search(sched_task_header):
              raise SystemExit("put_task_struct() declaration not found in include/linux/sched/task.h")

          include = "#include <linux/sched/task.h>"
          if include not in source:
              anchor = "#include <linux/task_work.h>"
              if source.count(anchor) != 1:
                  raise SystemExit("Could not find a unique task_work.h include in policy/allowlist.c")
              source = source.replace(anchor, anchor + "\n" + include, 1)

          source_path.write_text(source)
          verify = source_path.read_text()
          if legacy_bool_api and "task_work_add(tsk, cb, TWA_RESUME)" in verify:
              raise SystemExit("TWA_RESUME remains in allowlist.c despite legacy bool notify API")
          if include not in verify:
              raise SystemExit("linux/sched/task.h include was not added to allowlist.c")
          if not declaration_pattern.search(sched_task_header):
              raise SystemExit("put_task_struct() declaration verification failed")

          print("Verified official KernelSU-Next allowlist compatibility for target Linux 4.19 API.")
          PYALLOWLIST

      - name: Adapt official KernelSU-Next app profile for Linux 4.19 seccomp API
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PYAPPPROFILE'
          from pathlib import Path
          import re

          source_path = Path("KernelSU-Next/kernel/policy/app_profile.c")
          header_path = Path("include/linux/seccomp.h")
          implementation_path = Path("kernel/seccomp.c")
          for path in (source_path, header_path, implementation_path):
              if not path.is_file():
                  raise SystemExit(f"Required app-profile compatibility file missing: {path}")

          source = source_path.read_text()
          header = header_path.read_text()
          implementation = implementation_path.read_text()
          changes = []

          # Determine whether this exact kernel tree's struct seccomp has filter_count.
          struct_match = re.search(r"\bstruct\s+seccomp\s*\{(.*?)\}\s*;", header, flags=re.S)
          if not struct_match:
              raise SystemExit("Could not locate struct seccomp in include/linux/seccomp.h")
          has_filter_count = re.search(r"\bfilter_count\b", struct_match.group(1)) is not None
          filter_count_assignment = re.compile(
              r"^[ \t]*atomic_set\(\s*&current->seccomp\.filter_count\s*,\s*0\s*\);[ \t]*$",
              flags=re.M,
          )
          if not has_filter_count:
              if "current->seccomp.filter_count" in source:
                  source, count = filter_count_assignment.subn(
                      "\t/* Older kernels have no seccomp.filter_count member. */",
                      source,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit("Found filter_count access but could not isolate its atomic_set() statement")
                  changes.append("removed filter_count reset because target struct seccomp lacks that field")
              if "current->seccomp.filter_count" in source:
                  raise SystemExit("Incompatible seccomp.filter_count access remains in app_profile.c")
          else:
              print("Target struct seccomp contains filter_count; preserved its reset.")

          # Linux 4.19 uses put_seccomp_filter(); seccomp_filter_release() and its
          # notification-orphaning behavior were added in a later seccomp API.
          has_release_impl = re.search(
              r"(?m)^\s*(?:static\s+)?void\s+seccomp_filter_release\s*\(\s*struct\s+task_struct\s*\*",
              implementation,
          ) is not None
          if not has_release_impl:
              has_put_decl = re.search(
                  r"\b(?:extern\s+)?void\s+put_seccomp_filter\s*\(\s*struct\s+task_struct\s*\*",
                  header,
              ) is not None
              has_put_impl = re.search(
                  r"(?m)^\s*void\s+put_seccomp_filter\s*\(\s*struct\s+task_struct\s*\*",
                  implementation,
              ) is not None
              if not (has_put_decl and has_put_impl):
                  raise SystemExit(
                      "Target kernel has no seccomp_filter_release() and a verified put_seccomp_filter() fallback was not found"
                  )

              prototype = re.compile(
                  r"(?m)^\s*void\s+seccomp_filter_release\s*\(\s*struct\s+task_struct\s*\*tsk\s*\)\s*;\s*$"
              )
              source, proto_count = prototype.subn(
                  "/* Legacy Linux 4.19 releases seccomp filter references with put_seccomp_filter(). */",
                  source,
                  count=1,
              )
              call = re.compile(r"\bseccomp_filter_release\s*\(\s*fake\s*\)\s*;")
              source, call_count = call.subn("put_seccomp_filter(fake);", source, count=1)
              if proto_count != 1 or call_count != 1:
                  raise SystemExit(
                      f"Could not safely adapt seccomp filter release (prototype={proto_count}, call={call_count})"
                  )
              changes.append("adapted seccomp filter release to the verified Linux 4.19 put_seccomp_filter() API")

          source_path.write_text(source)
          verify = source_path.read_text()
          if not has_filter_count and "current->seccomp.filter_count" in verify:
              raise SystemExit("Verification failed: unsupported filter_count access remains")
          if not has_release_impl:
              if "seccomp_filter_release(fake)" in verify:
                  raise SystemExit("Verification failed: unsupported seccomp_filter_release() call remains")
              if "put_seccomp_filter(fake);" not in verify:
                  raise SystemExit("Verification failed: legacy put_seccomp_filter() call missing")
          print("KernelSU-Next app-profile seccomp compatibility verified:")
          for change in changes:
              print(" - " + change)
          if not changes:
              print(" - no changes required for the target kernel's seccomp API")
          PYAPPPROFILE

      - name: Apply SUSFS with conservative compatibility mode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf SUSFS
          git clone --depth=1 --single-branch --branch "$SUSFS_BRANCH" "$SUSFS_REPO" SUSFS

          PATCH_FILE="SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch"
          test -s "$PATCH_FILE"
          test -s SUSFS/kernel_patches/fs/susfs.c
          test -s SUSFS/kernel_patches/include/linux/susfs.h
          test -s SUSFS/kernel_patches/include/linux/susfs_def.h

          install -m 0644 SUSFS/kernel_patches/fs/susfs.c fs/susfs.c
          install -m 0644 SUSFS/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          install -m 0644 SUSFS/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

          python3 - <<'PYPATCH'
          from pathlib import Path

          source = Path("SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch")
          target = Path("susfs-kernel-4.19-adapted.patch")
          skip_files = {"fs/namespace.c", "include/linux/mount.h"}
          skip_hunks = {
              "fs/dcache.c": {2189},
              "fs/proc/task_mmu.c": {20},
              "include/linux/sched.h": {1509},
              "kernel/sys.c": {1240},
          }
          skipped_files = set()
          skipped_hunks = {name: 0 for name in skip_hunks}
          current_file = ""
          skip_file = False
          skip_hunk = False
          output = []

          for line in source.read_text().splitlines(keepends=True):
              if line.startswith("diff --git "):
                  current_file = line.split(" b/", 1)[1].strip()
                  skip_file = current_file in skip_files
                  skip_hunk = False
                  if skip_file:
                      skipped_files.add(current_file)
                  else:
                      output.append(line)
                  continue

              if skip_file:
                  continue

              if line.startswith("@@ "):
                  skip_hunk = False
                  fields = line.split()
                  old_token = fields[1] if len(fields) > 1 else ""
                  try:
                      old_start = int(old_token.split(",", 1)[0].lstrip("-"))
                  except ValueError:
                      old_start = -1

                  if old_start in skip_hunks.get(current_file, set()):
                      skipped_hunks[current_file] += 1
                      skip_hunk = True
                      continue
                  output.append(line)
                  continue

              if not skip_hunk:
                  output.append(line)

          if skipped_files != skip_files:
              raise SystemExit(f"Patch layout changed; skipped file sections {skipped_files}, expected {skip_files}")
          for name, count in skipped_hunks.items():
              if count != 1:
                  raise SystemExit(f"Patch layout changed for {name}: skipped {count} hunks, expected exactly 1")

          target.write_text("".join(output))
          print("Prepared conservative SUSFS patch; omitted known incompatible hooks.")
          print(f"Omitted file sections: {', '.join(sorted(skipped_files))}")
          for name, count in skipped_hunks.items():
              print(f"Omitted {name} hunk(s): {count}")
          PYPATCH

          if ! patch --batch --forward --fuzz=2 -p1 \
              --dry-run < susfs-kernel-4.19-adapted.patch > susfs-patch-dry-run.log 2>&1; then
            cat susfs-patch-dry-run.log
            echo "Compatible SUSFS hunks failed dry-run; kernel source was not patched by this step." >&2
            exit 1
          fi
          cat susfs-patch-dry-run.log
          patch --batch --forward --fuzz=2 -p1 \
            < susfs-kernel-4.19-adapted.patch 2>&1 | tee susfs-patch.log

          python3 - <<'PYSUSFS'
          from pathlib import Path
          import re

          def read(name):
              p = Path(name)
              if not p.is_file():
                  raise SystemExit(f"Required source missing: {name}")
              return p.read_text()

          def write(name, content):
              Path(name).write_text(content)

          name = "fs/dcache.c"
          s = read(name)
          if "#include <linux/susfs_def.h>" not in s:
              anchor = "#include <linux/list_lru.h>"
              if anchor not in s:
                  raise SystemExit("dcache.c: include anchor not found")
              s = s.replace(
                  anchor,
                  anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n#include <linux/susfs_def.h>\n#endif",
                  1,
              )
          fn = re.search(r"struct dentry \*__d_lookup_rcu\b.*?\n\}", s, flags=re.S)
          if not fn:
              raise SystemExit("dcache.c: __d_lookup_rcu() not found")
          body = fn.group(0)
          marker = "TASK_STRUCT_NON_ROOT_USER_APP_PROC"
          if marker not in body:
              anchor = re.search(
                  r"if \(dentry_cmp\(dentry, str, hashlen_len\(hashlen\)\) != 0\)\s*\n\s*continue;\s*\n",
                  body,
              )
              if not anchor:
                  raise SystemExit("dcache.c: dentry_cmp() insertion anchor not found")
              check = (
                  "\t\t#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\t\tif (dentry->d_inode && unlikely(dentry->d_inode->i_state & INODE_STATE_SUS_PATH) && "
                  "likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC)) {\n"
                  "\t\t\tcontinue;\n"
                  "\t\t}\n"
                  "\t\t#endif\n"
              )
              body = body[:anchor.end()] + check + body[anchor.end():]
              s = s[:fn.start()] + body + s[fn.end():]
          write(name, s)

          name = "fs/proc/task_mmu.c"
          s = read(name)
          if "#include <linux/susfs_def.h>" not in s:
              anchor = "#include <linux/mm_inline.h>"
              if anchor in s:
                  s = s.replace(anchor, anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif", 1)
              else:
                  anchor = "#include <asm/elf.h>"
                  if anchor not in s:
                      raise SystemExit("task_mmu.c: no known include anchor found")
                  s = s.replace(anchor, "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n" + anchor, 1)
          write(name, s)

          name = "kernel/sys.c"
          s = read(name)
          marker = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
          start = s.find(marker)
          if start < 0:
              raise SystemExit("sys.c: newuname syscall anchor not found")
          old_uname = s.find("#ifdef __ARCH_WANT_SYS_OLD_UNAME", start)
          if old_uname < 0:
              old_uname = len(s)
          body = s[start:old_uname]
          if "susfs_spoof_uname(&tmp);" not in body:
              if "extern void susfs_spoof_uname(struct new_utsname *tmp);" not in s:
                  prototype = "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern void susfs_spoof_uname(struct new_utsname *tmp);\n#endif\n\n"
                  s = s[:start] + prototype + s[start:]
                  start = s.find(marker)
                  old_uname = s.find("#ifdef __ARCH_WANT_SYS_OLD_UNAME", start)
                  if old_uname < 0:
                      old_uname = len(s)
                  body = s[start:old_uname]
              up = re.search(r"^[ \t]*up_read\(&uts_sem\);", body, flags=re.M)
              if not up:
                  raise SystemExit("sys.c: up_read(&uts_sem) anchor not found in newuname")
              call = "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif\n"
              body = body[:up.start()] + call + body[up.start():]
              s = s[:start] + body + s[old_uname:]
          write(name, s)

          for marker_file, marker in {
              "fs/Makefile": "obj-$(CONFIG_KSU_SUSFS) += susfs.o",
              "fs/dcache.c": "TASK_STRUCT_NON_ROOT_USER_APP_PROC",
              "fs/proc/task_mmu.c": "#include <linux/susfs_def.h>",
              "kernel/sys.c": "susfs_spoof_uname(&tmp);",
              "include/linux/sched.h": "susfs_task_state",
          }.items():
              if marker not in read(marker_file):
                  raise SystemExit(f"SUSFS verification failed: {marker_file}: {marker}")

          if "susfs_mnt_id_backup" in read("include/linux/mount.h"):
              raise SystemExit("Mount-ID field unexpectedly present in conservative mode")
          if list(Path(".").rglob("*.rej")):
              raise SystemExit("Unresolved patch reject files remain")

          Path("susfs-compatibility.log").write_text(
              "SUSFS conservative mode: selected kernel patch hunks applied; mount-ID spoofing and namespace-dependent features omitted.\n"
          )
          print("SUSFS compatible hunks applied and manual anchors verified.")
          PYSUSFS

      - name: Align official v3.4.1 setuid hook with SUSFS task state
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "ERROR at line $LINENO: $BASH_COMMAND (exit=$rc)" >&2; exit "$rc"' ERR
          python3 - <<'PYSUSPATH'
          from pathlib import Path
          import re

          source_path = Path("drivers/kernelsu/hook/setuid_hook.c")
          defs_path = Path("include/linux/susfs_def.h")
          sched_path = Path("include/linux/sched.h")
          for path in (source_path, defs_path, sched_path):
              if not path.is_file():
                  raise SystemExit(f"Required SUS_PATH file missing: {path}")

          source = source_path.read_text()
          defs = defs_path.read_text()
          sched = sched_path.read_text()
          if "TASK_STRUCT_NON_ROOT_USER_APP_PROC" not in defs:
              raise SystemExit("SUSFS task-state flag is absent from susfs_def.h")
          if "susfs_task_state" not in sched:
              raise SystemExit("susfs_task_state field is absent from include/linux/sched.h")

          include = "#include <linux/susfs_def.h>"
          if include not in source:
              anchor = "#include <linux/uidgid.h>"
              if anchor not in source:
                  raise SystemExit("setuid_hook.c: include anchor not found")
              source = source.replace(anchor, anchor + "\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n" + include + "\n#endif", 1)

          task_code = r'''    #ifdef CONFIG_KSU_SUSFS_SUS_PATH
              /* Mark non-root Android application UIDs for SUSFS path filtering. */
              if (new_uid != (uid_t)-1) {
                  uid_t appid = new_uid % 100000;
                  if (appid >= 10000 && appid <= 19999 &&
                      !ksu_is_allow_uid_for_current(new_uid)) {
                      current->susfs_task_state |= TASK_STRUCT_NON_ROOT_USER_APP_PROC;
                  } else {
                      current->susfs_task_state &= ~TASK_STRUCT_NON_ROOT_USER_APP_PROC;
                  }
              }
          #endif
          '''
          if "current->susfs_task_state |= TASK_STRUCT_NON_ROOT_USER_APP_PROC;" not in source:
              anchor_re = re.compile(
                  r'(?m)^[ \t]*pr_info\("handle_setresuid from %d to %d\\n", old_uid, new_uid\);[ \t]*$'
              )
              m = anchor_re.search(source)
              if not m:
                  raise SystemExit("Could not locate official v3.4.1 ksu_handle_setresuid() insertion anchor")
              source = source[:m.end()] + "\n" + task_code + source[m.end():]

          source_path.write_text(source)
          verify = source_path.read_text()
          if include not in verify or "current->susfs_task_state |= TASK_STRUCT_NON_ROOT_USER_APP_PROC;" not in verify:
              raise SystemExit("Official v3.4.1 SUS_PATH setuid hook verification failed")
          if "ksu_handle_setresuid" not in verify:
              raise SystemExit("Official v3.4.1 setuid handler was not found")
          print("Official v3.4.1 setuid hook aligned with SUSFS task-state marker.")
          PYSUSPATH

          grep -Fq 'TASK_STRUCT_NON_ROOT_USER_APP_PROC' drivers/kernelsu/hook/setuid_hook.c
          echo "Official v3.4.1 SUS_PATH source alignment verified."

      - name: Configure kernel and KernelSU-Next SUSFS
        shell: bash
        run: |
          set -Eeuo pipefail
          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" "$DEFCONFIG"

          scripts/config --file .config --enable KSU
          scripts/config --file .config --enable OVERLAY_FS
          scripts/config --file .config --enable KPROBES
          scripts/config --file .config --enable KPROBE_EVENTS
          scripts/config --file .config --enable EXT4_FS
          scripts/config --file .config --enable KSU_SUSFS
          scripts/config --file .config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          scripts/config --file .config --enable KSU_SUSFS_SUS_PATH
          scripts/config --file .config --disable KSU_SUSFS_SUS_MOUNT
          scripts/config --file .config --disable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          scripts/config --file .config --disable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          scripts/config --file .config --enable KSU_SUSFS_SUS_KSTAT
          scripts/config --file .config --enable KSU_SUSFS_SUS_OVERLAYFS
          scripts/config --file .config --disable KSU_SUSFS_TRY_UMOUNT
          scripts/config --file .config --disable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          scripts/config --file .config --enable KSU_SUSFS_SPOOF_UNAME
          scripts/config --file .config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --file .config --enable KSU_SUSFS_OPEN_REDIRECT
          scripts/config --file .config --enable KSU_SUSFS_SUS_SU
          scripts/config --file .config --enable KSU_SUSFS_ENABLE_LOG
          scripts/config --file .config --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          scripts/config --file .config --set-str LOCALVERSION '-MAX-ARAF'
          scripts/config --file .config --disable LOCALVERSION_AUTO

          make ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" olddefconfig

          KERNELRELEASE="$(make -s ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" kernelrelease)"
          echo "Configured kernel release: $KERNELRELEASE"
          echo "Requested localversion: $KERNEL_LOCALVERSION"
          case "$KERNELRELEASE" in
            *MAX-ARAF*) ;;
            *) echo "MAX-ARAF is missing from kernel release: $KERNELRELEASE" >&2; exit 1 ;;
          esac

          for option in \
            CONFIG_KSU=y \
            CONFIG_KPROBES=y \
            CONFIG_KPROBE_EVENTS=y \
            CONFIG_EXT4_FS=y \
            CONFIG_OVERLAY_FS=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SUS_KSTAT=y \
            CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=y; do
            if ! grep -qx "$option" .config; then
              echo "Required kernel config is missing: $option" >&2
              exit 1
            fi
          done

          for option in \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            CONFIG_KSU_SUSFS_TRY_UMOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT; do
            if grep -qx "$option=y" .config; then
              echo "Unexpected namespace-dependent feature enabled: $option" >&2
              exit 1
            fi
          done

          grep -q '^CONFIG_LOCALVERSION="-MAX-ARAF"$' .config
          echo "KernelSU and conservative SUSFS feature configs verified."

      - name: Generate SELinux headers
        shell: bash
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" \
            scripts 2>&1 | tee scripts-build.log
          test -x scripts/selinux/genheaders/genheaders
          scripts/selinux/genheaders/genheaders \
            security/selinux/flask.h security/selinux/av_permissions.h
          test -s security/selinux/flask.h
          test -s security/selinux/av_permissions.h
          echo "SELinux headers generated successfully."

      - name: Preflight compile KernelSU-Next and SUSFS
        shell: bash
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" \
            drivers/kernelsu/ 2>&1 | tee ksu-preflight.log
          echo "KernelSU/SUSFS preflight compile completed."
          grep -E -- 'KernelSU(-Next)? version:|KernelSU-Next tag:|Manager signature hash|Manager signature size|SUSFS_VERSION' \
            ksu-preflight.log || true
          grep -Fq -- "-- KernelSU-Next version: ${KSU_EXPECTED_VERSION}" ksu-preflight.log || {
            echo "Wrong driver version: expected ${KSU_EXPECTED_VERSION} from official ${KSU_TAG}." >&2
            exit 1
          }
          grep -Fq -- "-- KernelSU-Next tag: ${KSU_TAG}" ksu-preflight.log
          grep -Fq -- "-- KernelSU-Next Manager signature size: ${KSU_NEXT_EXPECTED_SIZE}" ksu-preflight.log
          grep -Fq -- "-- KernelSU-Next Manager signature hash: ${KSU_NEXT_EXPECTED_HASH}" ksu-preflight.log
          echo "Verified official KernelSU-Next ${KSU_TAG} driver version ${KSU_EXPECTED_VERSION} and Manager signature fingerprint."

      - name: Build kernel Image and DTBs
        shell: bash
        run: |
          set -euo pipefail
          make -j2 ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" \
            Image Image.gz dtbs 2>&1 | tee kernel-build.log

          test -s arch/arm64/boot/Image
          test -s arch/arm64/boot/Image.gz
          find arch/arm64/boot/dts -type f -name '*.dtb' -print -quit | grep -q .
          find arch/arm64/boot/dts -type f -name '*.dtbo' -print -quit | grep -q .

          grep -aFq 'Linux version 4.19.325' arch/arm64/boot/Image
          grep -aFq 'MAX-ARAF' arch/arm64/boot/Image
          KERNELRELEASE="$(make -s ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" kernelrelease)"
          case "$KERNELRELEASE" in
            *MAX-ARAF*) echo "Verified final kernel release: $KERNELRELEASE" ;;
            *) echo "Final kernel release is missing MAX-ARAF: $KERNELRELEASE" >&2; exit 1 ;;
          esac

          echo "Kernel Image, Image.gz and device-tree outputs verified."

      - name: Package non-flashable kernel build artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/A13-KernelSU-Next-SUSFS-MAX-ARAF-${GITHUB_RUN_NUMBER}-BUILD-ARTIFACTS.zip"
          STAGE="$RUNNER_TEMP/a13-kernel-artifacts"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/dts"

          cp arch/arm64/boot/Image "$STAGE/"
          cp arch/arm64/boot/Image.gz "$STAGE/"
          find arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp --parents '{}' "$STAGE/dts/" \;

          make -s ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" LOCALVERSION="$KERNEL_LOCALVERSION" \
            kernelrelease > "$STAGE/kernel-release.txt"
          printf '%s\n' \
            'Build artifacts only. This ZIP is NOT a TWRP-flashable package.' \
            'Do not flash Image or Image.gz directly.' \
            'A device-verified boot-image packaging method is required before flashing.' \
            > "$STAGE/FLASHING-WARNING.txt"

          cd "$STAGE"
          zip -qr "$OUTPUT" .
          unzip -t "$OUTPUT"
          echo "Created non-flashable artifact bundle: $OUTPUT"

      - name: Upload kernel build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-SUSFS-MAX-ARAF-${{ github.run_number }}-BUILD-ARTIFACTS
          path: A13-KernelSU-Next-SUSFS-MAX-ARAF-${{ github.run_number }}-BUILD-ARTIFACTS.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A13-KernelSU-Next-SUSFS-diagnostics-${{ github.run_number }}
          path: |
            susfs-patch.log
            susfs-patch-dry-run.log
            susfs-compatibility.log
            scripts-build.log
            ksu-preflight.log
            kernel-build.log
            .config
            SUSFS/kernel_patches/50_add_susfs_in_kernel-4.19.patch
            susfs-kernel-4.19-adapted.patch
            KernelSU-Next/kernel/Kbuild
            KernelSU-Next/kernel/infra/su_mount_ns.c
            KernelSU-Next/kernel/infra/seccomp_cache.c
            KernelSU-Next/kernel/manager/pkg_observer.c
            KernelSU-Next/kernel/policy/app_profile.c
            include/linux/seccomp.h
            kernel/seccomp.c
            include/linux/task_work.h
            kernel/task_work.c
            include/linux/fsnotify_backend.h
            drivers/kernelsu/hook/setuid_hook.c
            fs/dcache.c
            include/linux/sched.h
            include/linux/susfs_def.h
          if-no-files-found: warn
          retention-days: 7
